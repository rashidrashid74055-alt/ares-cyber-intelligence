<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050306">
<title>ARES AI</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#030204;
  color:#f5f7f8;
  font-family:
    Inter,
    "Segoe UI",
    Roboto,
    Helvetica,
    Arial,
    sans-serif;
}

button,
textarea{
  font:inherit;
}

/* =========================================================
   BACKGROUND
========================================================= */

.background{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:
    radial-gradient(
      ellipse at 50% 30%,
      rgba(93,7,27,.26),
      rgba(22,3,10,.38) 42%,
      #030204 82%
    );
}

.redAtmosphere{
  position:absolute;
  inset:-20%;

  background:
    radial-gradient(
      ellipse at 48% 22%,
      rgba(160,9,40,.19),
      transparent 45%
    ),
    radial-gradient(
      ellipse at 20% 65%,
      rgba(115,4,28,.13),
      transparent 42%
    ),
    radial-gradient(
      ellipse at 80% 60%,
      rgba(110,5,30,.12),
      transparent 44%
    );

  pointer-events:none;
}

/* Very subtle grid behind boxes */

.redGrid{
  position:absolute;
  inset:0;

  background-image:
    linear-gradient(
      rgba(112,7,31,.09) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(112,7,31,.09) 1px,
      transparent 1px
    );

  background-size:42px 42px;

  opacity:.75;
}

/* =========================================================
   RED BOXES
========================================================= */

.redBoxes{
  position:absolute;
  inset:0;

  pointer-events:none;

  overflow:hidden;
}

.redBox{
  position:absolute;

  border-radius:5px;

  border:
    1px solid rgba(255,35,76,.30);

  background:
    linear-gradient(
      135deg,
      rgba(116,5,31,.23),
      rgba(67,3,19,.13)
    );

  box-shadow:
    inset 0 1px rgba(255,80,110,.08),
    inset 0 0 28px rgba(145,5,40,.08);

  opacity:.9;
}

/* Different depths */

.redBox.deep{
  opacity:.48;
  transform:scale(.92);
}

.redBox.medium{
  opacity:.68;
}

.redBox.bright{
  opacity:.9;

  border-color:
    rgba(255,36,77,.42);

  background:
    linear-gradient(
      135deg,
      rgba(142,7,38,.27),
      rgba(72,3,21,.15)
    );
}

/* =========================================================
   DIGITAL RAIN
========================================================= */

#digitalRain{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  pointer-events:none;

  opacity:.70;

  filter:
    saturate(.90)
    contrast(1.03);
}

/* Soft depth layer */

.rainDepth{
  position:absolute;
  inset:0;

  pointer-events:none;

  background:
    radial-gradient(
      ellipse at center,
      transparent 35%,
      rgba(0,0,0,.30) 100%
    );
}

/* =========================================================
   APP
========================================================= */

.app{
  position:relative;
  z-index:5;

  width:100%;
  height:100%;

  display:flex;
}

/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{
  width:255px;
  height:100%;

  flex-shrink:0;

  padding:15px;

  background:
    rgba(4,3,5,.91);

  border-right:
    1px solid rgba(255,255,255,.055);

  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);

  display:flex;
  flex-direction:column;
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;

  padding:
    2px 4px 17px;
}

.logo{
  position:relative;

  width:39px;
  height:39px;

  display:grid;
  place-items:center;

  border-radius:12px;

  background:
    linear-gradient(
      145deg,
      #981535 0%,
      #4d081c 45%,
      #17030a 100%
    );

  border:
    1px solid rgba(255,65,100,.30);

  box-shadow:
    inset 0 1px rgba(255,255,255,.10),
    0 8px 35px rgba(120,0,35,.20);

  color:#fff;

  font-size:17px;
  font-weight:900;
  letter-spacing:-1px;
}

.logo::after{
  content:"";

  position:absolute;
  inset:4px;

  border-radius:9px;

  border:
    1px solid rgba(255,255,255,.07);
}

.brandName{
  font-size:15px;
  font-weight:800;
  letter-spacing:.3px;
}

.brandSub{
  margin-top:2px;

  color:#687074;

  font-size:8px;
  letter-spacing:1.5px;
  text-transform:uppercase;
}

.newChat{
  width:100%;

  padding:11px;

  border-radius:9px;

  border:
    1px solid rgba(218,26,66,.28);

  background:
    linear-gradient(
      135deg,
      rgba(122,6,31,.22),
      rgba(52,3,15,.15)
    );

  color:#eee;

  text-align:left;

  cursor:pointer;

  font-size:11px;

  transition:.18s;
}

.newChat:hover{
  border-color:
    rgba(240,35,75,.40);

  background:
    rgba(130,7,35,.27);
}

.historyTitle{
  margin:
    20px 5px 8px;

  color:#555d61;

  font-size:8px;
  letter-spacing:1.6px;
  text-transform:uppercase;
}

.history{
  flex:1;

  overflow-y:auto;
}

.historyItem{
  width:100%;

  display:block;

  padding:9px;

  margin-bottom:3px;

  border:
    1px solid transparent;

  border-radius:8px;

  background:transparent;

  color:#81898d;

  text-align:left;

  font-size:10px;

  white-space:nowrap;

  overflow:hidden;
  text-overflow:ellipsis;

  cursor:pointer;
}

.historyItem:hover{
  background:
    rgba(255,255,255,.028);

  color:#bfc5c7;
}

.historyItem.active{
  color:#fff;

  background:
    linear-gradient(
      90deg,
      rgba(126,7,32,.25),
      rgba(126,7,32,.07)
    );

  border-color:
    rgba(205,24,59,.20);
}

.footer{
  padding:
    12px 4px 2px;

  color:#41484b;

  font-size:8px;
}

/* =========================================================
   MAIN
========================================================= */

.main{
  position:relative;

  min-width:0;

  flex:1;

  height:100%;

  display:flex;
  flex-direction:column;
}

.topbar{
  position:relative;

  z-index:20;

  height:60px;

  flex-shrink:0;

  display:flex;
  align-items:center;

  padding:0 18px;

  background:
    rgba(3,3,5,.70);

  border-bottom:
    1px solid rgba(255,255,255,.055);

  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

.mobileMenu{
  display:none;
}

.title{
  font-size:13px;
  font-weight:800;

  letter-spacing:.15px;
}

.status{
  display:flex;
  align-items:center;
  gap:5px;

  margin-top:3px;

  color:#687174;

  font-size:8px;
}

.statusDot{
  width:5px;
  height:5px;

  border-radius:50%;

  background:#52dba1;

  box-shadow:
    0 0 8px rgba(82,219,161,.45);
}

/* =========================================================
   MESSAGES
========================================================= */

.messages{
  position:relative;

  z-index:4;

  flex:1;

  overflow-y:auto;

  padding:
    35px
    max(18px,calc((100% - 920px)/2))
    170px;
}

.empty{
  min-height:100%;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  text-align:center;
}

.emptyLogo{
  position:relative;

  width:74px;
  height:74px;

  display:grid;
  place-items:center;

  border-radius:21px;

  background:
    linear-gradient(
      145deg,
      #a0183e,
      #5c0a22 40%,
      #1c040d
    );

  border:
    1px solid rgba(255,61,101,.35);

  box-shadow:
    inset 0 1px rgba(255,255,255,.13),
    0 20px 65px rgba(112,0,35,.28);

  font-size:27px;
  font-weight:900;
  letter-spacing:-2px;
}

.emptyLogo::before{
  content:"";

  position:absolute;
  inset:5px;

  border-radius:17px;

  border:
    1px solid rgba(255,255,255,.08);
}

.emptyLogo::after{
  content:"";

  position:absolute;

  width:8px;
  height:8px;

  right:11px;
  top:11px;

  border-radius:50%;

  background:#65e6ad;

  box-shadow:
    0 0 12px rgba(101,230,173,.7);
}

.empty h1{
  margin:
    18px 0 0;

  font-size:39px;

  line-height:1;

  letter-spacing:-2px;

  background:
    linear-gradient(
      90deg,
      #ffffff,
      #cfd5d8,
      #ffffff
    );

  -webkit-background-clip:text;
  background-clip:text;

  color:transparent;
}

.empty p{
  margin:
    9px 0 0;

  color:#727a7e;

  font-size:11px;
}

/* =========================================================
   MESSAGE
========================================================= */

.message{
  display:flex;

  gap:9px;

  max-width:920px;

  margin:
    0 auto 23px;

  animation:
    messageIn .18s ease;
}

@keyframes messageIn{
  from{
    opacity:0;
    transform:translateY(5px);
  }

  to{
    opacity:1;
    transform:none;
  }
}

.message.user{
  justify-content:flex-end;
}

.avatar{
  width:31px;
  height:31px;

  flex:0 0 31px;

  display:grid;
  place-items:center;

  border-radius:9px;

  background:
    linear-gradient(
      145deg,
      rgba(136,10,39,.40),
      rgba(42,3,14,.42)
    );

  border:
    1px solid rgba(225,29,67,.19);

  color:#ff8da6;

  font-size:7px;
  font-weight:900;

  letter-spacing:.4px;
}

.message.user .avatar{
  order:2;

  color:#b9c2c5;

  background:
    rgba(255,255,255,.035);

  border-color:
    rgba(255,255,255,.07);
}

.body{
  max-width:
    min(790px,calc(100% - 40px));
}

.bubble{
  padding:
    13px 15px;

  border-radius:15px;

  line-height:1.72;

  font-size:13px;

  background:
    linear-gradient(
      135deg,
      rgba(11,15,19,.90),
      rgba(38,7,19,.82)
    );

  border:
    1px solid rgba(255,255,255,.075);

  box-shadow:
    inset 0 1px rgba(255,255,255,.045),
    0 16px 50px rgba(0,0,0,.30);

  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
}

.message.user .bubble{
  background:
    linear-gradient(
      135deg,
      rgba(124,8,36,.53),
      rgba(53,5,19,.85),
      rgba(8,8,11,.84)
    );

  border-color:
    rgba(229,32,72,.22);
}

/* =========================================================
   CODE
========================================================= */

.codeCard{
  margin:13px 0;

  overflow:hidden;

  border-radius:13px;

  background:
    linear-gradient(
      135deg,
      rgba(3,22,37,.96),
      rgba(5,13,31,.96),
      rgba(5,30,39,.94)
    );

  border:
    1px solid rgba(52,158,231,.29);

  box-shadow:
    inset 0 1px rgba(255,255,255,.045),
    0 18px 50px rgba(0,0,0,.38);
}

.codeHead{
  height:35px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 10px;

  background:
    linear-gradient(
      90deg,
      rgba(35,130,210,.10),
      rgba(24,201,190,.06)
    );

  border-bottom:
    1px solid rgba(71,174,236,.12);
}

.codeLang{
  color:#62c4ff;

  font-size:8px;
  font-weight:900;

  letter-spacing:1.1px;

  text-transform:uppercase;
}

.copy{
  padding:
    5px 9px;

  border-radius:6px;

  border:
    1px solid rgba(255,255,255,.10);

  background:
    rgba(255,255,255,.045);

  color:#b9c8cf;

  font-size:8px;

  cursor:pointer;
}

.copy:hover{
  background:
    rgba(42,151,225,.16);

  color:#fff;
}

pre.code{
  margin:0;

  padding:14px;

  overflow-x:auto;

  color:#dff4ff;

  font-family:
    "JetBrains Mono",
    "SFMono-Regular",
    Consolas,
    monospace;

  font-size:11px;

  line-height:1.72;
}

.inline{
  padding:
    2px 5px;

  border-radius:5px;

  background:
    rgba(47,156,220,.10);

  color:#66caff;

  font-family:monospace;
}

/* =========================================================
   ACTIONS
========================================================= */

.actions{
  display:flex;
  gap:2px;

  margin-top:3px;

  opacity:.54;
}

.action{
  width:27px;
  height:27px;

  display:grid;
  place-items:center;

  border:0;

  border-radius:7px;

  background:transparent;

  color:#8d979b;

  cursor:pointer;

  transition:.15s;
}

.action:hover{
  color:#fff;

  background:
    rgba(255,255,255,.055);
}

/* =========================================================
   COMPOSER
========================================================= */

.composerWrap{
  position:absolute;

  z-index:30;

  left:0;
  right:0;
  bottom:0;

  padding:
    13px
    max(18px,calc((100% - 920px)/2))
    13px;

  background:
    linear-gradient(
      180deg,
      transparent,
      rgba(3,3,4,.94) 32%,
      rgba(3,3,4,.99)
    );

  pointer-events:none;
}

.composer{
  pointer-events:auto;

  display:flex;
  align-items:flex-end;

  gap:7px;

  padding:7px;

  border-radius:16px;

  background:
    linear-gradient(
      135deg,
      rgba(18,7,13,.91),
      rgba(5,10,14,.93)
    );

  border:
    1px solid rgba(255,255,255,.085);

  box-shadow:
    inset 0 1px rgba(255,255,255,.045),
    0 20px 75px rgba(0,0,0,.55);

  backdrop-filter:blur(23px);
  -webkit-backdrop-filter:blur(23px);
}

#input{
  flex:1;

  min-width:0;

  min-height:40px;
  max-height:150px;

  resize:none;

  outline:none;
  border:0;

  background:transparent;

  color:#f3f6f7;

  padding:
    9px 7px;

  font-size:13px;

  line-height:1.5;
}

#input::placeholder{
  color:#626b6f;
}

.icon{
  width:39px;
  height:39px;

  flex:0 0 39px;

  display:grid;
  place-items:center;

  border-radius:11px;

  border:
    1px solid rgba(255,255,255,.07);

  background:
    rgba(255,255,255,.035);

  color:#b1babc;

  cursor:pointer;
}

.icon:hover{
  background:
    rgba(255,255,255,.075);

  color:#fff;
}

.send{
  color:white;

  background:
    linear-gradient(
      145deg,
      #8c1636,
      #410816
    );

  border-color:
    rgba(242,43,82,.22);
}

.send:hover{
  background:
    linear-gradient(
      145deg,
      #a91b43,
      #500a1b
    );
}

.mic.listening{
  color:#63e5a9;

  border-color:
    rgba(70,225,150,.30);

  box-shadow:
    0 0 15px rgba(70,225,150,.10);
}

.hint{
  margin-top:6px;

  text-align:center;

  color:#41494c;

  font-size:8px;
}

/* =========================================================
   SPEECH BAR
========================================================= */

/*
   FIX:
   Fixed instead of absolute.
   Very high z-index.
   It can no longer disappear behind
   the messages/composer.
*/

.speech{
  position:fixed;

  z-index:99999;

  top:76px;
  right:18px;

  width:
    min(370px,calc(100vw - 36px));

  min-height:57px;

  display:none;

  align-items:center;

  gap:9px;

  padding:9px;

  border-radius:13px;

  background:
    linear-gradient(
      135deg,
      rgba(8,12,17,.97),
      rgba(22,6,14,.96)
    );

  border:
    1px solid rgba(255,255,255,.10);

  box-shadow:
    0 18px 60px rgba(0,0,0,.60),
    inset 0 1px rgba(255,255,255,.06);

  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
}

.speech.show{
  display:flex;

  animation:
    speechIn .18s ease;
}

@keyframes speechIn{
  from{
    opacity:0;
    transform:
      translateY(-7px)
      scale(.98);
  }

  to{
    opacity:1;
    transform:none;
  }
}

.speakerIcon{
  width:32px;
  height:32px;

  flex:0 0 32px;

  display:grid;
  place-items:center;

  border-radius:9px;

  color:#63c9ff;

  background:
    linear-gradient(
      145deg,
      rgba(31,126,204,.15),
      rgba(24,65,115,.07)
    );

  border:
    1px solid rgba(66,174,235,.12);
}

.speechInfo{
  flex:1;

  min-width:0;
}

.speechTitle{
  font-size:9px;
  font-weight:800;

  color:#e9eef0;
}

.speechLine{
  height:3px;

  margin-top:7px;

  overflow:hidden;

  border-radius:10px;

  background:
    rgba(255,255,255,.075);
}

.progress{
  width:0;
  height:100%;

  border-radius:10px;

  background:
    linear-gradient(
      90deg,
      #2770ff,
      #36b8ff,
      #62d9ff
    );

  box-shadow:
    0 0 10px rgba(52,177,255,.35);
}

.speechBtn{
  width:30px;
  height:30px;

  flex:0 0 30px;

  display:grid;
  place-items:center;

  border:0;

  border-radius:8px;

  background:
    rgba(255,255,255,.055);

  color:#aeb7bb;

  cursor:pointer;
}

.speechBtn:hover{
  color:#fff;

  background:
    rgba(255,255,255,.09);
}

/* =========================================================
   MOBILE
========================================================= */

.overlay{
  display:none;
}

@media(max-width:800px){

  .sidebar{
    position:fixed;

    z-index:1000;

    left:0;
    top:0;
    bottom:0;

    transform:
      translateX(-105%);

    transition:
      transform .25s ease;

    box-shadow:
      25px 0 70px rgba(0,0,0,.65);
  }

  .sidebar.open{
    transform:
      translateX(0);
  }

  .overlay.show{
    display:block;

    position:fixed;

    inset:0;

    z-index:900;

    background:
      rgba(0,0,0,.68);
  }

  .mobileMenu{
    display:grid;
    place-items:center;

    width:35px;
    height:35px;

    margin-right:8px;

    border:0;

    border-radius:8px;

    background:
      rgba(255,255,255,.045);

    color:white;
  }

  .messages{
    padding:
      23px
      10px
      165px;
  }

  .empty h1{
    font-size:31px;
  }

  .composerWrap{
    padding-left:8px;
    padding-right:8px;
  }

  .bubble{
    font-size:12.5px;
  }

  pre.code{
    font-size:10px;
  }

  .redGrid{
    background-size:34px 34px;
  }

  .speech{
    top:68px;
    right:9px;

    width:
      calc(100vw - 18px);
  }
}
</style>
</head>

<body>

<!-- ======================================================
     BACKGROUND
====================================================== -->

<div class="background">

  <div class="redAtmosphere"></div>

  <div class="redGrid"></div>

  <div
    class="redBoxes"
    id="redBoxes">
  </div>

  <canvas
    id="digitalRain">
  </canvas>

  <div class="rainDepth"></div>

</div>


<!-- ======================================================
     APP
====================================================== -->

<div class="app">

  <div
    class="overlay"
    id="overlay">
  </div>


  <!-- SIDEBAR -->

  <aside
    class="sidebar"
    id="sidebar">

    <div class="brand">

      <div class="logo">
        A
      </div>

      <div>

        <div class="brandName">
          ARES AI
        </div>

        <div class="brandSub">
          CYBER INTELLIGENCE
        </div>

      </div>

    </div>


    <button
      class="newChat"
      id="newChat">

      ＋ New Chat

    </button>


    <div class="historyTitle">
      Chats
    </div>


    <div
      class="history"
      id="history">
    </div>


    <div class="footer">
      ARES AI · Local conversation history
    </div>

  </aside>


  <!-- MAIN -->

  <main class="main">

    <header class="topbar">

      <button
        class="mobileMenu"
        id="menuBtn">
        ☰
      </button>

      <div>

        <div
          class="title"
          id="chatTitle">
          New Conversation
        </div>

        <div class="status">

          <span class="statusDot"></span>

          ARES online

        </div>

      </div>

    </header>


    <!-- SPEECH BAR -->

    <div
      class="speech"
      id="speech">

      <div class="speakerIcon">
        <svg
          width="17"
          height="17"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round">

          <polygon
            points="11 5 6 9 2 9 2 15 6 15 11 19 11 5">
          </polygon>

          <path
            d="M19.07 4.93a10 10 0 0 1 0 14.14">
          </path>

          <path
            d="M15.54 8.46a5 5 0 0 1 0 7.07">
          </path>

        </svg>
      </div>


      <div class="speechInfo">

        <div class="speechTitle">

        </div>

          </div>

        </div>

      </div>


      <button
        class="speechBtn"
        id="stopSpeech"
        title="Stop">

        ■

      </button>


      <button
        class="speechBtn"
        id="closeSpeech"
        title="Close">

        ×

      </button>

    </div>


    <!-- MESSAGES -->

    <section
      class="messages"
      id="messages">
    </section>


    <!-- COMPOSER -->

    <div class="composerWrap">

      <div class="composer">

        <textarea
          id="input"
          rows="1"
          placeholder="Ask ARES anything..."
          spellcheck="false">
        </textarea>


        <button
          class="icon"
          id="micBtn"
          title="Voice input">

          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round">

            <rect
              x="9"
              y="2"
              width="6"
              height="13"
              rx="3">
            </rect>

            <path
              d="M5 11a7 7 0 0 0 14 0">
            </path>

            <line
              x1="12"
              y1="18"
              x2="12"
              y2="22">
            </line>

            <line
              x1="8"
              y1="22"
              x2="16"
              y2="22">
            </line>

          </svg>

        </button>


        <button
          class="icon send"
          id="sendBtn"
          title="Send">

          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round">

            <line
              x1="22"
              y1="2"
              x2="11"
              y2="13">
            </line>

            <polygon
              points="22 2 15 22 11 13 2 9 22 2">
            </polygon>

          </svg>

        </button>

      </div>


      <div class="hint">
        Enter to send · Shift + Enter for new line
      </div>

    </div>

  </main>

</div>


<script>

/* =========================================================
   API
========================================================= */

const API_URL =
  "https://ares-cyber-intelligence.vercel.app/api/chat";


/* =========================================================
   STORAGE
========================================================= */

const CHAT_KEY =
  "ares_chats_v9";

const ACTIVE_KEY =
  "ares_active_chat_v9";


let chats =
  JSON.parse(
    localStorage.getItem(CHAT_KEY) || "[]"
  );

let activeChatId =
  localStorage.getItem(ACTIVE_KEY);


/* =========================================================
   ELEMENTS
========================================================= */

const messages =
  document.getElementById("messages");

const history =
  document.getElementById("history");

const input =
  document.getElementById("input");

const sendBtn =
  document.getElementById("sendBtn");

const newChat =
  document.getElementById("newChat");

const chatTitle =
  document.getElementById("chatTitle");

const sidebar =
  document.getElementById("sidebar");

const overlay =
  document.getElementById("overlay");

const menuBtn =
  document.getElementById("menuBtn");

const micBtn =
  document.getElementById("micBtn");

const speech =
  document.getElementById("speech");

const progress =
  document.getElementById("progress");


/* =========================================================
   CHAT
========================================================= */

function save(){

  localStorage.setItem(
    CHAT_KEY,
    JSON.stringify(chats)
  );

  if(activeChatId){

    localStorage.setItem(
      ACTIVE_KEY,
      activeChatId
    );

  }

}


function currentChat(){

  return chats.find(
    c => c.id === activeChatId
  );

}


function createChat(){

  const chat = {

    id:
      Date.now().toString(36) +
      Math.random()
        .toString(36)
        .slice(2),

    title:
      "New Conversation",

    messages:[],

    createdAt:
      Date.now(),

    updatedAt:
      Date.now()

  };


  chats.unshift(chat);

  activeChatId =
    chat.id;

  save();

  renderHistory();

  renderChat();

}


/* =========================================================
   HISTORY
========================================================= */

function renderHistory(){

  history.innerHTML = "";

  chats.forEach(chat => {

    const button =
      document.createElement("button");

    button.className =
      "historyItem" +
      (
        chat.id === activeChatId
          ? " active"
          : ""
      );

    button.textContent =
      chat.title;

    button.onclick = () => {

      activeChatId =
        chat.id;

      save();

      renderHistory();

      renderChat();

      sidebar.classList.remove(
        "open"
      );

      overlay.classList.remove(
        "show"
      );

    };

    history.appendChild(button);

  });

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(value){

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   RENDER TEXT
========================================================= */

function renderText(text){

  const lines =
    String(text || "")
      .split("\n");

  let html = "";

  let insideCode = false;

  let language = "code";

  let codeLines = [];


  function closeCode(){

    const raw =
      codeLines.join("\n");

    const id =
      "code_" +
      Math.random()
        .toString(36)
        .slice(2);


    html += `

      <div class="codeCard">

        <div class="codeHead">

          <span class="codeLang">
            ${escapeHTML(language)}
          </span>

          <button
            class="copy"
            data-code="${id}">
            Copy
          </button>

        </div>

        <pre
          class="code"
          id="${id}">${escapeHTML(raw)}</pre>

      </div>

    `;

    codeLines = [];

  }


  for(const line of lines){

    if(
      line.trim()
        .startsWith("```")
    ){

      if(!insideCode){

        insideCode = true;

        language =
          line
            .trim()
            .slice(3)
            .trim() ||
          "code";

      }else{

        insideCode = false;

        closeCode();

      }

      continue;

    }


    if(insideCode){

      codeLines.push(line);

      continue;

    }


    if(!line.trim()){

      html +=
        "<div style='height:5px'></div>";

      continue;

    }


    let safe =
      escapeHTML(line);


    safe =
      safe.replace(
        /`([^`]+)`/g,
        '<code class="inline">$1</code>'
      );


    safe =
      safe.replace(
        /\*\*([^*]+)\*\*/g,
        "<strong>$1</strong>"
      );


    html +=
      `<div>${safe}</div>`;

  }


  if(insideCode){

    closeCode();

  }


  return html;

}


/* =========================================================
   EMPTY
========================================================= */

function emptyHTML(){

  return `

    <div class="empty">

      <div class="emptyLogo">
        A
      </div>

      <h1>
        ARES AI
      </h1>

      <p>
        Ask ARES anything.
      </p>

    </div>

  `;

}


/* =========================================================
   RENDER CHAT
========================================================= */

function renderChat(){

  const chat =
    currentChat();


  if(!chat){

    messages.innerHTML =
      emptyHTML();

    return;

  }


  chatTitle.textContent =
    chat.title;


  if(!chat.messages.length){

    messages.innerHTML =
      emptyHTML();

    return;

  }


  messages.innerHTML = "";


  chat.messages.forEach(
    (message,index) =>
      addMessage(
        message,
        index
      )
  );


  scrollBottom();

}


/* =========================================================
   ADD MESSAGE
========================================================= */

function addMessage(
  message,
  index
){

  const row =
    document.createElement("div");

  row.className =
    "message " +
    message.role;


  const avatar =
    document.createElement("div");

  avatar.className =
    "avatar";

  avatar.textContent =
    message.role === "user"
      ? "YOU"
      : "A";


  const body =
    document.createElement("div");

  body.className =
    "body";


  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";

  bubble.innerHTML =
    renderText(
      message.content
    );


  body.appendChild(
    bubble
  );


  const actions =
    document.createElement("div");

  actions.className =
    "actions";


  const copy =
    document.createElement("button");

  copy.className =
    "action";

  copy.textContent =
    "⧉";

  copy.title =
    "Copy";

  copy.onclick =
    async () => {

      try{

        await navigator
          .clipboard
          .writeText(
            message.content
          );

      }catch{}

    };


  actions.appendChild(copy);


  if(
    message.role ===
    "assistant"
  ){

    const speakButton =
      document.createElement("button");

    speakButton.className =
      "action";

    speakButton.textContent =
      "🔊";

    speakButton.title =
      "Speak";

    speakButton.onclick =
      () =>
        speak(
          message.content
        );

    actions.appendChild(
      speakButton
    );

  }


  if(
    message.role ===
    "user"
  ){

    const edit =
      document.createElement("button");

    edit.className =
      "action";

    edit.textContent =
      "✎";

    edit.title =
      "Edit";

    edit.onclick = () => {

      const chat =
        currentChat();

      input.value =
        message.content;

      chat.messages =
        chat.messages
          .slice(0,index);

      chat.updatedAt =
        Date.now();

      save();

      renderChat();

      input.focus();

      resizeInput();

    };

    actions.appendChild(
      edit
    );

  }


  body
    .querySelectorAll(".copy")
    .forEach(button => {

      button.onclick =
        async () => {

          const target =
            document.getElementById(
              button.dataset.code
            );

          if(!target)
            return;


          try{

            await navigator
              .clipboard
              .writeText(
                target.textContent
              );

            button.textContent =
              "Copied";

            setTimeout(
              () =>
                button.textContent =
                  "Copy",
              900
            );

          }catch{}

        };

    });


  body.appendChild(
    actions
  );


  row.appendChild(
    avatar
  );

  row.appendChild(
    body
  );


  messages.appendChild(
    row
  );

}


/* =========================================================
   SEND
========================================================= */

async function send(){

  const text =
    input.value.trim();


  if(!text)
    return;


  let chat =
    currentChat();


  if(!chat){

    createChat();

    chat =
      currentChat();

  }


  if(!chat)
    return;


  if(
    !chat.messages.length
  ){

    chat.title =
      text.length > 45
        ? text.slice(0,45) + "..."
        : text;

  }


  chat.messages.push({

    role:"user",

    content:text,

    timestamp:
      Date.now()

  });


  chat.updatedAt =
    Date.now();


  input.value = "";

  resizeInput();

  save();

  renderHistory();

  renderChat();


  const loading =
    document.createElement("div");

  loading.className =
    "message assistant";


  loading.innerHTML = `

    <div class="avatar">
      A
    </div>

    <div class="body">

      <div class="bubble">

        <span style="
          color:#51bfff;
          letter-spacing:5px;
        ">
          • • •
        </span>

      </div>

    </div>

  `;


  messages.appendChild(
    loading
  );

  scrollBottom();


  try{

    const previous =
      chat.messages
        .slice(-13,-1)
        .map(m => ({
          role:m.role,
          content:m.content
        }));


    const response =
      await fetch(
        API_URL,
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              message:text,

              history:previous

            })

        }
      );


    const data =
      await response
        .json()
        .catch(
          () => ({})
        );


    loading.remove();


    if(!response.ok){

      throw new Error(
        data.error ||
        "Backend connection failed"
      );

    }


    chat.messages.push({

      role:"assistant",

      content:
        data.reply ||
        "ARES returned no response.",

      timestamp:
        Date.now()

    });


    chat.updatedAt =
      Date.now();


    save();

    renderHistory();

    renderChat();


  }catch(error){

    loading.remove();


    chat.messages.push({

      role:"assistant",

      content:
        "⚠️ **ARES backend connection failed**\n\n" +
        error.message,

      timestamp:
        Date.now()

    });


    save();

    renderChat();

  }

}


/* =========================================================
   INPUT
========================================================= */

function resizeInput(){

  input.style.height =
    "auto";

  input.style.height =
    Math.min(
      input.scrollHeight,
      150
    ) + "px";

}


input.addEventListener(
  "input",
  resizeInput
);


input.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      send();

    }

  }
);


sendBtn.onclick =
  send;


newChat.onclick =
  createChat;


/* =========================================================
   MOBILE
========================================================= */

menuBtn.onclick = () => {

  sidebar.classList.add(
    "open"
  );

  overlay.classList.add(
    "show"
  );

};


overlay.onclick = () => {

  sidebar.classList.remove(
    "open"
  );

  overlay.classList.remove(
    "show"
  );

};


/* =========================================================
   TEXT TO SPEECH
========================================================= */

let speechTimer =
  null;


function speak(text){

  if(
    !("speechSynthesis" in window)
  )
    return;


  speechSynthesis.cancel();

  clearInterval(
    speechTimer
  );


  const clean =
    String(text)
      .replace(
        /```[\s\S]*?```/g,
        " code "
      )
      .replace(
        /`([^`]+)`/g,
        "$1"
      )
      .replace(
        /[*_#]/g,
        ""
      )
      .replace(
        /\s+/g,
        " "
      )
      .trim();


  if(!clean)
    return;


  const utter =
    new SpeechSynthesisUtterance(
      clean
    );


  utter.rate =
    .98;

  utter.pitch =
    1;


  speech.classList.add(
    "show"
  );


  progress.style.width =
    "0%";


  const duration =
    Math.max(
      2500,
      clean.length * 42
    );


  const started =
    Date.now();


  speechTimer =
    setInterval(
      () => {

        const value =
          Math.min(
            100,
            (
              (Date.now()-started) /
              duration
            ) * 100
          );


        progress.style.width =
          value + "%";

      },
      100
    );


  utter.onend =
    () => {

      clearInterval(
        speechTimer
      );

      progress.style.width =
        "100%";

      setTimeout(
        () => {

          speech.classList.remove(
            "show"
          );

          progress.style.width =
            "0%";

        },
        300
      );

    };


  utter.onerror =
    () => {

      clearInterval(
        speechTimer
      );

      speech.classList.remove(
        "show"
      );

    };


  speechSynthesis.speak(
    utter
  );

}


document.getElementById(
  "stopSpeech"
).onclick = () => {

  speechSynthesis.cancel();

  clearInterval(
    speechTimer
  );

  progress.style.width =
    "0%";

  speech.classList.remove(
    "show"
  );

};


document.getElementById(
  "closeSpeech"
).onclick = () => {

  speech.classList.remove(
    "show"
  );

};


/* =========================================================
   VOICE INPUT
========================================================= */

const Recognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if(Recognition){

  const recognition =
    new Recognition();

  recognition.lang =
    "en-US";

  recognition.continuous =
    false;

  recognition.interimResults =
    true;


  let listening =
    false;


  recognition.onstart =
    () => {

      listening =
        true;

      micBtn.classList.add(
        "listening"
      );

    };


  recognition.onresult =
    event => {

      let result = "";

      for(
        let i =
          event.resultIndex;

        i <
          event.results.length;

        i++
      ){

        result +=
          event.results[i][0]
            .transcript;

      }


      input.value =
        result;

      resizeInput();

    };


  recognition.onend =
    () => {

      listening =
        false;

      micBtn.classList.remove(
        "listening"
      );

    };


  recognition.onerror =
    () => {

      listening =
        false;

      micBtn.classList.remove(
        "listening"
      );

    };


  micBtn.onclick =
    () => {

      if(listening){

        recognition.stop();

      }else{

        try{
          recognition.start();
        }catch{}

      }

    };

}else{

  micBtn.onclick =
    () => {

      alert(
        "Voice input is not supported by this browser."
      );

    };

}


/* =========================================================
   RED BOX GENERATOR
========================================================= */

const redBoxes =
  document.getElementById(
    "redBoxes"
  );


function createRedBoxes(){

  redBoxes.innerHTML = "";

  const mobile =
    window.innerWidth < 800;

  const count =
    mobile
      ? 50
      : 82;


  for(
    let i=0;
    i<count;
    i++
  ){

    const box =
      document.createElement(
        "div"
      );


    box.className =
      "redBox";


    const depth =
      Math.random();


    if(depth < .30){

      box.classList.add(
        "deep"
      );

    }else if(depth < .72){

      box.classList.add(
        "medium"
      );

    }else{

      box.classList.add(
        "bright"
      );

    }


    /*
      Larger than previous version.
    */

    const width =
      85 +
      Math.random()*205;


    const height =
      48 +
      Math.random()*125;


    box.style.width =
      width + "px";


    box.style.height =
      height + "px";


    box.style.left =
      (
        Math.random()*100
      ) + "%";


    box.style.top =
      (
        Math.random()*100
      ) + "%";


    redBoxes.appendChild(
      box
    );

  }

}


createRedBoxes();

window.addEventListener(
  "resize",
  createRedBoxes
);


/* =========================================================
   BLUE DIGITAL RAIN
========================================================= */

const canvas =
  document.getElementById(
    "digitalRain"
  );

const ctx =
  canvas.getContext(
    "2d"
  );


let W=0;
let H=0;
let DPR=1;

let streams=[];


const rainCharacters =
  "010101010101ABCDEFGHIJKLMNOPQRSTUVWXYZabcdef0123456789<>[]{}:/\\|+-_=.";


/* =========================================================
   RESIZE RAIN
========================================================= */

function resizeRain(){

  W =
    window.innerWidth;

  H =
    window.innerHeight;


  DPR =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );


  canvas.width =
    W * DPR;

  canvas.height =
    H * DPR;


  canvas.style.width =
    W + "px";

  canvas.style.height =
    H + "px";


  ctx.setTransform(
    DPR,
    0,
    0,
    DPR,
    0,
    0
  );


  /*
    Smaller characters + more
    columns = dense but distant look.
  */

  const size =
    W < 800
      ? 8
      : 9;


  const gap =
    W < 800
      ? 8
      : 9;


  const count =
    Math.ceil(
      W / gap
    );


  streams = [];


  for(
    let i=0;
    i<count;
    i++
  ){

    const length =
      22 +
      Math.floor(
        Math.random()*34
      );


    const chars=[];


    for(
      let j=0;
      j<length;
      j++
    ){

      chars.push(
        rainCharacters[
          Math.floor(
            Math.random() *
            rainCharacters.length
          )
        ]
      );

    }


    streams.push({

      x:
        i * gap,

      y:
        Math.random() *
        -H,

      speed:
        .65 +
        Math.random()*1.65,

      size:
        size +
        Math.random()*1.4,

      length,

      chars,

      gap:
        .84 +
        Math.random()*.15,

      brightness:
        .35 +
        Math.random()*.30

    });

  }

}


/* =========================================================
   DRAW RAIN
========================================================= */

function drawRain(){

  /*
    Slow fade = continuous trails.
  */

  ctx.fillStyle =
    "rgba(1,2,6,.13)";

  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  ctx.textAlign =
    "center";

  ctx.textBaseline =
    "top";


  for(
    const stream
    of streams
  ){

    for(
      let i =
        stream.length - 1;

      i >= 0;

      i--
    ){

      const y =
        stream.y +
        i *
        stream.size *
        stream.gap;


      if(
        y < -20 ||
        y > H + 20
      )
        continue;


      const tail =
        i /
        stream.length;


      let alpha =
        stream.brightness *
        (
          1 -
          tail*.72
        );


      /*
        Bright blue head.
      */

      if(i===0){

        alpha =
          Math.min(
            .90,
            stream.brightness + .30
          );

        ctx.fillStyle =
          `rgba(
            100,
            197,
            255,
            ${alpha}
          )`;

      }else{

        ctx.fillStyle =
          `rgba(
            30,
            105,
            205,
            ${alpha}
          )`;

      }


      ctx.font =
        `${Math.round(stream.size)}px ` +
        `"JetBrains Mono",Consolas,monospace`;


      ctx.fillText(
        stream.chars[i],
        stream.x,
        y
      );

    }


    stream.y +=
      stream.speed;


    const total =
      stream.length *
      stream.size *
      stream.gap;


    if(
      stream.y >
      H + total
    ){

      stream.y =
        -(
          Math.random() *
          H *
          .85
        );


      stream.speed =
        .65 +
        Math.random()*1.65;


      for(
        let j=0;
        j<stream.length;
        j++
      ){

        stream.chars[j] =
          rainCharacters[
            Math.floor(
              Math.random() *
              rainCharacters.length
            )
          ];

      }

    }

  }


  requestAnimationFrame(
    drawRain
  );

}


window.addEventListener(
  "resize",
  resizeRain
);

resizeRain();

drawRain();


/* =========================================================
   SCROLL
========================================================= */

function scrollBottom(){

  requestAnimationFrame(
    () => {

      messages.scrollTop =
        messages.scrollHeight;

    }
  );

}


/* =========================================================
   START
========================================================= */

if(!activeChatId){

  if(chats.length){

    activeChatId =
      chats[0].id;

  }else{

    createChat();

  }

}


renderHistory();

renderChat();

</script>
