<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#030507">
<title>ARES AI</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
 --bg:#020407;
 --text:#f5f7fa;
 --muted:#8e96a3;
 --red:#ff174f;
 --red2:#ff5276;
 --green:#00ffa2;
 --green2:#00c982;
 --white:#eef4ff;
 --glass:rgba(255,255,255,.055);
 --border:rgba(255,255,255,.11);
}

html,body{
 width:100%;
 height:100%;
 overflow:hidden;
 background:#020407;
 color:var(--text);
 font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

button,input,textarea,select{font:inherit}
button{border:0;cursor:pointer;color:inherit}

/* ================= LIQUID BACKGROUND ================= */

body{
 position:relative;
 isolation:isolate;
 background:
 radial-gradient(circle at 15% 0%,rgba(255,15,65,.40),transparent 30%),
 radial-gradient(circle at 82% 42%,rgba(255,255,255,.13),transparent 28%),
 radial-gradient(circle at 50% 110%,rgba(0,255,155,.30),transparent 34%),
 #020407;
}

body:before,
body:after{
 content:"";
 position:fixed;
 z-index:-10;
 pointer-events:none;
 border-radius:50%;
 filter:blur(55px);
}

body:before{
 width:650px;
 height:650px;
 left:-250px;
 top:-330px;
 background:
 radial-gradient(circle at 50% 50%,
 rgba(255,25,70,.9),
 rgba(255,0,55,.28) 48%,
 transparent 72%);
 animation:redLiquid 15s ease-in-out infinite alternate;
}

body:after{
 width:750px;
 height:750px;
 right:-350px;
 bottom:-400px;
 background:
 radial-gradient(circle at 40% 40%,
 rgba(0,255,155,.75),
 rgba(0,180,110,.24) 48%,
 transparent 72%);
 animation:greenLiquid 18s ease-in-out infinite alternate;
}

@keyframes redLiquid{
 0%{transform:translate(0,0) scale(1)}
 50%{transform:translate(170px,90px) scale(1.18)}
 100%{transform:translate(290px,10px) scale(1.05)}
}

@keyframes greenLiquid{
 0%{transform:translate(0,0) scale(1)}
 50%{transform:translate(-120px,-90px) scale(1.18)}
 100%{transform:translate(-250px,-20px) scale(1.05)}
}

/* glass grid */
body .bgGrid{
 position:fixed;
 inset:0;
 z-index:-8;
 pointer-events:none;
 background-image:
 linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
 linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
 background-size:45px 45px;
 mask-image:linear-gradient(to bottom,black,transparent 90%);
}

/* floating liquid boxes */
.liquidBoxes{
 position:fixed;
 inset:0;
 z-index:-7;
 overflow:hidden;
 pointer-events:none;
}

.liquidBox{
 position:absolute;
 width:58px;
 height:58px;
 border:1px solid rgba(255,255,255,.10);
 border-radius:16px;
 background:linear-gradient(135deg,
 rgba(255,255,255,.10),
 rgba(255,255,255,.018));
 box-shadow:
  inset 0 1px rgba(255,255,255,.13),
  0 12px 40px rgba(0,0,0,.18);
 backdrop-filter:blur(12px);
 animation:floatBox linear infinite;
}

.liquidBox:nth-child(3n){
 border-color:rgba(255,40,80,.16);
}
.liquidBox:nth-child(4n){
 border-color:rgba(0,255,160,.15);
}

@keyframes floatBox{
 0%{transform:translate3d(0,110vh,0) rotate(0deg)}
 50%{transform:translate3d(40px,45vh,0) rotate(120deg)}
 100%{transform:translate3d(-30px,-15vh,0) rotate(260deg)}
}

/* falling green code */
.matrix{
 position:fixed;
 inset:0;
 z-index:-6;
 overflow:hidden;
 pointer-events:none;
 opacity:.18;
}

.matrix span{
 position:absolute;
 top:-120px;
 color:#00ff9d;
 font-family:monospace;
 font-size:11px;
 line-height:16px;
 white-space:pre;
 text-shadow:0 0 8px rgba(0,255,155,.55);
 animation:codeFall linear infinite;
}

@keyframes codeFall{
 from{transform:translateY(-120px)}
 to{transform:translateY(115vh)}
}

/* ================= APP ================= */

.app{
 width:100%;
 height:100%;
 display:flex;
 position:relative;
 overflow:hidden;
}

/* ================= SIDEBAR ================= */

.sidebar{
 width:280px;
 height:100%;
 padding:18px;
 display:flex;
 flex-direction:column;
 z-index:50;
 background:
 linear-gradient(145deg,
 rgba(9,11,16,.80),
 rgba(4,7,10,.62));
 border-right:1px solid var(--border);
 backdrop-filter:blur(32px) saturate(140%);
 box-shadow:15px 0 70px rgba(0,0,0,.25);
}

.brand{
 display:flex;
 align-items:center;
 gap:11px;
 margin-bottom:18px;
}

.logo{
 width:42px;
 height:42px;
 display:grid;
 place-items:center;
 border-radius:15px 20px 13px 19px;
 font-weight:900;
 background:linear-gradient(145deg,#ff3158,#94001f);
 box-shadow:
 0 0 30px rgba(255,30,70,.30),
 inset 0 1px rgba(255,255,255,.25);
}

.brand strong{display:block;font-size:18px}
.brand span{font-size:10px;color:#747c88}

.newChat{
 width:100%;
 padding:13px;
 border-radius:16px;
 font-weight:750;
 background:linear-gradient(135deg,#ff3155,#a90027);
 box-shadow:0 10px 35px rgba(255,20,60,.18);
 transition:.2s;
}

.newChat:hover{transform:translateY(-1px);filter:brightness(1.1)}

.historyTitle{
 margin-top:10px;
 padding:10px 5px;
 color:#6f7782;
 font-size:10px;
 letter-spacing:1.5px;
 font-weight:800;
}

.history{
 flex:1;
 overflow-y:auto;
}

.history::-webkit-scrollbar,
.chat::-webkit-scrollbar{width:4px}

.history::-webkit-scrollbar-thumb,
.chat::-webkit-scrollbar-thumb{
 background:linear-gradient(#ff3154,#00d994);
 border-radius:20px;
}

.historyItem{
 padding:11px 12px;
 margin:4px 0;
 border-radius:13px;
 font-size:13px;
 color:#bcc2ca;
 cursor:pointer;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
 border:1px solid transparent;
 transition:.2s;
}

.historyItem:hover{
 background:rgba(255,255,255,.06);
 border-color:rgba(255,255,255,.07);
 color:#fff;
}

.historyItem.active{
 background:linear-gradient(135deg,
 rgba(255,30,70,.14),
 rgba(0,255,155,.05));
 border-color:rgba(255,70,100,.18);
 color:#fff;
}

.clearBtn{
 margin-top:10px;
 padding:10px;
 border-radius:12px;
 color:#9299a4;
 background:rgba(255,255,255,.045);
 border:1px solid rgba(255,255,255,.06);
 font-size:11px;
}

/* ================= MAIN ================= */

.main{
 flex:1;
 min-width:0;
 height:100%;
 display:flex;
 flex-direction:column;
 position:relative;
 overflow:hidden;
}

/* ================= HEADER ================= */

.header{
 min-height:70px;
 padding:12px 20px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 border-bottom:1px solid rgba(255,255,255,.08);
 background:rgba(5,7,10,.46);
 backdrop-filter:blur(28px) saturate(150%);
 z-index:20;
}

.headerLeft{
 display:flex;
 align-items:center;
 gap:12px;
}

.mobileMenu{
 display:none;
 width:38px;
 height:38px;
 border-radius:13px;
 background:rgba(255,255,255,.07);
}

.status{
 display:flex;
 align-items:center;
 gap:8px;
}

.dot{
 width:8px;
 height:8px;
 border-radius:50%;
 background:#00ff9d;
 box-shadow:0 0 8px #00ff9d,0 0 18px rgba(0,255,155,.5);
}

.headerTitle{font-weight:850}
.headerSub{font-size:10px;color:#707783}

.voiceTools{
 display:flex;
 align-items:center;
 gap:7px;
}

.voiceSelect{
 max-width:185px;
 padding:8px 10px;
 border-radius:12px;
 outline:none;
 color:#ddd;
 background:rgba(255,255,255,.055);
 border:1px solid rgba(255,255,255,.10);
}

.voiceTest{
 padding:8px 11px;
 border-radius:11px;
 color:#67ffc0;
 background:rgba(0,255,155,.07);
 border:1px solid rgba(0,255,155,.14);
 font-size:11px;
}

/* ================= CHAT ================= */

.chat{
 flex:1;
 overflow-y:auto;
 padding:30px 18px 150px;
 position:relative;
}

.chatInner{
 width:min(920px,100%);
 margin:auto;
 position:relative;
 z-index:2;
}

.empty{
 min-height:55vh;
 display:flex;
 align-items:center;
 justify-content:center;
 text-align:center;
}

.emptyCard{
 max-width:650px;
 padding:35px;
 border-radius:31px;
 background:linear-gradient(145deg,
 rgba(255,255,255,.065),
 rgba(255,255,255,.015));
 border:1px solid rgba(255,255,255,.09);
 box-shadow:
 0 30px 100px rgba(0,0,0,.30),
 inset 0 1px rgba(255,255,255,.08);
 backdrop-filter:blur(25px);
}

.emptyLogo{
 width:72px;
 height:72px;
 margin:0 auto 20px;
 display:grid;
 place-items:center;
 border-radius:25px 31px 21px 28px;
 font-size:28px;
 font-weight:900;
 background:linear-gradient(145deg,#ff3157,#8f001d);
 box-shadow:0 0 45px rgba(255,25,65,.27);
}

.emptyCard h1{
 font-size:clamp(30px,5vw,47px);
 margin-bottom:10px;
}

.emptyCard p{
 color:#8f96a1;
 line-height:1.65;
}

/* ================= MESSAGES ================= */

.message{
 display:flex;
 margin:17px 0;
 animation:messageIn .22s ease;
}

@keyframes messageIn{
 from{opacity:0;transform:translateY(7px)}
 to{opacity:1;transform:none}
}

.message.user{justify-content:flex-end}

.bubble{
 max-width:min(79%,780px);
 padding:14px 16px;
 border-radius:21px;
 line-height:1.62;
 font-size:14px;
 word-wrap:break-word;
 position:relative;
 overflow:hidden;
}

.user .bubble{
 background:linear-gradient(145deg,
 rgba(255,45,80,.91),
 rgba(135,0,31,.93));
 border:1px solid rgba(255,130,150,.12);
 border-bottom-right-radius:6px;
 box-shadow:
 0 15px 45px rgba(255,20,60,.12),
 inset 0 1px rgba(255,255,255,.16);
}

.assistant .bubble{
 background:linear-gradient(145deg,
 rgba(25,29,36,.73),
 rgba(6,12,15,.65));
 border:1px solid rgba(255,255,255,.085);
 border-bottom-left-radius:6px;
 backdrop-filter:blur(22px);
 box-shadow:
 0 18px 50px rgba(0,0,0,.20),
 inset 0 1px rgba(255,255,255,.06);
}

.messageMeta{
 display:flex;
 align-items:center;
 gap:5px;
 margin-top:8px;
}

.action{
 width:29px;
 height:29px;
 border-radius:9px;
 color:#aab1ba;
 background:rgba(255,255,255,.055);
 border:1px solid rgba(255,255,255,.05);
 transition:.15s;
}

.action:hover{
 color:#fff;
 background:rgba(255,255,255,.11);
 transform:translateY(-1px);
}

/* ================= TEXT ================= */

.text h1,
.text h2,
.text h3{
 margin:16px 0 8px;
}

.text p{margin:6px 0}

.text ul,
.text ol{
 margin:8px 0;
 padding-left:22px;
}

.text li{margin:5px 0}

.text strong{color:#fff}

.inlineCode{
 padding:2px 6px;
 border-radius:6px;
 color:#ff91a4;
 background:rgba(255,40,75,.10);
 border:1px solid rgba(255,60,90,.14);
 font-family:ui-monospace,monospace;
}

/* ================= LIQUID CODE BLOCK ================= */

.codeBox{
 margin:14px 0;
 overflow:hidden;
 border-radius:17px;
 background:
 linear-gradient(145deg,
 rgba(5,14,13,.94),
 rgba(5,8,12,.92));
 border:1px solid rgba(0,255,160,.16);
 box-shadow:
 0 15px 45px rgba(0,0,0,.30),
 inset 0 1px rgba(255,255,255,.06),
 0 0 30px rgba(0,255,150,.035);
}

.codeHead{
 height:42px;
 padding:0 11px 0 14px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 background:
 linear-gradient(90deg,
 rgba(0,255,155,.075),
 rgba(255,255,255,.025));
 border-bottom:1px solid rgba(0,255,155,.10);
}

.codeLang{
 color:#59ffc0;
 font-size:10px;
 font-weight:850;
 letter-spacing:1px;
 text-transform:uppercase;
}

.copyCode{
 padding:7px 10px;
 border-radius:9px;
 color:#b9c0c9;
 background:rgba(255,255,255,.07);
 border:1px solid rgba(255,255,255,.08);
 font-size:10px;
 transition:.18s;
}

.copyCode:hover{
 color:#fff;
 background:rgba(0,255,155,.12);
 border-color:rgba(0,255,155,.20);
}

.codeBox pre{
 padding:15px;
 overflow:auto;
 color:#baffdf;
 font-size:12px;
 line-height:1.65;
 font-family:
 ui-monospace,
 SFMono-Regular,
 Menlo,
 Consolas,
 monospace;
 text-shadow:0 0 7px rgba(0,255,155,.13);
}

.codeBox pre::-webkit-scrollbar{height:4px}
.codeBox pre::-webkit-scrollbar-thumb{
 background:#087b58;
 border-radius:20px;
}

/* ================= TYPING ================= */

.typing{
 display:flex;
 gap:5px;
}

.typing i{
 width:7px;
 height:7px;
 border-radius:50%;
 background:#00ff9d;
 box-shadow:0 0 8px #00ff9d;
 animation:typing 1s infinite;
}

.typing i:nth-child(2){animation-delay:.15s}
.typing i:nth-child(3){animation-delay:.3s}

@keyframes typing{
 0%,60%,100%{opacity:.25;transform:translateY(0)}
 30%{opacity:1;transform:translateY(-3px)}
}

/* ================= SPEECH BAR ================= */

.speechBar{
 position:absolute;
 top:77px;
 left:50%;
 transform:translate(-50%,-15px);
 width:min(500px,calc(100% - 28px));
 padding:10px 12px;
 display:none;
 border-radius:16px;
 background:rgba(12,13,17,.88);
 border:1px solid rgba(255,255,255,.11);
 box-shadow:0 20px 55px rgba(0,0,0,.42);
 backdrop-filter:blur(25px);
 z-index:40;
}

.speechBar.show{
 display:block;
 animation:speechIn .2s forwards;
}

@keyframes speechIn{
 to{transform:translate(-50%,0)}
}

.speechTop{
 display:flex;
 align-items:center;
 justify-content:space-between;
}

.speechName{
 display:flex;
 align-items:center;
 gap:7px;
 font-size:11px;
 font-weight:750;
}

.speechLive{
 width:6px;
 height:6px;
 border-radius:50%;
 background:#ff3155;
 box-shadow:0 0 10px #ff3155;
}

.speechBtns{
 display:flex;
 gap:6px;
}

.speechBtn{
 width:28px;
 height:28px;
 border-radius:9px;
 background:rgba(255,255,255,.07);
 color:#bbb;
}

.speechBtn.stop{color:#ff637d}

.progressTrack{
 height:3px;
 margin-top:9px;
 overflow:hidden;
 border-radius:10px;
 background:#20262b;
}

.progress{
 width:0;
 height:100%;
 background:linear-gradient(90deg,#ff3155,#fff,#00ff9d);
 box-shadow:0 0 12px rgba(0,255,155,.5);
}

/* ================= COMPOSER ================= */

.composerWrap{
 position:absolute;
 bottom:0;
 left:0;
 right:0;
 padding:18px;
 background:linear-gradient(
 to top,
 rgba(2,4,7,1) 35%,
 rgba(2,4,7,.72),
 transparent);
 z-index:15;
}

.composer{
 width:min(920px,100%);
 margin:auto;
 display:flex;
 align-items:flex-end;
 gap:9px;
 padding:9px;
 border-radius:22px;
 background:
 linear-gradient(145deg,
 rgba(25,29,35,.78),
 rgba(8,12,16,.70));
 border:1px solid rgba(255,255,255,.11);
 box-shadow:
 0 20px 70px rgba(0,0,0,.40),
 inset 0 1px rgba(255,255,255,.07);
 backdrop-filter:blur(25px);
}

.textarea{
 flex:1;
 min-height:45px;
 max-height:150px;
 resize:none;
 outline:none;
 border:0;
 color:#fff;
 background:transparent;
 padding:11px 8px;
 line-height:1.45;
}

.textarea::placeholder{color:#68707b}

.iconBtn{
 flex:0 0 auto;
 width:43px;
 height:43px;
 border-radius:14px;
 background:rgba(255,255,255,.06);
 color:#aeb5bf;
 border:1px solid rgba(255,255,255,.06);
 transition:.18s;
}

.iconBtn:hover{
 color:#fff;
 background:rgba(255,255,255,.10);
 transform:translateY(-1px);
}

.micBtn.active{
 color:#ff5572;
 background:rgba(255,30,70,.13);
 box-shadow:0 0 22px rgba(255,30,70,.15);
}

.sendBtn{
 background:linear-gradient(145deg,#ff3155,#a60027);
 color:#fff;
 box-shadow:0 8px 28px rgba(255,25,65,.20);
}

.sendBtn:disabled{
 opacity:.4;
 cursor:not-allowed;
}

/* ================= MOBILE ================= */

.overlay{display:none}

@media(max-width:800px){

 .sidebar{
  position:fixed;
  left:-290px;
  top:0;
  transition:.25s;
  box-shadow:20px 0 70px rgba(0,0,0,.5);
 }

 .sidebar.open{left:0}

 .overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.60);
  z-index:45;
 }

 .overlay.show{display:block}

 .mobileMenu{
  display:block;
 }

 .header{
  padding:10px 12px;
 }

 .voiceSelect{
  max-width:125px;
  font-size:10px;
 }

 .voiceTest{display:none}

 .headerSub{display:none}

 .chat{
  padding:20px 10px 140px;
 }

 .bubble{
  max-width:90%;
  font-size:13.5px;
 }

 .composerWrap{
  padding:10px;
 }

 .composer{
  border-radius:18px;
 }

 .iconBtn{
  width:40px;
  height:40px;
 }

 .emptyCard{
  padding:25px 18px;
 }
}

@media(max-width:480px){

 .headerTitle{font-size:14px}

 .voiceSelect{
  width:110px;
  max-width:110px;
 }

 .emptyCard h1{font-size:30px}
}
</style>
