<!doctype html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>ARES AI</title>

<style>

/* =====================================================
   GLOBAL
===================================================== */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
}

body{

  background:#070305;

  color:#f5f5f5;

  font-family:
    Inter,
    Arial,
    system-ui,
    sans-serif;

  overflow:hidden;
}


/* =====================================================
   LIQUID BACKGROUND
===================================================== */

body:before{

  content:"";

  position:fixed;

  inset:0;

  z-index:-3;

  background:

    radial-gradient(
      700px 420px at 15% 15%,
      #ff233c2e,
      transparent 65%
    ),

    radial-gradient(
      620px 500px at 82% 22%,
      #ff46591f,
      transparent 64%
    ),

    radial-gradient(
      700px 600px at 58% 88%,
      #820a232e,
      transparent 66%
    ),

    linear-gradient(
      #ff232d09 1px,
      transparent 1px
    ),

    linear-gradient(
      90deg,
      #ff232d09 1px,
      transparent 1px
    ),

    #070305;

  background-size:
    auto,
    auto,
    auto,
    34px 34px,
    34px 34px,
    auto;
}


body:after{

  content:"";

  position:fixed;

  inset:-25%;

  z-index:-2;

  pointer-events:none;

  background:

    radial-gradient(
      ellipse at 30% 35%,
      #ff1e3c21,
      transparent 30%
    ),

    radial-gradient(
      ellipse at 70% 65%,
      #ff002d1a,
      transparent 28%
    );

  filter:blur(55px);

  animation:
    liquidMove
    16s
    ease-in-out
    infinite
    alternate;
}

@keyframes liquidMove{

  to{

    transform:
      translate(3%,2%)
      scale(1.08);

  }

}


/* =====================================================
   APP
===================================================== */

.app{

  width:100%;

  height:100vh;

  display:flex;

}


/* =====================================================
   SIDEBAR
===================================================== */

  flex-shrink:0;

}


.logo{

}


.logo span{

.logo-dot{

  border-radius:50%;

  margin-left:8px;

.newchat{

===================================================== */

}

<!-- =====================================================

  class="messages"
  id="messages"

<div class="bottom">

<script>

/* =====================================================
   API
===================================================== */

const API_URL =
  "https://ares-cyber-intelligence.vercel.app/api/chat";


/* =====================================================
   ELEMENTS
===================================================== */

const input =
  document.getElementById("input");

const messagesEl =
  document.getElementById("messages");

const historyEl =
  document.getElementById("history");

const send =
  document.getElementById("send");

const voicePanel =
  document.getElementById("voicePanel");

const voiceSelect =
  document.getElementById("voiceSelect");


/* =====================================================
   CHAT STORAGE
===================================================== */

let chats =
  JSON.parse(
    localStorage.getItem(
      "ares_chats_v2"
    ) || "[]"
  );


let current =
  localStorage.getItem(
    "ares_current_chat"
  ) || null;


/* =====================================================
   CHAT ID
===================================================== */

function uid(){

  return (
    Date.now().toString(36) +
    Math.random()
      .toString(36)
      .slice(2,7)
  );

}


/* =====================================================
   SAVE
===================================================== */

function save(){

  localStorage.setItem(
    "ares_chats_v2",
    JSON.stringify(
      chats.slice(-30)
    )
  );


  if(current){

    localStorage.setItem(
      "ares_current_chat",
      current
    );

  }

}


/* =====================================================
   GET CURRENT CHAT
===================================================== */

function getCurrent(){

  return chats.find(
    chat =>
      chat.id === current
  );

}


/* =====================================================
   ENSURE CHAT
===================================================== */

function ensureChat(){

  let chat =
    getCurrent();


  if(!chat){

    chat = {

      id:uid(),

      title:"New Chat",

      messages:[]

    };


    chats.push(chat);

    current =
      chat.id;

    save();

  }


  return chat;

}


/* =====================================================
   HISTORY
===================================================== */

function renderHistory(){

  historyEl.innerHTML = "";


  chats
    .slice()
    .reverse()
    .forEach(chat => {

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "history-item" +
        (
          chat.id === current
            ? " active"
            : ""
        );


      item.textContent =
        chat.title;


      item.onclick =
        () => loadChat(chat.id);


      historyEl.appendChild(
        item
      );

    });

}


/* =====================================================
   WELCOME
===================================================== */

function createWelcome(){

  const div =
    document.createElement(
      "div"
    );


  div.className =
    "welcome";


  div.innerHTML = `

    <div class="welcome-logo">
      A
    </div>


    <h1>
      How can I help you?
    </h1>


    <p>
      Ask ARES anything.
    </p>


    <div class="suggestions">


      <button
        class="suggestion"
        data-q="Explain DNS in simple words"
      >
        Explain DNS
      </button>


      <button
        class="suggestion"
        data-q="Give me useful Linux commands"
      >
        Linux Commands
      </button>


      <button
        class="suggestion"
        data-q="Explain how websites work"
      >
        How websites work
      </button>


      <button
        class="suggestion"
        data-q="Teach me networking from beginner level"
      >
        Learn Networking
      </button>


      <button
        class="suggestion"
        data-q="Teach me cybersecurity using a legal local lab"
      >
        Cybersecurity Lab
      </button>


    </div>

  `;


  div
    .querySelectorAll(
      ".suggestion"
    )
    .forEach(button => {

      button.onclick = () => {

        input.value =
          button.dataset.q;

        sendMessage();

      };

    });


  return div;

}


/* =====================================================
   LOAD CHAT
===================================================== */

function loadChat(id){

  const chat =
    chats.find(
      item =>
        item.id === id
    );


  if(!chat){

    return;

  }


  current =
    id;


  save();

  renderHistory();


  messagesEl.innerHTML =
    "";


  if(
    !chat.messages.length
  ){

    messagesEl.appendChild(
      createWelcome()
    );

  }else{

    chat.messages.forEach(
      message => {

        addMessage(
          message.role,
          message.content,
          false
        );

      }
    );

  }


  scrollBottom();

}


/* =====================================================
   NEW CHAT
===================================================== */

function newChat(){

  const chat = {

    id:uid(),

    title:"New Chat",

    messages:[]

  };


  chats.push(chat);

  current =
    chat.id;


  save();


  messagesEl.innerHTML =
    "";


  messagesEl.appendChild(
    createWelcome()
  );


  input.value =
    "";


  renderHistory();

  input.focus();

}


document
  .getElementById("newChat")
  .onclick =
  newChat;


/* =====================================================
   SAVE MESSAGE
===================================================== */

function addToCurrentChat(
  role,
  content
){

  const chat =
    ensureChat();


  chat.messages.push({

    role:role,

    content:content

  });


  if(
    role === "user" &&
    chat.title === "New Chat"
  ){

    chat.title =
      content.length > 42
        ? content.slice(0,42) + "…"
        : content;

  }


  if(
    chat.messages.length > 40
  ){

    chat.messages =
      chat.messages.slice(-40);

  }


  save();

  renderHistory();

}


/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHTML(text){

  return String(text)
    .replace(
      /[&<>"']/g,
      char => {

        return {

          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#039;"

        }[char];

      }
    );

}


/* =====================================================
   MARKDOWN + CODE RENDERER
===================================================== */

function renderMarkdown(source){

  const lines =
    String(source)
      .replace(/\r/g,"")
      .split("\n");


  let html = "";

  let inCode = false;

  let language = "";

  let codeBuffer = "";

  let listOpen = false;


  function closeList(){

    if(listOpen){

      html += "</ul>";

      listOpen =
        false;

    }

  }


  function addCodeBlock(){

    const id =
      "code_" + uid();


    html += `

      <div class="code-wrap">

        <div class="code-head">

          <span class="code-lang">

            ${escapeHTML(
              language || "code"
            )}

          </span>


          <button
            class="code-copy"
            data-id="${id}"
          >

            Copy

          </button>

        </div>


        <pre
          class="code-body"
          id="${id}"
        >${escapeHTML(
          codeBuffer
            .replace(/\n$/,"")
        )}</pre>

      </div>

    `;

  }


  for(
    const line of lines
  ){

    if(
      line
        .trim()
        .startsWith("```")
    ){

      if(!inCode){

        closeList();

        inCode =
          true;

        language =
          line
            .trim()
            .slice(3)
            .trim();

        codeBuffer =
          "";

      }else{

        addCodeBlock();

        inCode =
          false;

        language =
          "";

        codeBuffer =
          "";

      }

      continue;

    }


    if(inCode){

      codeBuffer +=
        line + "\n";

      continue;

    }


    if(
      !line.trim()
    ){

      closeList();

      continue;

    }


    let text =
      escapeHTML(line);


    text =
      text.replace(
        /`([^`]+)`/g,
        '<code class="inline-code">$1</code>'
      );


    text =
      text.replace(
        /\*\*([^*]+)\*\*/g,
        "<strong>$1</strong>"
      );


    if(
      /^#{1,3}\s+/.test(line)
    ){

      closeList();


      html += `

        <div class="md-h">

          ${text.replace(
            /^#{1,3}\s+/,
            ""
          )}

        </div>

      `;


    }else if(
      /^[-*]\s+/.test(line)
    ){

      if(!listOpen){

        html +=
          "<ul class='md-ul'>";

        listOpen =
          true;

      }


      html += `

        <li class="md-li">

          ${text.replace(
            /^[-*]\s+/,
            ""
          )}

        </li>

      `;


    }else{

      closeList();


      html += `

        <div class="md-p">

          ${text}

        </div>

      `;

    }

  }


  if(inCode){

    addCodeBlock();

  }


  closeList();


  return html;

}


/* =====================================================
   MESSAGE ACTIONS
===================================================== */

function createActions(text){

  const actions =
    document.createElement(
      "div"
    );


  actions.className =
    "actions";


  const copy =
    document.createElement(
      "button"
    );


  copy.textContent =
    "⧉";


  copy.title =
    "Copy answer";


  copy.onclick =
    async () => {

      try{

        await navigator
          .clipboard
          .writeText(text);


        copy.textContent =
          "✓";


        setTimeout(
          () => {

            copy.textContent =
              "⧉";

          },
          900
        );


      }catch{

        copy.textContent =
          "Failed";

      }

    };


  const speakButton =
    document.createElement(
      "button"
    );


  speakButton.textContent =
    "🔊";


  speakButton.title =
    "Read aloud";


  speakButton.onclick =
    () => {

      speakText(text);

    };


  actions.appendChild(
    copy
  );


  actions.appendChild(
    speakButton
  );


  return actions;

}


/* =====================================================
   ADD MESSAGE
===================================================== */

function addMessage(
  role,
  text,
  saveIt = true
){

  const message =
    document.createElement(
      "div"
    );


  message.className =
    "message " +
    (
      role === "assistant"
        ? "assistant"
        : "user"
    );


  message.innerHTML = `

    <div class="message-inner">

      <div class="avatar">

        ${
          role === "assistant"
            ? "A"
            : "U"
        }

      </div>


      <div class="content">

        <div class="name">

          ${
            role === "assistant"
              ? "ARES"
              : "YOU"
          }

        </div>


        <div class="text"></div>

      </div>

    </div>

  `;


  const textDiv =
    message.querySelector(
      ".text"
    );


  if(
    role === "assistant"
  ){

    textDiv.innerHTML =
      renderMarkdown(text);


    message
      .querySelectorAll(
        ".code-copy"
      )
      .forEach(button => {

        button.onclick =
          async () => {

            const code =
              document.getElementById(
                button.dataset.id
              );


            try{

              await navigator
                .clipboard
                .writeText(
                  code.innerText
                );


              button.textContent =
                "✓ Copied";


              setTimeout(
                () => {

                  button.textContent =
                    "Copy";

                },
                1000
              );


            }catch{

              button.textContent =
                "Failed";

            }

          };

      });


    message
      .querySelector(
        ".content"
      )
      .appendChild(
        createActions(text)
      );


  }else{

    textDiv.textContent =
      text;

  }


  messagesEl.appendChild(
    message
  );


  if(saveIt){

    addToCurrentChat(
      role,
      text
    );

  }


  scrollBottom();


  return message;

}


/* =====================================================
   THINKING
===================================================== */

function addThinking(){

  const message =
    document.createElement(
      "div"
    );


  message.className =
    "message assistant";


  message.innerHTML = `

    <div class="message-inner">

      <div class="avatar">
        A
      </div>


      <div class="content">

        <div class="name">
          ARES
        </div>


        <div class="thinking">

          <span></span>

          <span></span>

          <span></span>

        </div>

      </div>

    </div>

  `;


  messagesEl.appendChild(
    message
  );


  scrollBottom();


  return message;

}


/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage(){

  const question =
    input.value.trim();


  if(!question){

    return;

  }


  const chat =
    ensureChat();


  addMessage(
    "user",
    question,
    true
  );


  input.value =
    "";


  input.style.height =
    "auto";


  send.disabled =
    true;


  send.style.opacity =
    ".5";


  const thinking =
    addThinking();


  try{

    const response =
      await fetch(
        API_URL,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              message:
                question,

              messages:
                chat.messages
                  .slice(-24)

            })

        }
      );


    const rawText =
      await response.text();


    let data = {};


    try{

      data =
        rawText
          ? JSON.parse(rawText)
          : {};

    }catch{

      data = {};

    }


    thinking.remove();


    if(
      !response.ok
    ){

      addMessage(
        "assistant",
        "ARES Error: " +
        (
          data.error ||
          "Server error " +
          response.status
        ),
        true
      );


      return;

    }


    if(
      !data.reply
    ){

      addMessage(
        "assistant",
        "ARES Error: Backend returned an empty response.",
        true
      );


      return;

    }


    addMessage(
      "assistant",
      data.reply,
      true
    );


  }catch(error){

    thinking.remove();


    console.error(
      "ARES error:",
      error
    );


    addMessage(
      "assistant",
      "ARES Error: Could not connect to the backend. Please try again.",
      true
    );


  }finally{

    send.disabled =
      false;


    send.style.opacity =
      "1";


    input.focus();

  }

}


/* =====================================================
   SCROLL
===================================================== */

function scrollBottom(){

  messagesEl.scrollTop =
    messagesEl.scrollHeight;

}


/* =====================================================
   ENTER
===================================================== */

input.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =====================================================
   AUTO RESIZE
===================================================== */

input.addEventListener(
  "input",
  () => {

    input.style.height =
      "auto";


    input.style.height =
      Math.min(
        input.scrollHeight,
        140
      ) + "px";

  }
);


/* =====================================================
   VOICE INPUT
===================================================== */

document
  .getElementById("mic")
  .onclick =
  () => {

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;


    if(!SpeechRecognition){

      alert(
        "Voice input is not supported in this browser."
      );

      return;

    }


    const recognition =
      new SpeechRecognition();


    const mic =
      document.getElementById(
        "mic"
      );


    mic.textContent =
      "⏺";


    recognition.lang =
      "en-IN";


    recognition.interimResults =
      false;


    recognition.maxAlternatives =
      1;


    recognition.start();


    recognition.onresult =
      event => {

        input.value =
          event
            .results[0][0]
            .transcript;


        input.dispatchEvent(
          new Event("input")
        );

      };


    recognition.onend =
      () => {

        mic.textContent =
          "🎙";

      };


    recognition.onerror =
      () => {

        mic.textContent =
          "🎙";

      };

  };


/* =====================================================
   VOICE SETTINGS
===================================================== */

document
  .getElementById("voiceButton")
  .onclick =
  () => {

    voicePanel
      .classList
      .toggle("open");


    loadVoices();

  };


function loadVoices(){

  if(
    !("speechSynthesis" in window)
  ){

    return;

  }


  const voices =
    speechSynthesis
      .getVoices();


  voiceSelect.innerHTML =
    "";


  voices.forEach(
    (voice,index) => {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        index;


      option.textContent =
        voice.name +
        " — " +
        voice.lang;


      voiceSelect.appendChild(
        option
      );

    }
  );


  const saved =
    localStorage.getItem(
      "ares_voice"
    );


  if(saved !== null){

    voiceSelect.value =
      saved;

  }

}


if(
  "speechSynthesis"
  in window
){

  speechSynthesis
    .onvoiceschanged =
    loadVoices;


  setTimeout(
    loadVoices,
    400
  );

}


voiceSelect.onchange =
  () => {

    localStorage.setItem(
      "ares_voice",
      voiceSelect.value
    );

  };


/* =====================================================
   SPEAK
===================================================== */

function speakText(text){

  if(
    !("speechSynthesis"
      in window)
  ){

    return;

  }


  speechSynthesis.cancel();


  const cleanText =
    text.replace(
      /```[\s\S]*?```/g,
      " code block "
    );


  const utterance =
    new SpeechSynthesisUtterance(
      cleanText
    );


  const voices =
    speechSynthesis
      .getVoices();


  const selected =
    voices[
      Number(
        voiceSelect.value
      )
    ];


  if(selected){

    utterance.voice =
      selected;

  }


  speechSynthesis.speak(
    utterance
  );

}


/* =====================================================
   START
===================================================== */

if(
  current &&
  getCurrent()
){

  loadChat(
    current
  );

}else{

  ensureChat();

  messagesEl.appendChild(
    createWelcome()
  );

}


renderHistory();

input.focus();

</script>
