<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>ARES AI</title>

<style>

/* =====================================================
   BASE
===================================================== */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
}

body{

  background:#070306;

  color:#f7f7f7;

  font-family:
    Inter,
    Arial,
    system-ui,
    sans-serif;

  overflow:hidden;
}


/* =====================================================
   LIQUID BACKGROUND
===================================================== */

body::before{

  content:"";

  position:fixed;

  inset:-30%;

  z-index:-3;

  background:

    radial-gradient(
      circle at 15% 25%,
      rgba(255,30,55,.20),
      transparent 27%
    ),

    radial-gradient(
      circle at 80% 20%,
      rgba(180,10,35,.18),
      transparent 28%
    ),

    radial-gradient(
      circle at 55% 80%,
      rgba(255,15,40,.15),
      transparent 32%
    ),

    linear-gradient(
      120deg,
      #090305,
      #17060b,
      #080204
    );

  filter:blur(25px);

  animation:
    liquidMove 18s ease-in-out infinite alternate;
}


body::after{

  content:"";

  position:fixed;

  inset:0;

  z-index:-2;

  pointer-events:none;

  background:

    linear-gradient(
      rgba(255,40,55,.035) 1px,
      transparent 1px
    ),

    linear-gradient(
      90deg,
      rgba(255,40,55,.035) 1px,
      transparent 1px
    );

  background-size:
    38px 38px;

  mask-image:
    radial-gradient(
      ellipse at center,
      black,
      transparent 80%
    );
}


@keyframes liquidMove{

  0%{
    transform:
      translate3d(-3%, -2%, 0)
      scale(1);
  }

  50%{
    transform:
      translate3d(3%, 2%, 0)
      scale(1.08);
  }

  100%{
    transform:
      translate3d(-1%, 4%, 0)
      scale(1.03);
  }
}


/* =====================================================
   APP
===================================================== */

.app{

  width:100%;
  height:100vh;

  display:flex;
}


/* =====================================================
   SIDEBAR
===================================================== */

.sidebar{

  width:250px;

  height:100vh;

  flex-shrink:0;

  background:
    linear-gradient(
      180deg,
      rgba(15,6,9,.88),
      rgba(7,3,5,.94)
    );

  backdrop-filter:
    blur(25px)
    saturate(140%);

  -webkit-backdrop-filter:
    blur(25px)
    saturate(140%);

  border-right:
    1px solid
    rgba(255,70,85,.18);

  display:flex;

  flex-direction:column;

  position:relative;

  z-index:50;

  box-shadow:
    10px 0 50px
    rgba(0,0,0,.25);
}


.logo{

  height:60px;

  display:flex;

  align-items:center;

  padding:0 18px;

  font-size:18px;

  font-weight:800;

  border-bottom:
    1px solid
    rgba(255,60,75,.13);
}


.logo span{

  color:#ff4054;

  text-shadow:
    0 0 18px
    rgba(255,30,55,.8);
}


.logo-dot{

  width:7px;
  height:7px;

  border-radius:50%;

  background:#ff3045;

  margin-left:8px;

  box-shadow:
    0 0 14px #ff3045;
}


/* =====================================================
   NEW CHAT
===================================================== */

.newchat{

  margin:13px;

  padding:12px;

  border-radius:12px;

  border:
    1px solid
    rgba(255,70,80,.25);

  background:
    linear-gradient(
      135deg,
      rgba(90,15,27,.55),
      rgba(30,6,11,.65)
    );

  color:white;

  cursor:pointer;

  font-size:13px;

  transition:.2s;

  box-shadow:
    inset 0 1px 0
    rgba(255,255,255,.04);
}


.newchat:hover{

  transform:
    translateY(-1px);

  border-color:
    rgba(255,80,90,.5);

  box-shadow:
    0 8px 25px
    rgba(255,20,40,.12);
}


/* =====================================================
   HISTORY
===================================================== */

.history-title{

  padding:
    4px 15px 8px;

  color:#666;

  font-size:10px;

  text-transform:uppercase;

  letter-spacing:1.2px;
}


.history{

  padding:0 8px;

  overflow-y:auto;

  flex:1;
}


.history-item{

  padding:
    10px 11px;

  margin-bottom:3px;

  color:#999;

  border-radius:9px;

  cursor:pointer;

  font-size:12px;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;

  border:1px solid transparent;

  transition:.18s;
}


.history-item:hover{

  background:
    rgba(255,35,55,.08);

  border-color:
    rgba(255,60,70,.12);

  color:white;
}


.history-item.active{

  color:white;

  background:
    linear-gradient(
      100deg,
      rgba(110,15,30,.32),
      rgba(50,7,14,.20)

    rgba(255,60,70,.22);
}


/* =====================================================
   SIDEBAR FOOTER
===================================================== */

.sidebar-footer{

  padding:13px;

  border-top:
    1px solid
    rgba(255,50,60,.10);

  color:#505050;

  font-size:10px;

  text-align:center;
}


/* =====================================================
   MAIN
===================================================== */

.main{

  flex:1;

  min-width:0;

  height:100vh;

  display:flex;

  flex-direction:column;
}


/* =====================================================
   HEADER
===================================================== */

.header{

  height:60px;

  flex-shrink:0;

  background:
    rgba(8,4,6,.62);

  backdrop-filter:
    blur(20px)
    saturate(140%);

  -webkit-backdrop-filter:
    blur(20px)
    saturate(140%);

    1px solid
    rgba(255,55,70,.14);

  display:flex;

  justify-content:space-between;

  align-items:center;

  padding:0 18px;

  z-index:30;
}


.header-left{

  display:flex;

  align-items:center;

  gap:10px;
}


.menu-button,
.more-button{

  width:36px;
  height:36px;

  border:0;

  border-radius:10px;

  background:
    rgba(255,255,255,.045);

  color:#aaa;

  cursor:pointer;

  font-size:18px;
}


.menu-button:hover,
.more-button:hover{

  color:white;

  background:
    rgba(255,40,55,.12);
}


.menu-button{

  display:none;
}


.header-title{

  font-size:14px;

  font-weight:700;
}


.header-status{

  display:flex;

  align-items:center;

  gap:6px;

  font-size:10px;

  color:#ff5362;
}


.status-dot{

  width:6px;
  height:6px;

  border-radius:50%;

  background:#ff3548;

  box-shadow:
    0 0 10px #ff3548;
}


/* =====================================================
   MESSAGES
===================================================== */

.messages{

  flex:1;

  overflow-y:auto;

  padding:
    30px 20px 155px;

  scroll-behavior:smooth;
}


.message{

  width:100%;

  display:flex;

  margin-bottom:30px;

  animation:
    messageIn .22s ease;
}


@keyframes messageIn{

  from{
    opacity:0;
    transform:translateY(7px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}


.message-inner{

  max-width:900px;

  display:flex;

  gap:11px;
}


.assistant{

  justify-content:flex-start;
}


.user{

  justify-content:flex-end;
}


.user .message-inner{

  flex-direction:row-reverse;
}


.avatar{

  width:34px;
  height:34px;

  min-width:34px;

  border-radius:10px;

  display:flex;

  align-items:center;

  justify-content:center;

  font-weight:800;

  font-size:11px;
}


.assistant .avatar{

  background:
    linear-gradient(
      145deg,
      #48101b,
      #130509
    );

  color:#ff4a5b;

  border:
    1px solid
    rgba(255,55,70,.25);

  box-shadow:
    0 0 20px
    rgba(255,20,40,.08);
}


.user .avatar{

  background:
    rgba(255,255,255,.09);

  color:white;
}


.content{

  max-width:780px;

  min-width:0;
}


.name{

  font-size:10px;

  color:#666;

  margin-bottom:7px;

  letter-spacing:.3px;
}


/* =====================================================
   MESSAGE TEXT
===================================================== */

.text{

  line-height:1.72;

  word-break:break-word;

  font-size:14px;

  color:#e9e9e9;
}


.user .text{

  background:
    linear-gradient(
      135deg,
      rgba(90,17,30,.78),
      rgba(48,8,16,.70)
    );

  border:
    1px solid
    rgba(255,55,70,.16);

  padding:
    11px 14px;

  border-radius:
    14px 14px 4px 14px;
}


/* =====================================================
   MARKDOWN
===================================================== */

.text h2{

  font-size:18px;

  margin:
    18px 0 9px;

  color:#fff;
}


.text h3{

  font-size:15px;

  margin:
    15px 0 7px;

  color:#fff;
}


.text strong{

  color:#fff;

  font-weight:700;
}


.text code.inline{

  background:
    rgba(255,50,65,.10);

  border:
    1px solid
    rgba(255,60,70,.14);

  padding:
    2px 6px;

  border-radius:6px;

  color:#ff8290;

  font-family:
    ui-monospace,
    SFMono-Regular,
    Consolas,
    monospace;

  font-size:12px;
}


/* =====================================================
   PREMIUM CODE BOX
===================================================== */

.code-card{

  margin:
    14px 0;

  border:
    1px solid
    rgba(255,65,80,.20);

  border-radius:14px;

  overflow:hidden;

  background:
    linear-gradient(
      145deg,
      rgba(27,8,13,.92),
      rgba(9,4,7,.88)
    );

  backdrop-filter:
    blur(18px)
    saturate(130%);

  -webkit-backdrop-filter:
    blur(18px)
    saturate(130%);

  box-shadow:

    inset 0 1px 0
    rgba(255,255,255,.035),

    0 12px 35px
    rgba(0,0,0,.25);
}


.code-top{

  height:40px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:
    0 10px 0 13px;

  border-bottom:
    1px solid
    rgba(255,55,70,.12);

  background:
    rgba(255,35,50,.035);
}


.code-lang{

  color:#777;

  font-size:10px;

  text-transform:uppercase;

  letter-spacing:1px;
}


.copy-code{

  border:0;

  border-radius:8px;

  padding:
    7px 10px;

  background:
    rgba(255,50,65,.09);

  color:#aaa;

  cursor:pointer;

  font-size:11px;

  transition:.18s;
}


.copy-code:hover{

  color:white;

  background:
    rgba(255,50,65,.18);
}


.code-body{

  padding:
    14px;

  overflow-x:auto;

  font-family:
    ui-monospace,
    SFMono-Regular,
    Consolas,
    monospace;

  font-size:12px;

  line-height:1.7;

  color:#eee;

  white-space:pre;
}


/* =====================================================
   ACTIONS
===================================================== */

.actions{

  display:flex;

  gap:3px;

  margin-top:8px;

  align-items:center;
}


.actions button{

  border:0;

  background:
    rgba(255,255,255,.025);

  color:#666;

  cursor:pointer;

  font-size:12px;

  padding:
    6px 8px;

  border-radius:7px;

  transition:.18s;
}


.actions button:hover{

  color:#ff5362;

  background:
    rgba(255,40,50,.08);
}


/* =====================================================
   SPEECH PLAYER
===================================================== */

.speech-player{

  display:none;

  margin-top:8px;

  padding:
    8px 10px;

  width:min(430px,100%);

  border:
    1px solid
    rgba(255,60,75,.17);

  border-radius:11px;

  background:
    rgba(20,6,10,.65);

  backdrop-filter:
    blur(15px);
}


.speech-player.show{

  display:block;
}


.speech-row{

  display:flex;

  align-items:center;

  gap:7px;
}


.speech-btn{

  width:30px;
  height:30px;

  border:0;

  border-radius:8px;

  background:
    rgba(255,255,255,.06);

  color:#aaa;

  cursor:pointer;
}


.speech-btn:hover{

  color:white;

  background:
    rgba(255,50,65,.12);
}


.speech-progress{

  flex:1;

  accent-color:#ff4053;
}


.speech-time{

  color:#666;

  font-size:9px;

  min-width:30px;
}


/* =====================================================
   THINKING
===================================================== */

.thinking{

  display:flex;

  gap:5px;

  align-items:center;

  height:25px;
}


.thinking span{

  width:6px;
  height:6px;

  border-radius:50%;

  background:#ff3d4d;

  animation:
    think 1.1s infinite;
}


.thinking span:nth-child(2){

  animation-delay:.15s;
}


.thinking span:nth-child(3){

  animation-delay:.30s;
}


@keyframes think{

  0%,60%,100%{
    transform:translateY(0);
    opacity:.3;
  }

  30%{
    transform:translateY(-5px);
    opacity:1;
  }
}


/* =====================================================
   WELCOME
===================================================== */

.welcome{

  max-width:800px;

  margin:
    8vh auto 50px;

  text-align:center;
}


.welcome-logo{

  width:64px;
  height:64px;

  margin:auto;

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:18px;

  background:
    linear-gradient(
      145deg,
      #53111c,
      #15060a
    );

  border:
    1px solid
    rgba(255,60,70,.3);

  color:#ff4352;

  font-weight:800;

  font-size:22px;

  box-shadow:
    0 0 45px
    rgba(255,20,35,.16);
}


.welcome h1{

  margin:
    17px 0 7px;

  font-size:28px;
}


.welcome p{

  color:#777;

  font-size:13px;

  margin:
    0 0 25px;
}


.suggestions{

  display:flex;

  flex-wrap:wrap;

  justify-content:center;

  gap:9px;
}


.suggestion{

  padding:
    10px 13px;

  border-radius:10px;

  border:
    1px solid
    rgba(255,55,65,.15);

  background:
    rgba(30,8,12,.52);

  color:#aaa;

  cursor:pointer;

  font-size:11px;

  transition:.18s;
}


.suggestion:hover{

  color:white;

  border-color:
    rgba(255,60,70,.4);

  transform:
    translateY(-1px);
}


/* =====================================================
   BOTTOM INPUT
===================================================== */

.bottom{

  position:fixed;

  left:250px;

  right:0;

  bottom:0;

  padding:
    10px 18px 15px;

  background:
    linear-gradient(
      transparent,
      rgba(7,3,5,.96) 35%
    );

  z-index:20;
}


.inputbox{

  max-width:900px;

  margin:auto;

  display:flex;

  align-items:flex-end;

  gap:5px;

  background:
    linear-gradient(
      135deg,
      rgba(31,8,13,.88),
      rgba(13,5,8,.88)
    );

  border:
    1px solid
    rgba(255,60,75,.23);

  border-radius:15px;

  padding:7px;

  backdrop-filter:
    blur(25px)
    saturate(150%);

  -webkit-backdrop-filter:
    blur(25px)
    saturate(150%);

  box-shadow:
    0 12px 45px
    rgba(0,0,0,.35),

    inset 0 1px 0
    rgba(255,255,255,.035);
}


textarea{

  flex:1;

  resize:none;

  min-height:42px;

  max-height:140px;

  border:0;

  outline:0;

  background:none;

  color:white;

  padding:
    10px;

  font:inherit;

  font-size:14px;
}


textarea::placeholder{

  color:#5d5d5d;
}


.mic,
.send{

  width:42px;
  height:42px;

  flex-shrink:0;

  border:0;

  border-radius:10px;

  cursor:pointer;
}


.mic{

  background:
    transparent;

  color:#aaa;
}


.mic:hover{

  color:white;

  background:
    rgba(255,40,50,.08);
}


.send{

  background:
    linear-gradient(
      135deg,
      #ff4052,
      #c91e32
    );

  color:white;

  font-weight:bold;

  box-shadow:
    0 5px 20px
    rgba(255,30,50,.18);
}


.send:disabled{

  opacity:.4;
}


.note{

  text-align:center;

  color:#4e4e4e;

  font-size:9px;

  margin-top:5px;
}


/* =====================================================
   VOICE PANEL
===================================================== */

.voice-panel{

  position:fixed;

  top:68px;

  right:18px;

  width:290px;

  max-height:70vh;

  overflow:auto;

  display:none;

  z-index:100;

  padding:14px;

  border:
    1px solid
    rgba(255,60,75,.2);

  border-radius:16px;

  background:
    rgba(14,5,8,.88);

  backdrop-filter:
    blur(25px)
    saturate(150%);

  -webkit-backdrop-filter:
    blur(25px)
    saturate(150%);

  box-shadow:
    0 20px 60px
    rgba(0,0,0,.45);
}


.voice-panel.show{

  display:block;
}


.voice-title{

  font-size:13px;

  font-weight:bold;

  margin-bottom:10px;
}


.voice-select{

  width:100%;

  border:
    1px solid
    rgba(255,60,75,.18);

  border-radius:10px;

  padding:10px;

  background:#14070b;

  color:white;

  outline:none;
}


.voice-info{

  color:#666;

  font-size:10px;

  line-height:1.5;

  margin-top:9px;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

  .sidebar{

    position:fixed;

    left:-270px;

    top:0;

    width:250px;

    transition:
      left .25s ease;

    z-index:80;
  }


  .sidebar.open{

    left:0;
  }


  .menu-button{

    display:block;
  }


  .bottom{

    left:0;

    padding:
      8px 9px 11px;
  }


  .messages{

    padding:
      20px 11px 145px;
  }


  .message-inner{

    max-width:96%;
  }


  .content{

    max-width:calc(100vw - 75px);
  }


  .welcome{

    margin-top:7vh;
  }


  .welcome h1{

    font-size:23px;
  }


  .voice-panel{

    right:10px;

    width:
      calc(100vw - 20px);
  }

}


@media(min-width:701px){

  .more-button{

    display:block;
  }

}


</style>

</head>


<body>


<div class="app">


  <!-- =================================================
       SIDEBAR
  ================================================== -->

  <aside
    class="sidebar"
    id="sidebar"
  >

    <div class="logo">

      <span>ARES</span>

      <div class="logo-dot"></div>

    </div>


    <button
      class="newchat"
      onclick="newChat()"
    >
      ＋ New Chat
    </button>


    <div class="history-title">
      Recent Chats
    </div>


    <div
      class="history"
      id="history"
    ></div>


    <div class="sidebar-footer">
      ARES AI • Local Chat Memory
    </div>

  </aside>


  <!-- =================================================
       MAIN
  ================================================== -->

  <main class="main">


    <header class="header">


      <div class="header-left">


        <button
          class="menu-button"
          onclick="toggleSidebar()"
        >
          ☰
        </button>


        <div class="header-title">
          ARES AI
        </div>


      </div>


      <div
        class="header-status"
      >

        <span
          class="status-dot"
        ></span>

        Online

        <button
          class="more-button"
          onclick="toggleVoicePanel()"
          title="Voice settings"
        >
          ⋮
        </button>

      </div>


    </header>


    <!-- =================================================
         MESSAGES
    ================================================== -->

    <div
      class="messages"
      id="messages"
    ></div>


    <!-- =================================================
         INPUT
    ================================================== -->

    <div class="bottom">


      <div class="inputbox">


        <textarea
          id="input"
          placeholder="Message ARES..."
          rows="1"
        ></textarea>


        <button
          class="mic"
          id="mic"
          title="Voice input"
          onclick="startVoice()"
        >
          🎙
        </button>


        <button
          class="send"
          id="sendButton"
          onclick="sendMessage()"
          title="Send"
        >
          ➤
        </button>


      </div>


      <div class="note">

        ARES AI can make mistakes.
        Verify important information.

      </div>


    </div>


  </main>

</div>


<!-- =====================================================
     VOICE PANEL
====================================================== -->

<div
  class="voice-panel"
  id="voicePanel"
>

  <div class="voice-title">
    🔊 ARES Voice
  </div>


  <select
    class="voice-select"
    id="voiceSelect"
  >

    <option>
      Loading voices...
    </option>

  </select>


  <div class="voice-info">

    Available voices depend on your browser and
    Android/device TTS engine. You can select any
    installed voice here.

  </div>

</div>


<script>

/* =====================================================
   CONFIG
===================================================== */

const API_URL =
  "https://ares-cyber-intelligence.vercel.app/api/chat";


/* =====================================================
   ELEMENTS
===================================================== */

const input =
  document.getElementById("input");

const messages =
  document.getElementById("messages");

const history =
  document.getElementById("history");

const sendButton =
  document.getElementById("sendButton");

const sidebar =
  document.getElementById("sidebar");

const voicePanel =
  document.getElementById("voicePanel");

const voiceSelect =
  document.getElementById("voiceSelect");


/* =====================================================
   CHAT DATA
===================================================== */

let chats =
  JSON.parse(
    localStorage.getItem("ares_chats") || "[]"
  );


let currentChatId = null;


/* =====================================================
   SAVE
===================================================== */

function saveChats(){

  localStorage.setItem(
    "ares_chats",
    JSON.stringify(chats)
  );

}


/* =====================================================
   NEW CHAT
===================================================== */

function newChat(){

  const chat = {

    id:
      Date.now(),

    title:
      "New Chat",

    messages:
      []

  };


  chats.push(chat);

  currentChatId =
    chat.id;

  saveChats();

  renderHistory();

  renderChat();

  input.focus();

}


/* =====================================================
   CURRENT CHAT
===================================================== */

function getCurrentChat(){

  return chats.find(
    chat =>
      chat.id === currentChatId
  );

}


/* =====================================================
   OPEN CHAT
===================================================== */

function openChat(id){

  currentChatId =
    id;

  renderHistory();

  renderChat();

  sidebar.classList.remove(
    "open"
  );

  input.focus();

}


/* =====================================================
   RENDER HISTORY
===================================================== */

function renderHistory(){

  history.innerHTML = "";


  chats
    .slice()
    .reverse()
    .forEach(chat => {

      const item =
        document.createElement("div");


      item.className =
        "history-item" +
        (
          chat.id === currentChatId
            ? " active"
            : ""
        );


      item.textContent =
        chat.title || "New Chat";


      item.onclick =
        () => openChat(chat.id);


      history.appendChild(item);

    });

}


/* =====================================================
   RENDER CHAT
===================================================== */

function renderChat(){

  messages.innerHTML = "";


  const chat =
    getCurrentChat();


  if(!chat){

    showWelcome();

    return;

  }


  if(!chat.messages.length){

    showWelcome();

    return;

  }


  chat.messages.forEach(msg => {

    addMessage(
      msg.role === "user"
        ? "user"
        : "assistant",

      msg.content,

      false
    );

  });


  scrollBottom();

}

/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(str){

  return String(str)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================================
   MARKDOWN RENDERER
===================================================== */

function renderMarkdown(text){

  const blocks = [];

  text =
    String(text)
      .replace(
        /```([\w+-]*)\n?([\s\S]*?)```/g,
        function(match,lang,code){

          const index =
            blocks.length;

          blocks.push({
            lang:
              lang || "code",

            code:
              code.trim()
          });

          return `___CODE_BLOCK_${index}___`;

        }
      );


  let html =
    escapeHTML(text);


  html =
    html.replace(
      /^### (.*)$/gm,
      "<h3>$1</h3>"
    );


  html =
    html.replace(
      /^## (.*)$/gm,
      "<h2>$1</h2>"
    );


  html =
    html.replace(
      /\*\*(.*?)\*\*/g,
      "<strong>$1</strong>"
    );


  html =
    html.replace(
      /`([^`]+)`/g,
      '<code class="inline">$1</code>'
    );


  html =
    html.replace(
      /\n/g,
      "<br>"
    );


  blocks.forEach(
    function(block,index){

      const safeCode =
        escapeHTML(
          block.code
        );


      const card = `

        <div class="code-card">

          <div class="code-top">

            <span class="code-lang">
              ${escapeHTML(block.lang)}
            </span>

            <button
              class="copy-code"
              onclick="copyCode(this)"
              data-code="${encodeURIComponent(
                block.code
              )}"
            >
              Copy
            </button>

          </div>

          <pre class="code-body">${safeCode}</pre>

        </div>

      `;


      html =
        html.replace(
          `___CODE_BLOCK_${index}___`,
          card
        );

    }
  );


  return html;

}


/* =====================================================
   ADD MESSAGE
===================================================== */

function addMessage(
  type,
  text,
  scroll = true
){

  const message =
    document.createElement("div");


  message.className =
    "message " + type;


  const inner =
    document.createElement("div");


  inner.className =
    "message-inner";


  const avatar =
    document.createElement("div");


  avatar.className =
    "avatar";


  avatar.textContent =
    type === "assistant"
      ? "A"
      : "U";


  const content =
    document.createElement("div");


  content.className =
    "content";


  const name =
    document.createElement("div");


  name.className =
    "name";


  name.textContent =
    type === "assistant"
      ? "ARES"
      : "YOU";


  const textDiv =
    document.createElement("div");


  textDiv.className =
    "text";


  if(type === "assistant"){

    textDiv.innerHTML =
      renderMarkdown(text);

  }else{

    textDiv.textContent =
      text;

  }


  content.appendChild(name);

  content.appendChild(textDiv);


  if(type === "assistant"){

    content.appendChild(
      createActions(text)
    );

  }


  inner.appendChild(avatar);

  inner.appendChild(content);

  message.appendChild(inner);

  messages.appendChild(message);


  if(scroll){

    scrollBottom();

  }


  return message;

}


/* =====================================================
   CODE COPY
===================================================== */

async function copyCode(button){

  try{

    const code =
      decodeURIComponent(
        button.dataset.code
      );


    await navigator.clipboard.writeText(
      code
    );


    button.textContent =
      "✓ Copied";


    setTimeout(
      () => {
        button.textContent =
          "Copy";
      },
      1200
    );

  }catch(error){

    button.textContent =
      "Failed";

  }

}


/* =====================================================
   ACTIONS
===================================================== */

function createActions(text){

  const actions =
    document.createElement("div");


  actions.className =
    "actions";


  const copy =
    document.createElement("button");


  copy.textContent =
    "⧉";


  copy.title =
    "Copy answer";


  copy.onclick =
    async function(){

      await navigator.clipboard.writeText(
        text
      );

      copy.textContent =
        "✓";

      setTimeout(
        () => {
          copy.textContent =
            "⧉";
        },
        1000
      );

    };


  const speak =
    document.createElement("button");


  speak.textContent =
    "🔊";


  speak.title =
    "Read aloud";


  const player =
    createSpeechPlayer(
      text
    );


  speak.onclick =
    function(){

      player.classList.add(
        "show"
      );

      startSpeech(
        text,
        player
      );

    };


  const stop =
    document.createElement("button");


  stop.textContent =
    "■";


  stop.title =
    "Stop speaking";


  stop.onclick =
    function(){

      speechSynthesis.cancel();

    };


  actions.appendChild(copy);

  actions.appendChild(speak);

  actions.appendChild(stop);


  actions.appendChild(
    player
  );


  return actions;

}


/* =====================================================
   SPEECH PLAYER
===================================================== */

function createSpeechPlayer(text){

  const player =
    document.createElement("div");


  player.className =
    "speech-player";


  player.innerHTML = `

    <div class="speech-row">

      <button
        class="speech-btn play"
      >
        ▶
      </button>

      <button
        class="speech-btn stop"
      >
        ■
      </button>

      <input
        class="speech-progress"
        type="range"
        min="0"
        max="100"
        value="0"
      >

      <span class="speech-time">
        0%
      </span>

    </div>

  `;


  const play =
    player.querySelector(".play");

  const stop =
    player.querySelector(".stop");

  const progress =
    player.querySelector(".speech-progress");

  const time =
    player.querySelector(".speech-time");


  play.onclick =
    function(){

      startSpeech(
        text,
        player
      );

    };


  stop.onclick =
    function(){

      speechSynthesis.cancel();

      progress.value =
        0;

      time.textContent =
        "0%";

    };


  progress.oninput =
    function(){

      const percent =
        Number(
          progress.value
        );

      speechSynthesis.cancel();

      speakFromPercent(
        text,
        percent,
        player
      );

    };


  player._progress =
    progress;

  player._time =
    time;


  return player;

}


/* =====================================================
   SPEECH
===================================================== */

let currentUtterance = null;


function getSelectedVoice(){

  const voices =
    speechSynthesis.getVoices();


  const selectedName =
    voiceSelect.value;


  return voices.find(
    voice =>
      voice.name === selectedName
  ) || voices[0];

}


function startSpeech(
  text,
  player
){

  speechSynthesis.cancel();

  speakFromPercent(
    text,
    0,
    player
  );

}


function speakFromPercent(
  text,
  percent,
  player
){

  if(!("speechSynthesis" in window)){
    return;
  }


  const cleanText =
    String(text);


  const start =
    Math.floor(
      cleanText.length *
      (percent / 100)
    );


  const speechText =
    cleanText.slice(start);


  const utterance =
    new SpeechSynthesisUtterance(
      speechText
    );


  const voice =
    getSelectedVoice();


  if(voice){

    utterance.voice =
      voice;

  }


  utterance.rate =
    1.02;

  utterance.pitch =
    1.0;


  currentUtterance =
    utterance;


  utterance.onboundary =
    function(event){

      if(
        player &&
        player._progress
      ){

        const current =
          start +
          event.charIndex;


        const percentDone =
          Math.min(
            100,
            Math.round(
              current /
              cleanText.length *
              100
            )
          );


        player._progress.value =
          percentDone;


        player._time.textContent =
          percentDone + "%";

      }

    };


  utterance.onend =
    function(){

      if(player){

        player._progress.value =
          100;

        player._time.textContent =
          "100%";

      }

    };


  speechSynthesis.speak(
    utterance
  );

}


/* =====================================================
   LOAD VOICES
===================================================== */

function loadVoices(){

  const voices =
    speechSynthesis.getVoices();


  voiceSelect.innerHTML =
    "";


  if(!voices.length){

    const option =
      document.createElement("option");

    option.textContent =
      "No voices available";

    voiceSelect.appendChild(
      option
    );

    return;

  }


  voices.forEach(
    function(voice){

      const option =
        document.createElement("option");


      option.value =
        voice.name;


      option.textContent =
        `${voice.name} — ${voice.lang}`;


      voiceSelect.appendChild(
        option
      );

    }
  );

}


if("speechSynthesis" in window){

  loadVoices();

  speechSynthesis.onvoiceschanged =
    loadVoices;

}


/* =====================================================
   VOICE INPUT
===================================================== */

function startVoice(){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if(!SpeechRecognition){

    alert(
      "Voice input is not supported in this browser."
    );

    return;

  }


  const recognition =
    new SpeechRecognition();


  recognition.lang =
    "en-IN";


  recognition.interimResults =
    false;


  recognition.maxAlternatives =
    1;


  recognition.start();


  recognition.onresult =
    function(event){

      input.value =
        event
          .results[0][0]
          .transcript;

    };


  recognition.onerror =
    function(error){

      console.log(
        "Voice recognition:",
        error
      );

    };

}

/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage(){

  const question =
    input.value.trim();


  if(!question){
    return;
  }


  // Create chat automatically
  if(!currentChatId){

    const chat = {

      id:Date.now(),

      title:
        question.length > 38
          ? question.slice(0,38) + "..."
          : question,

      messages:[]

    };


    chats.push(chat);

    currentChatId =
      chat.id;

  }


  const chat =
    getCurrentChat();


  // First question becomes title
  if(
    !chat.messages.length &&
    chat.title === "New Chat"
  ){

    chat.title =
      question.length > 38
        ? question.slice(0,38) + "..."
        : question;

  }


  // Save user message
  chat.messages.push({

    role:
      "user",

    content:
      question

  });


  saveChats();

  renderHistory();


  // Display user
  addMessage(
    "user",
    question
  );


  input.value = "";

  input.style.height =
    "auto";


  sendButton.disabled =
    true;


  const thinking =
    addThinking();


  try{

    // Previous context
    const previous =
      chat.messages
        .slice(-13, -1);


    const response =
      await fetch(
        API_URL,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              message:
                question,

              history:
                previous

            })

        }
      );


    const raw =
      await response.text();


    let data = {};


    try{

      data =
        raw
          ? JSON.parse(raw)
          : {};

    }catch{

      data = {};

    }


    thinking.remove();


    if(!response.ok){

      addMessage(
        "assistant",
        "ARES Error: " +
        (
          data?.error ||
          `Server error (${response.status})`
        )
      );

      return;

    }


    const reply =
      data?.reply;


    if(!reply){

      addMessage(
        "assistant",
        "ARES Error: Empty response from backend."
      );

      return;

    }


    // Save AI answer
    chat.messages.push({

      role:
        "assistant",

      content:
        reply

    });


    saveChats();

    renderHistory();


    addMessage(
      "assistant",
      reply
    );


  }catch(error){

    thinking.remove();


    console.error(
      "ARES error:",
      error
    );


    addMessage(
      "assistant",
      "ARES Error: Could not connect to the backend."
    );

  }finally{

    sendButton.disabled =
      false;

    input.focus();

  }

}


/* =====================================================
   THINKING
===================================================== */

function addThinking(){

  const message =
    document.createElement("div");


  message.className =
    "message assistant";


  message.innerHTML = `

    <div class="message-inner">

      <div class="avatar">
        A
      </div>

      <div class="content">

        <div class="name">
          ARES
        </div>

        <div class="thinking">

          <span></span>
          <span></span>
          <span></span>

        </div>

      </div>

    </div>

  `;


  messages.appendChild(
    message
  );


  scrollBottom();


  return message;

}


/* =====================================================
   SCROLL
===================================================== */

function scrollBottom(){

  messages.scrollTop =
    messages.scrollHeight;

}


/* =====================================================
   ENTER
===================================================== */

input.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =====================================================
   AUTO RESIZE
===================================================== */

input.addEventListener(
  "input",
  function(){

    input.style.height =
      "auto";


    input.style.height =
      Math.min(
        input.scrollHeight,
        140
      ) + "px";

  }
);


/* =====================================================
   CLOSE VOICE PANEL
===================================================== */

document.addEventListener(
  "click",
  function(event){

    if(
      !voicePanel.contains(event.target) &&
      !event.target.closest(".more-button")
    ){

      voicePanel.classList.remove(
        "show"
      );

    }

  }
);


/* =====================================================
   START
===================================================== */

if(!chats.length){

  newChat();

}else{

  currentChatId =
    chats[chats.length - 1].id;

  renderHistory();

  renderChat();

}


input.focus();
