<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ARES AI</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#0b0d10;
  color:#f1f1f1;
  font-family:Arial,system-ui,sans-serif;
  height:100vh;
}

.app{
  height:100vh;
  display:flex;
}

/* SIDEBAR */

.sidebar{
  width:230px;
  background:#111318;
  border-right:1px solid #292d33;
  display:flex;
  flex-direction:column;
}

.logo{
  padding:18px;
  font-size:18px;
  font-weight:bold;
  border-bottom:1px solid #292d33;
}

.logo span{
  color:#19d3a2;
}

.newchat{
  margin:12px;
  padding:11px;
  border:1px solid #30353b;
  background:#191d22;
  color:white;
  border-radius:8px;
  cursor:pointer;
}

.newchat:hover{
  background:#20252b;
}

.history{
  padding:8px;
  overflow:auto;
}

.history-item{
  padding:9px;
  color:#999;
  border-radius:7px;
  cursor:pointer;
  font-size:13px;
}

.history-item:hover{
  background:#1b1f24;
  color:white;
}

/* MAIN */

.main{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
}

.header{
  height:55px;
  border-bottom:1px solid #292d33;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 16px;
}

.online{
  color:#19d3a2;
  font-size:11px;
}

/* CHAT */

.messages{
  flex:1;
  overflow-y:auto;
  padding:25px 15px 120px;
}

.message{
  width:100%;
  display:flex;
  margin-bottom:25px;
}

.message-inner{
  max-width:780px;
  display:flex;
  gap:10px;
}

/* ARES LEFT */

.assistant{
  justify-content:flex-start;
}

.assistant .message-inner{
  margin-right:auto;
}

/* USER RIGHT */

.user{
  justify-content:flex-end;
}

.user .message-inner{
  flex-direction:row-reverse;
  margin-left:auto;
}

.avatar{
  width:32px;
  height:32px;
  min-width:32px;
  border-radius:8px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-weight:bold;
  font-size:12px;
}

.assistant .avatar{
  background:#12352d;
  color:#19d3a2;
}

.user .avatar{
  background:#30353b;
  color:white;
}

.content{
  max-width:680px;
}

.name{
  font-size:11px;
  color:#777;
  margin-bottom:6px;
}

.text{
  line-height:1.6;
  white-space:pre-wrap;
  word-break:break-word;
}

/* USER MESSAGE */

.user .text{
  background:#193b33;
  padding:10px 13px;
  border-radius:12px;
  color:#f5f5f5;
}

/* CODE */

.code{
  margin:12px 0;
  background:#07090b;
  border:1px solid #30353a;
  border-radius:8px;
  overflow:hidden;
}

.code-top{
  display:flex;
  justify-content:space-between;
  padding:7px 10px;
  border-bottom:1px solid #30353a;
  font-size:10px;
  color:#777;
}

.code-top button{
  border:0;
  background:none;
  color:#19d3a2;
  cursor:pointer;
}

pre{
  margin:0;
  padding:13px;
  overflow:auto;
  color:#dffbf3;
  font-size:12px;
}

/* ACTIONS ONLY ARES */

.actions{
  display:flex;
  gap:2px;
  margin-top:7px;
}

.actions button{
  border:0;
  background:transparent;
  color:#777;
  cursor:pointer;
  font-size:14px;
  padding:5px 7px;
}

.actions button:hover{
  color:#fff;
}

/* INPUT */

.bottom{
  position:fixed;
  left:230px;
  right:0;
  bottom:0;
  padding:10px 14px 15px;
  background:linear-gradient(
    transparent,
    #0b0d10 25%
  );
}

.inputbox{
  max-width:780px;
  margin:auto;
  display:flex;
  align-items:flex-end;
  background:#15191e;
  border:1px solid #353a40;
  border-radius:11px;
  padding:6px;
}

textarea{
  flex:1;
  resize:none;
  min-height:42px;
  max-height:130px;
  border:0;
  outline:0;
  background:none;
  color:white;
  padding:10px;
  font:inherit;
}

textarea::placeholder{
  color:#666;
}

.mic,
.send{
  width:40px;
  height:40px;
  border:0;
  border-radius:8px;
  cursor:pointer;
}

.mic{
  background:none;
  color:#aaa;
}

.send{
  background:#19d3a2;
  color:#06110d;
  font-weight:bold;
}

.note{
  text-align:center;
  color:#555;
  font-size:9px;
  margin-top:5px;
}

/* MOBILE */

@media(max-width:600px){

  .sidebar{
    width:180px;
  }

  .bottom{
    left:180px;
  }

  .content{
    max-width:75vw;
  }

}

@media(max-width:450px){

  .sidebar{
    display:none;
  }

  .bottom{
    left:0;
  }

  .content{
    max-width:82vw;
  }

}

</style>
</head>

<body>

<div class="app">

  <aside class="sidebar">

    <div class="logo">
      <span>A</span>RES AI
    </div>

    <button class="newchat" onclick="newChat()">
      + New chat
    </button>

    <div class="history" id="history"></div>

  </aside>


  <main class="main">

    <header class="header">

      <b>ARES AI</b>

      <span class="online">
        ● Online
      </span>

    </header>


    <section
      class="messages"
      id="messages">
    </section>

  </main>

</div>


<div class="bottom">

  <form
    class="inputbox"
    id="form">

    <textarea
      id="input"
      placeholder="Message ARES AI..."
    ></textarea>

    <button
      type="button"
      class="mic"
      onclick="voice()">
      🎙
    </button>

    <button
      type="submit"
      class="send">
      ➤
    </button>

  </form>

  <div class="note">
    ARES AI can make mistakes. Verify important information.
  </div>

</div>


<script>

/* =========================
   DATA
========================= */

let currentChat = [];

let savedChats = [];


/* =========================
   ELEMENTS
========================= */

const messages =
  document.getElementById("messages");

const input =
  document.getElementById("input");

const form =
  document.getElementById("form");

const history =
  document.getElementById("history");


/* =========================
   START
========================= */

showWelcome();


function showWelcome(){

  messages.innerHTML="";

  addMessage(
    "assistant",
`Hello! 👋

Main ARES AI hoon.

Tum mujhse cybersecurity, Linux, networking, web security, programming aur security concepts ke baare mein pooch sakte ho.

Example:

"Explain DNS"
"Linux commands explain karo"
"TCP handshake kya hai?"
"HTTP request explain karo"`
  );

}


/* =========================
   SEND MESSAGE
========================= */

form.addEventListener(
  "submit",
  function(e){

    e.preventDefault();

    const question =
      input.value.trim();

    if(!question){
      return;
    }

    input.value="";

    addMessage(
      "user",
      question
    );


    setTimeout(
      function(){

        const answer =
          getAnswer(question);

        addMessage(
          "assistant",
          answer
        );

      },
      400
    );

  }
);


/* =========================
   ADD MESSAGE
========================= */

function addMessage(
  role,
  text
){

  currentChat.push({
    role:role,
    text:text
  });


  const message =
    document.createElement("div");

  message.className =
    "message " + role;


  const inner =
    document.createElement("div");

  inner.className =
    "message-inner";


  const avatar =
    document.createElement("div");

  avatar.className="avatar";

  avatar.textContent =
    role==="user"
    ? "U"
    : "A";


  const content =
    document.createElement("div");

  content.className="content";


  const name =
    document.createElement("div");

  name.className="name";

  name.textContent =
    role==="user"
    ? "You"
    : "ARES AI";


  const textBox =
    document.createElement("div");

  textBox.className="text";

  textBox.innerHTML =
    formatText(text);


  content.appendChild(name);

  content.appendChild(textBox);


  /* ACTIONS ONLY FOR ARES */

  if(role==="assistant"){

    const actions =
      document.createElement("div");

    actions.className="actions";


    actions.innerHTML=`

      <button
        onclick="copyMessage(this)"
        title="Copy">
        ⧉
      </button>

      <button
        onclick="likeMessage(this)"
        title="Like">
        ♡
      </button>

      <button
        onclick="dislikeMessage(this)"
        title="Dislike">
        👎
      </button>

      <button
        onclick="readMessage(this)"
        title="Read aloud">
        🔊
      </button>

      <button
        onclick="shareMessage(this)"
        title="Share">
        ↗
      </button>

    `;


    content.appendChild(actions);

  }


  inner.appendChild(avatar);

  inner.appendChild(content);

  message.appendChild(inner);

  messages.appendChild(message);


  messages.scrollTop =
    messages.scrollHeight;

}


/* =========================
   FORMAT
========================= */

function formatText(text){

  let safe =
    text
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");


  safe =
    safe.replace(
      /```([\s\S]*?)```/g,
      function(_,code){

        return `

        <div class="code">

          <div class="code-top">

            <span>CODE</span>

            <button
              onclick="copyCode(this)">
              Copy
            </button>

          </div>

          <pre>${code.trim()}</pre>

        </div>

        `;

      }
    );


  return safe;

}


/* =========================
   COPY
========================= */

async function copyMessage(button){

  const text =
    button
    .closest(".content")
    .querySelector(".text")
    .innerText;


  try{

    await navigator.clipboard.writeText(text);

    button.textContent="✓";

    setTimeout(
      ()=>button.textContent="⧉",
      1000
    );

  }catch{

    alert("Copy permission unavailable.");

  }

}


async function copyCode(button){

  const code =
    button
    .closest(".code")
    .querySelector("pre")
    .innerText;


  try{

    await navigator.clipboard.writeText(code);

    button.textContent="Copied";

    setTimeout(
      ()=>button.textContent="Copy",
      1000
    );

  }catch{

    alert("Copy failed.");

  }

}


/* =========================
   LIKE / DISLIKE
========================= */

function likeMessage(button){

  button.style.color =
    "#19d3a2";

}


function dislikeMessage(button){

  button.style.color =
    "#ff7777";

}


/* =========================
   READ ALOUD
========================= */

function readMessage(button){

  const text =
    button
    .closest(".content")
    .querySelector(".text")
    .innerText;


  if(!("speechSynthesis" in window)){

    alert(
      "Text-to-speech is not supported."
    );

    return;

  }


  speechSynthesis.cancel();


  const speech =
    new SpeechSynthesisUtterance(text);


  speech.rate=1;

  speech.pitch=1;


  speechSynthesis.speak(speech);

}


/* =========================
   SHARE
========================= */

async function shareMessage(button){

  const text =
    button
    .closest(".content")
    .querySelector(".text")
    .innerText;


  if(navigator.share){

    try{

      await navigator.share({

        title:"ARES AI",

        text:text,

        url:location.href

      });

    }catch(e){

      /* User cancelled */

    }

  }else{

    try{

      await navigator.clipboard.writeText(text);

      alert(
        "Sharing unavailable. Answer copied."
      );

    }catch{

      alert(
        "Sharing is not supported here."
      );

    }

  }

}


/* =========================
   NEW CHAT
========================= */

function newChat(){

  if(currentChat.length){

    savedChats.push(
      [...currentChat]
    );

    updateHistory();

  }


  currentChat=[];

  messages.innerHTML="";

  showWelcome();

}


/* =========================
   HISTORY
========================= */

function updateHistory(){

  history.innerHTML="";


  savedChats.forEach(
    function(chat,index){

      const item =
        document.createElement("div");


      item.className =
        "history-item";


      const firstUser =
        chat.find(
          m=>m.role==="user"
        );


      item.textContent =
        firstUser
        ? firstUser.text.substring(0,25)
        : "Chat " + (index+1);


      item.onclick=function(){

        currentChat =
          [...chat];


        messages.innerHTML="";


        chat.forEach(
          m=>{

            addMessage(
              m.role,
              m.text
            );

          }
        );

      };


      history.appendChild(item);

    }
  );

}


/* =========================
   VOICE INPUT
========================= */

function voice(){

  const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if(!Recognition){

    alert(
      "Voice input is not supported."
    );

    return;

  }


  const recognition =
    new Recognition();


  recognition.lang="en-IN";


  recognition.start();


  recognition.onresult =
    function(event){

      input.value =
        event.results[0][0]
        .transcript;

    };

}


/* =========================
   ARES RESPONSE ENGINE
========================= */

function getAnswer(question){

  const q =
    question.toLowerCase();


  /* HELLO */

  if(
    q==="hi" ||
    q==="hello" ||
    q.includes("hello")
  ){

    return `Hello! 👋

Main ARES AI hoon.

Tum apna question directly pooch sakte ho aur main available knowledge ke basis par answer dunga.

Cybersecurity learning, Linux, networking, HTTP, DNS aur programming jaise topics mein help kar sakta hoon.`;

  }


  /* DNS */

  if(q.includes("dns")){

    return `DNS ka full form Domain Name System hai.

DNS domain name ko IP address se resolve karta hai.

Basic example:

\`\`\`bash
nslookup example.com
\`\`\`

Aur:

\`\`\`bash
dig example.com
\`\`\`

Simple flow:

Domain → DNS Resolver → DNS Server → IP Address`;

  }


  /* LINUX */

  if(q.includes("linux")){

    return `Linux ke basic system/security commands:

\`\`\`bash
whoami
uname -a
pwd
ls -la
ip addr
ip route
ss -tulpn
ps aux
df -h
free -h
\`\`\`

Inhe apne device ya authorized lab mein system information samajhne ke liye use karo.`;

  }


  /* NETWORK */

  if(
    q.includes("network") ||
    q.includes("networking")
  ){

    return `Networking ke important basics:

1. IP Address
2. MAC Address
3. Subnet
4. Gateway
5. DNS
6. TCP
7. UDP
8. HTTP/HTTPS
9. Routing
10. Firewall

Basic diagnostic commands:

\`\`\`bash
ip addr
ip route
ping example.com
nslookup example.com
ss -tulpn
\`\`\``;

  }


  /* TCP */

  if(q.includes("tcp")){

    return `TCP connection establish karne ke liye three-way handshake use karta hai:

1. SYN
2. SYN-ACK
3. ACK

Iske baad TCP connection ke through data transfer hota hai.`;

  }


  /* HTTP */

  if(
    q.includes("http") ||
    q.includes("https")
  ){

    return `HTTP web communication protocol hai.

Common HTTP methods:

GET
POST
PUT
PATCH
DELETE

Example:

\`\`\`http
GET / HTTP/1.1
Host: example.com
\`\`\`

Request mein method, path, headers aur kabhi body hoti hai.`;

  }


  /* NMAP / SCANNING */

  if(
    q.includes("nmap") ||
    q.includes("port scan") ||
    q.includes("ports")
  ){

    return `Nmap network discovery aur port-analysis tool hai.

Main unauthorized systems ko scan karne ke instructions nahi dunga.

Agar tum apne authorized lab/device ka scan kar rahe ho, to scan ka output yahan paste karo. Main usmein:

• Open/closed ports
• Services
• Protocols
• Possible configuration issues

ko explain kar sakta hoon.

Basic local information ke liye:

\`\`\`bash
ip addr
ss -tulpn
\`\`\``;

  }


  /* PASSWORD */

  if(q.includes("password")){

    return `Strong password ke liye:

• Long passphrase use karo
• Har account ke liye unique password rakho
• 2FA/MFA enable karo
• Password share mat karo
• Password manager use kar sakte ho`;

  }


  /* DEFAULT */

  return `Samajh gaya.

Tumne poocha:

"${question}"

Is version mein main common cybersecurity, Linux, networking, HTTP, DNS aur programming concepts par built-in answers de sakta hoon.

Agar kisi authorized lab/security exercise ka output hai, woh yahan paste karo aur main uska meaning explain kar dunga.`;

}

</script>

</body>
</html>
