<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARES AI</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#0b0d10;
  color:#eee;
  font-family:Arial,system-ui,sans-serif;
  height:100vh;
}

.app{
  height:100vh;
  display:flex;
}

/* SIDEBAR */
.sidebar{
  width:250px;
  background:#111318;
  border-right:1px solid #292d33;
  display:flex;
  flex-direction:column;
}

.logo{
  padding:20px;
  font-size:20px;
  font-weight:bold;
  border-bottom:1px solid #292d33;
}

.logo span{
  color:#19d3a2;
}

.new{
  margin:15px;
  padding:12px;
  background:#191d22;
  color:white;
  border:1px solid #30353c;
  border-radius:8px;
  cursor:pointer;
}

.history{
  padding:10px;
  overflow:auto;
}

.history div{
  padding:10px;
  color:#aaa;
  border-radius:7px;
  cursor:pointer;
}

.history div:hover{
  background:#1b1f24;
  color:white;
}

/* MAIN */
.main{
  flex:1;
  display:flex;
  flex-direction:column;
  min-width:0;
}

.header{
  height:58px;
  border-bottom:1px solid #292d33;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
}

.online{
  color:#19d3a2;
  font-size:12px;
}

/* MESSAGES */
.messages{
  flex:1;
  overflow-y:auto;
  padding:25px 15px 130px;
}

.message{
  max-width:800px;
  margin:0 auto 25px;
  display:flex;
  gap:12px;
}

.avatar{
  min-width:32px;
  height:32px;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#19332d;
  color:#19d3a2;
  font-weight:bold;
}

.user .avatar{
  background:#30343a;
  color:white;
}

.content{
  flex:1;
  min-width:0;
}

.name{
  font-size:12px;
  color:#888;
  margin-bottom:7px;
}

.text{
  line-height:1.6;
  white-space:pre-wrap;
  word-wrap:break-word;
}

.user .text{
  background:#19352f;
  padding:10px 13px;
  border-radius:10px;
  display:inline-block;
}

/* CODE */
.code{
  margin:12px 0;
  background:#07090b;
  border:1px solid #30353b;
  border-radius:8px;
  overflow:hidden;
}

.codebar{
  padding:7px 10px;
  border-bottom:1px solid #30353b;
  color:#888;
  font-size:11px;
  display:flex;
  justify-content:space-between;
}

.codebar button{
  background:none;
  border:0;
  color:#19d3a2;
  cursor:pointer;
}

pre{
  margin:0;
  padding:14px;
  overflow:auto;
  color:#dffdf5;
}

/* ACTIONS */
.actions{
  display:flex;
  gap:5px;
  margin-top:8px;
}

.actions button{
  background:none;
  border:0;
  color:#777;
  cursor:pointer;
  padding:5px 7px;
}

.actions button:hover{
  color:white;
}

/* INPUT */
.bottom{
  position:fixed;
  bottom:0;
  left:250px;
  right:0;
  background:#0b0d10;
  padding:12px 15px 18px;
}

.inputbox{
  max-width:800px;
  margin:auto;
  display:flex;
  align-items:flex-end;
  background:#15191e;
  border:1px solid #353b42;
  border-radius:12px;
  padding:7px;
}

textarea{
  flex:1;
  min-height:42px;
  max-height:140px;
  resize:none;
  border:0;
  outline:0;
  background:none;
  color:white;
  padding:11px;
  font:inherit;
}

button{
  font:inherit;
}

.mic,.send{
  width:42px;
  height:42px;
  border:0;
  border-radius:9px;
  cursor:pointer;
}

.mic{
  background:none;
  color:#aaa;
}

.send{
  background:#19d3a2;
  color:#06110d;
  font-weight:bold;
}

.note{
  max-width:800px;
  margin:6px auto 0;
  text-align:center;
  color:#666;
  font-size:10px;
}

@media(max-width:700px){

  .sidebar{
    width:190px;
  }

  .bottom{
    left:190px;
  }

  .message{
    max-width:100%;
  }
}

@media(max-width:500px){

  .sidebar{
    display:none;
  }

  .bottom{
    left:0;
  }

  .messages{
    padding-left:10px;
    padding-right:10px;
  }
}
</style>
</head>

<body>

<div class="app">

  <aside class="sidebar">

    <div class="logo">
      <span>A</span>RES AI
    </div>

    <button class="new" onclick="newChat()">
      + New chat
    </button>

    <div class="history" id="history"></div>

  </aside>


  <main class="main">

    <header class="header">
      <b>ARES AI</b>
      <span class="online">● Online</span>
    </header>

    <section class="messages" id="messages"></section>

  </main>

</div>


<div class="bottom">

  <form class="inputbox" id="form">

    <textarea
      id="input"
      placeholder="Message ARES AI..."
    ></textarea>

    <button
      type="button"
      class="mic"
      onclick="voice()"
    >🎙</button>

    <button
      type="submit"
      class="send"
    >➤</button>

  </form>

  <div class="note">
    ARES AI can make mistakes. Verify important security information.
  </div>

</div>


<script>

let chats=[];
let current=[];

const messages=document.getElementById("messages");
const input=document.getElementById("input");
const form=document.getElementById("form");
const history=document.getElementById("history");


/* START */
function start(){

  if(current.length===0){

    addMessage(
      "assistant",
      "Hello! Main ARES AI hoon.\n\nTum mujhse cybersecurity, Linux, networking, web security, programming aur security concepts ke baare mein pooch sakte ho.\n\nExample:\n\n\"Explain DNS\"\n\"Linux security commands do\"\n\"What is an HTTP request?\""
    );

  }

}


/* SEND */
form.addEventListener("submit",function(e){

  e.preventDefault();

  const text=input.value.trim();

  if(!text)return;

  input.value="";

  addMessage("user",text);

  setTimeout(function(){

    const answer=getAnswer(text);

    addMessage("assistant",answer);

  },500);

});


/* ADD MESSAGE */
function addMessage(role,text){

  current.push({
    role:role,
    text:text
  });

  const box=document.createElement("div");

  box.className="message "+role;

  const avatar=document.createElement("div");

  avatar.className="avatar";

  avatar.textContent=
    role==="user" ? "U" : "A";

  const content=document.createElement("div");

  content.className="content";

  const name=document.createElement("div");

  name.className="name";

  name.textContent=
    role==="user" ? "You" : "ARES AI";

  const messageText=document.createElement("div");

  messageText.className="text";

  messageText.innerHTML=format(text);

  content.appendChild(name);
  content.appendChild(messageText);


  if(role==="assistant"){

    const actions=document.createElement("div");

    actions.className="actions";

    actions.innerHTML=`
      <button onclick="copyAnswer(this)">⧉</button>
      <button onclick="like(this)">♡</button>
      <button onclick="speak(this)">🔊</button>
      <button onclick="share(this)">↗</button>
    `;

    content.appendChild(actions);

  }


  box.appendChild(avatar);
  box.appendChild(content);

  messages.appendChild(box);

  messages.scrollTop=messages.scrollHeight;

}


/* FORMAT TEXT + CODE */
function format(text){

  let safe=text
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");

  safe=safe.replace(
    /```([\s\S]*?)```/g,
    function(match,code){

      return `
      <div class="code">

        <div class="codebar">
          <span>COMMAND</span>
          <button onclick="copyCode(this)">
            Copy
          </button>
        </div>

        <pre>${code.trim()}</pre>

      </div>
      `;

    }
  );

  return safe;

}


/* COPY ANSWER */
function copyAnswer(button){

  const text=
    button
    .closest(".content")
    .querySelector(".text")
    .innerText;

  navigator.clipboard.writeText(text);

}


/* COPY CODE */
function copyCode(button){

  const code=
    button
    .closest(".code")
    .querySelector("pre")
    .innerText;

  navigator.clipboard.writeText(code);

  button.innerText="Copied";

  setTimeout(()=>{
    button.innerText="Copy";
  },1000);

}


/* LIKE */
function like(button){

  button.style.color=
    button.style.color==="rgb(25, 211, 162)"
    ? "#777"
    : "#19d3a2";

}


/* SPEAK */
function speak(button){

  const text=
    button
    .closest(".content")
    .querySelector(".text")
    .innerText;

  speechSynthesis.cancel();

  const speech=
    new SpeechSynthesisUtterance(text);

  speech.rate=1;

  speechSynthesis.speak(speech);

}


/* SHARE */
async function share(button){

  const text=
    button
    .closest(".content")
    .querySelector(".text")
    .innerText;

  if(navigator.share){

    await navigator.share({
      title:"ARES AI",
      text:text
    });

  }else{

    navigator.clipboard.writeText(text);

    alert("Answer copied.");

  }

}


/* NEW CHAT */
function newChat(){

  if(current.length>0){

    chats.push([...current]);

  }

  current=[];

  messages.innerHTML="";

  start();

  updateHistory();

}


/* HISTORY */
function updateHistory(){

  history.innerHTML="";

  chats.forEach((chat,i)=>{

    const item=document.createElement("div");

    item.textContent=
      "Chat "+(i+1);

    item.onclick=function(){

      current=chat;

      messages.innerHTML="";

      current.forEach(msg=>{
        addMessage(msg.role,msg.text);
      });

    };

    history.appendChild(item);

  });

}


/* VOICE */
function voice(){

  const SpeechRecognition=
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SpeechRecognition){

    alert("Voice input is not supported.");

    return;

  }

  const recognition=
    new SpeechRecognition();

  recognition.lang="en-IN";

  recognition.start();

  recognition.onresult=function(event){

    input.value=
      event.results[0][0].transcript;

  };

}


/* BASIC AI ANSWERS */
function getAnswer(question){

  const q=question.toLowerCase();


  /* HELLO */
  if(
    q==="hi" ||
    q==="hello" ||
    q.includes("hello")
  ){

    return `Hello! 👋

Main ARES AI hoon.

Tum mujhse cybersecurity, Linux, networking, web security aur programming ke questions pooch sakte ho.

Example:

"Explain DNS"
"Linux ke useful commands do"
"TCP handshake explain karo"
"HTTP kya hota hai?"`;

  }


  /* DNS */
  if(q.includes("dns")){

    return `DNS ka matlab Domain Name System hai.

Iska main kaam domain name ko IP address mein resolve karna hota hai.

Example:

\`\`\`bash
nslookup example.com
\`\`\`

Aur:

\`\`\`bash
dig example.com
\`\`\`

Simple flow:

Browser → DNS resolver → DNS server → IP address → Website`;

  }


  /* LINUX */
  if(
    q.includes("linux") ||
    q.includes("linux command")
  ){

    return `Linux ke kuch basic security/system commands:

\`\`\`bash
whoami
uname -a
pwd
ls -la
ip addr
ip route
ss -tulpn
ps aux
df -h
free -h
\`\`\`

Ye commands apne device ya authorized lab par system/network information samajhne ke liye useful hain.`;

  }


  /* NETWORK */
  if(
    q.includes("network") ||
    q.includes("networking")
  ){

    return `Networking learning ke basic topics:

1. IP address
2. MAC address
3. Subnet
4. Gateway
5. DNS
6. TCP
7. UDP
8. HTTP/HTTPS
9. Routing
10. Firewall

Useful commands:

\`\`\`bash
ip addr
ip route
ping example.com
ss -tulpn
nslookup example.com
\`\`\``;

  }


  /* HTTP */
  if(
    q.includes("http") ||
    q.includes("https")
  ){

    return `HTTP web communication ka protocol hai.

Common methods:

GET
POST
PUT
PATCH
DELETE

Example:

\`\`\`http
GET / HTTP/1.1
Host: example.com
\`\`\`

HTTP request mein method, URL/path, headers aur kabhi request body hoti hai.`;

  }


  /* TCP */
  if(q.includes("tcp")){

    return `TCP ek connection-oriented transport protocol hai.

Basic TCP connection mein commonly:

1. SYN
2. SYN-ACK
3. ACK

Is process ko TCP three-way handshake kehte hain.`;

  }


  /* IP */
  if(
    q.includes("ip address") ||
    q==="ip"
  ){

    return `IP address network par kisi device/interface ko identify karne ke liye use hota hai.

Local IP dekhne ke liye:

\`\`\`bash
ip addr
\`\`\`

Routing table dekhne ke liye:

\`\`\`bash
ip route
\`\`\``;

  }


  /* PASSWORD */
  if(q.includes("password")){

    return `Strong password ke liye:

• Long password/passphrase use karo
• Har account ke liye unique password
• Password manager use kar sakte ho
• 2FA/MFA enable karo
• Password kisi ke saath share mat karo`;

  }


  /* DEFAULT */
  return `Maine tumhara message receive kiya:

"${question}"

Is basic version mein common cybersecurity, Linux, networking aur programming questions ke built-in answers hain.

Agar tum chahte ho ki ARES AI **literally kisi bhi normal question ka dynamic answer** de, to next step mein humein is website ko ek real AI backend/API se connect karna hoga. API key ko directly HTML mein rakhna safe nahi hota.`;

}


start();

</script>

</body>
</html>
