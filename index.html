<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050306">
<title>ARES AI</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#040204;
  color:#f2f2f2;
  font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif;
}

button,textarea{
  font:inherit;
}

/* =========================================================
   BACKGROUND
========================================================= */

.background{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:
    radial-gradient(
      ellipse at 50% 28%,
      rgba(92,5,24,.30) 0%,
      rgba(42,3,14,.22) 35%,
      rgba(8,3,6,.92) 78%
    ),
    #050204;
}

/* Dark red base */

.redAtmosphere{
  position:absolute;
  inset:-15%;
  background:
    radial-gradient(
      ellipse at 48% 30%,
      rgba(135,7,35,.22),
      transparent 50%
    ),
    radial-gradient(
      ellipse at 75% 65%,
      rgba(82,4,25,.15),
      transparent 45%
    );
  pointer-events:none;
}

/* =========================================================
   MANY RED RECTANGLES
========================================================= */

.redGrid{
  position:absolute;
  inset:0;
  opacity:.92;

  background-image:
    linear-gradient(
      rgba(125,9,35,.20) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(125,9,35,.20) 1px,
      transparent 1px
    );

  background-size:
    42px 42px;

  pointer-events:none;
}

/* Individual red boxes */

.redBoxes{
  position:absolute;
  inset:0;
  pointer-events:none;
}

.redBox{
  position:absolute;

  border:1px solid rgba(151,13,43,.52);

  background:
    rgba(72,3,19,.08);

  box-shadow:
    inset 0 0 20px rgba(120,4,30,.035);
}

/* =========================================================
   BLUE DIGITAL RAIN CANVAS
========================================================= */

#digitalRain{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;

  opacity:.82;
}

/* Small dark overlay keeps everything readable */

.backgroundShade{
  position:absolute;
  inset:0;

  background:
    linear-gradient(
      90deg,
      rgba(0,0,0,.20),
      transparent 20%,
      transparent 80%,
      rgba(0,0,0,.20)
    ),
    linear-gradient(
      180deg,
      rgba(0,0,0,.06),
      rgba(0,0,0,.12)
    );

  pointer-events:none;
}

/* =========================================================
   APP
========================================================= */

.app{
  position:relative;
  z-index:5;

  width:100%;
  height:100%;

  display:flex;
}

/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{
  width:255px;
  height:100%;
  flex-shrink:0;

  padding:15px;

  background:
    rgba(4,3,5,.93);

  border-right:
    1px solid rgba(255,255,255,.055);

  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);

  display:flex;
  flex-direction:column;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;

  padding:
    2px 4px 17px;
}

.logo{
  width:38px;
  height:38px;

  display:grid;
  place-items:center;

  border-radius:11px;

  background:
    linear-gradient(
      145deg,
      #711029,
      #25050e
    );

  border:
    1px solid rgba(255,45,85,.20);

  color:#fff;
  font-size:17px;
  font-weight:900;

  box-shadow:
    0 8px 30px rgba(95,0,25,.18);
}

.brandName{
  font-size:15px;
  font-weight:800;
}

.brandSub{
  margin-top:2px;

  color:#646b6e;

  font-size:8px;
  letter-spacing:1.2px;
  text-transform:uppercase;
}

.newChat{
  width:100%;

  padding:11px;

  border-radius:9px;

  border:
    1px solid rgba(185,22,54,.30);

  background:
    rgba(113,7,29,.16);

  color:#eee;

  text-align:left;

  cursor:pointer;

  font-size:11px;
}

.newChat:hover{
  background:rgba(140,8,34,.24);
}

.historyTitle{
  margin:
    20px 5px 8px;

  color:#565d60;

  font-size:8px;
  letter-spacing:1.5px;
  text-transform:uppercase;
}

.history{
  flex:1;
  overflow-y:auto;
}

.historyItem{
  width:100%;

  display:block;

  padding:9px;

  margin-bottom:3px;

  border:
    1px solid transparent;

  border-radius:8px;

  background:transparent;

  color:#7d8589;

  text-align:left;

  font-size:10px;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;

  cursor:pointer;
}

.historyItem:hover{
  background:rgba(255,255,255,.025);
}

.historyItem.active{
  color:#fff;

  background:
    rgba(126,8,31,.20);

  border-color:
    rgba(192,24,57,.18);
}

.footer{
  padding:
    12px 4px 2px;

  color:#3f4649;

  font-size:8px;
}

/* =========================================================
   MAIN
========================================================= */

.main{
  position:relative;

  min-width:0;

  flex:1;

  height:100%;

  display:flex;
  flex-direction:column;
}

.topbar{
  height:60px;
  flex-shrink:0;

  display:flex;
  align-items:center;

  padding:0 18px;

  background:
    rgba(4,4,5,.67);

  border-bottom:
    1px solid rgba(255,255,255,.055);

  backdrop-filter:blur(17px);
  -webkit-backdrop-filter:blur(17px);
}

.mobileMenu{
  display:none;
}

.title{
  font-size:13px;
  font-weight:800;
}

.status{
  display:flex;
  align-items:center;
  gap:5px;

  margin-top:3px;

  color:#687174;

  font-size:8px;
}

.statusDot{
  width:5px;
  height:5px;

  border-radius:50%;

  background:#4bd99a;
}

/* =========================================================
   MESSAGES
========================================================= */

.messages{
  flex:1;

  overflow-y:auto;

  padding:
    35px
    max(18px,calc((100% - 920px)/2))
    160px;
}

.empty{
  min-height:100%;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  text-align:center;
}

.emptyLogo{
  width:64px;
  height:64px;

  display:grid;
  place-items:center;

  border-radius:18px;

  background:
    linear-gradient(
      145deg,
      #74112b,
      #1f050d
    );

  border:
    1px solid rgba(255,45,80,.20);

  font-size:22px;
  font-weight:900;
}

.empty h1{
  margin:
    17px 0 0;

  font-size:39px;

  letter-spacing:-1.8px;
}

.empty p{
  margin:
    8px 0 0;

  color:#6d7579;

  font-size:11px;
}

/* =========================================================
   MESSAGE
========================================================= */

.message{
  display:flex;
  gap:9px;

  max-width:920px;

  margin:
    0 auto 23px;

  animation:
    messageIn .18s ease;
}

@keyframes messageIn{
  from{
    opacity:0;
    transform:translateY(5px);
  }

  to{
    opacity:1;
    transform:none;
  }
}

.message.user{
  justify-content:flex-end;
}

.avatar{
  width:31px;
  height:31px;

  flex:0 0 31px;

  display:grid;
  place-items:center;

  border-radius:9px;

  background:
    rgba(117,8,30,.22);

  border:
    1px solid rgba(210,25,55,.16);

  font-size:8px;
  font-weight:900;
}

.message.user .avatar{
  order:2;

  background:
    rgba(255,255,255,.035);

  border-color:
    rgba(255,255,255,.06);
}

.body{
  max-width:
    min(790px,calc(100% - 40px));
}

.bubble{
  padding:
    13px 15px;

  border-radius:15px;

  line-height:1.7;

  font-size:13px;

  background:
    linear-gradient(
      135deg,
      rgba(12,17,21,.86),
      rgba(31,7,18,.80)
    );

  border:
    1px solid rgba(255,255,255,.075);

  box-shadow:
    inset 0 1px rgba(255,255,255,.035),
    0 15px 45px rgba(0,0,0,.28);

  backdrop-filter:blur(19px);
  -webkit-backdrop-filter:blur(19px);
}

.message.user .bubble{
  background:
    linear-gradient(
      135deg,
      rgba(103,7,30,.55),
      rgba(45,5,17,.82),
      rgba(9,9,12,.80)
    );

  border-color:
    rgba(220,30,65,.20);
}

/* =========================================================
   CODE BLOCK
========================================================= */

.codeCard{
  margin:13px 0;

  overflow:hidden;

  border-radius:13px;

  background:
    linear-gradient(
      135deg,
      rgba(4,22,35,.96),
      rgba(8,18,39,.94),
      rgba(8,32,35,.94)
    );

  border:
    1px solid rgba(48,153,226,.28);

  box-shadow:
    inset 0 1px rgba(255,255,255,.045),
    0 16px 45px rgba(0,0,0,.35);
}

.codeHead{
  height:35px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:
    0 10px;

  background:
    rgba(30,120,190,.07);

  border-bottom:
    1px solid rgba(75,170,235,.12);
}

.codeLang{
  color:#5ebeff;

  font-size:8px;
  font-weight:900;

  letter-spacing:1.1px;
  text-transform:uppercase;
}

.copy{
  padding:
    5px 9px;

  border-radius:6px;

  border:
    1px solid rgba(255,255,255,.09);

  background:
    rgba(255,255,255,.045);

  color:#b9c7cf;

  font-size:8px;

  cursor:pointer;
}

.copy:hover{
  background:
    rgba(55,145,220,.15);
}

pre.code{
  margin:0;

  padding:14px;

  overflow-x:auto;

  color:#d9efff;

  font-family:
    "JetBrains Mono",
    "SFMono-Regular",
    Consolas,
    monospace;

  font-size:11px;

  line-height:1.72;
}

.inline{
  padding:
    2px 5px;

  border-radius:5px;

  background:
    rgba(44,158,222,.09);

  color:#65c9ff;

  font-family:monospace;
}

/* =========================================================
   ACTIONS
========================================================= */

.actions{
  display:flex;
  gap:2px;

  margin-top:3px;

  opacity:.52;
}

.action{
  width:27px;
  height:27px;

  display:grid;
  place-items:center;

  border:0;

  border-radius:7px;

  background:transparent;

  color:#8a9397;

  cursor:pointer;
}

.action:hover{
  color:#fff;

  background:
    rgba(255,255,255,.055);
}

/* =========================================================
   COMPOSER
========================================================= */

.composerWrap{
  position:absolute;

  left:0;
  right:0;
  bottom:0;

  padding:
    13px
    max(18px,calc((100% - 920px)/2))
    13px;

  background:
    linear-gradient(
      180deg,
      transparent,
      rgba(3,3,4,.92) 30%,
      rgba(3,3,4,.99)
    );

  pointer-events:none;
}

.composer{
  pointer-events:auto;

  display:flex;
  align-items:flex-end;

  gap:7px;

  padding:7px;

  border-radius:16px;

  background:
    linear-gradient(
      135deg,
      rgba(18,8,13,.88),
      rgba(5,10,13,.90)
    );

  border:
    1px solid rgba(255,255,255,.085);

  box-shadow:
    inset 0 1px rgba(255,255,255,.04),
    0 18px 70px rgba(0,0,0,.5);

  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
}

#input{
  flex:1;

  min-width:0;

  min-height:40px;
  max-height:150px;

  resize:none;

  outline:none;
  border:0;

  background:transparent;

  color:#f2f3f3;

  padding:
    9px 7px;

  font-size:13px;
}

#input::placeholder{
  color:#626a6e;
}

.icon{
  width:39px;
  height:39px;

  flex:0 0 39px;

  display:grid;
  place-items:center;

  border-radius:11px;

  border:
    1px solid rgba(255,255,255,.07);

  background:
    rgba(255,255,255,.035);

  color:#aeb7ba;

  cursor:pointer;
}

.icon:hover{
  background:
    rgba(255,255,255,.07);
}

.send{
  color:white;

  background:
    linear-gradient(
      145deg,
      #861531,
      #420817
    );
}

.mic.listening{
  color:#5ce6a7;

  border-color:
    rgba(70,225,150,.25);
}

.hint{
  margin-top:6px;

  text-align:center;

  color:#41494c;

  font-size:8px;
}

/* =========================================================
   SPEECH BAR
========================================================= */

.speech{
  position:absolute;

  z-index:50;

  right:15px;
  top:70px;

  width:
    min(350px,calc(100% - 30px));

  display:none;

  align-items:center;

  gap:8px;

  padding:8px;

  border-radius:12px;

  background:
    rgba(5,7,9,.92);

  border:
    1px solid rgba(255,255,255,.08);

  backdrop-filter:blur(18px);
}

.speech.show{
  display:flex;
}

.speakerIcon{
  width:30px;
  height:30px;

  display:grid;
  place-items:center;

  border-radius:8px;

  color:#68bfff;

  background:
    rgba(40,130,210,.09);
}

.speechInfo{
  flex:1;
}

.speechTitle{
  font-size:9px;
  font-weight:800;
}

.speechLine{
  height:3px;

  margin-top:6px;

  overflow:hidden;

  border-radius:10px;

  background:
    rgba(255,255,255,.07);
}

.progress{
  width:0;
  height:100%;

  background:
    linear-gradient(
      90deg,
      #286cff,
      #42bfff,
      #57d9ff
    );
}

.speechBtn{
  width:27px;
  height:27px;

  border:0;

  border-radius:7px;

  background:
    rgba(255,255,255,.05);

  color:#aeb6b9;

  cursor:pointer;
}

/* =========================================================
   MOBILE
========================================================= */

.overlay{
  display:none;
}

@media(max-width:800px){

  .sidebar{
    position:fixed;

    z-index:100;

    left:0;
    top:0;
    bottom:0;

    transform:
      translateX(-105%);

    transition:
      transform .25s ease;

    box-shadow:
      25px 0 70px rgba(0,0,0,.6);
  }

  .sidebar.open{
    transform:
      translateX(0);
  }

  .overlay.show{
    display:block;

    position:fixed;

    inset:0;

    z-index:90;

    background:
      rgba(0,0,0,.65);
  }

  .mobileMenu{
    display:grid;
    place-items:center;

    width:35px;
    height:35px;

    margin-right:8px;

    border:0;

    border-radius:8px;

    background:
      rgba(255,255,255,.04);

    color:white;
  }

  .messages{
    padding:
      23px
      10px
      155px;
  }

  .empty h1{
    font-size:31px;
  }

  .composerWrap{
    padding-left:8px;
    padding-right:8px;
  }

  .bubble{
    font-size:12.5px;
  }

  pre.code{
    font-size:10px;
  }

  .redGrid{
    background-size:
      34px 34px;
  }
}
</style>
</head>

<body>

<!-- ======================================================
     BACKGROUND
====================================================== -->

<div class="background">

  <div class="redAtmosphere"></div>

  <div class="redGrid"></div>

  <div
    class="redBoxes"
    id="redBoxes">
  </div>

  <canvas id="digitalRain"></canvas>

  <div class="backgroundShade"></div>

</div>


<!-- ======================================================
     APPLICATION
====================================================== -->

<div class="app">

  <div
    class="overlay"
    id="overlay">
  </div>


  <!-- SIDEBAR -->

  <aside
    class="sidebar"
    id="sidebar">

    <div class="brand">

      <div class="logo">
        A
      </div>

      <div>

        <div class="brandName">
          ARES AI
        </div>

        <div class="brandSub">
          Cyber Intelligence
        </div>

      </div>

    </div>


    <button
      class="newChat"
      id="newChat">

      ＋ New Chat

    </button>


    <div class="historyTitle">
      Chats
    </div>


    <div
      class="history"
      id="history">
    </div>


    <div class="footer">
      ARES AI · Local conversation history
    </div>

  </aside>


  <!-- MAIN -->

  <main class="main">


    <header class="topbar">

      <button
        class="mobileMenu"
        id="menuBtn">

        ☰

      </button>


      <div>

        <div
          class="title"
          id="chatTitle">

          New Conversation

        </div>


        <div class="status">

          <span
            class="statusDot">
          </span>

          ARES online

        </div>

      </div>

    </header>


    <!-- SPEECH -->

    <div
      class="speech"
      id="speech">

      <div class="speakerIcon">
        🔊
      </div>

      <div class="speechInfo">

        <div class="speechTitle">
          ARES is speaking
        </div>

        <div class="speechLine">

          <div
            class="progress"
            id="progress">
          </div>

        </div>

      </div>


      <button
        class="speechBtn"
        id="stopSpeech">

        ■

      </button>


      <button
        class="speechBtn"
        id="closeSpeech">

        ×

      </button>

    </div>


    <!-- MESSAGES -->

    <section
      class="messages"
      id="messages">
    </section>


    <!-- COMPOSER -->

    <div class="composerWrap">

      <div class="composer">

        <textarea
          id="input"
          rows="1"
          placeholder="Ask ARES anything..."
          spellcheck="false">
        </textarea>


        <button
          class="icon"
          id="micBtn"
          title="Voice input">

          🎙

        </button>


        <button
          class="icon send"
          id="sendBtn"
          title="Send">

          ➤

        </button>

      </div>


      <div class="hint">
        Enter to send · Shift + Enter for new line
      </div>

    </div>

  </main>

</div>


<script>

/* =========================================================
   API
========================================================= */

const API_URL =
  "https://ares-cyber-intelligence.vercel.app/api/chat";


/* =========================================================
   STORAGE
========================================================= */

const CHAT_KEY =
  "ares_chats_v8";

const ACTIVE_KEY =
  "ares_active_chat_v8";


let chats =
  JSON.parse(
    localStorage.getItem(CHAT_KEY) || "[]"
  );

let activeChatId =
  localStorage.getItem(ACTIVE_KEY);


/* =========================================================
   ELEMENTS
========================================================= */

const messages =
  document.getElementById("messages");

const history =
  document.getElementById("history");

const input =
  document.getElementById("input");

const sendBtn =
  document.getElementById("sendBtn");

const newChat =
  document.getElementById("newChat");

const chatTitle =
  document.getElementById("chatTitle");

const sidebar =
  document.getElementById("sidebar");

const overlay =
  document.getElementById("overlay");

const menuBtn =
  document.getElementById("menuBtn");

const micBtn =
  document.getElementById("micBtn");

const speech =
  document.getElementById("speech");

const progress =
  document.getElementById("progress");


/* =========================================================
   CHAT STORAGE
========================================================= */

function save(){

  localStorage.setItem(
    CHAT_KEY,
    JSON.stringify(chats)
  );

  if(activeChatId){

    localStorage.setItem(
      ACTIVE_KEY,
      activeChatId
    );

  }

}


function currentChat(){

  return chats.find(
    c => c.id === activeChatId
  );

}


/* =========================================================
   NEW CHAT
========================================================= */

function createChat(){

  const chat = {

    id:
      Date.now().toString(36) +
      Math.random()
        .toString(36)
        .slice(2),

    title:
      "New Conversation",

    messages:[],

    createdAt:
      Date.now(),

    updatedAt:
      Date.now()

  };


  chats.unshift(chat);

  activeChatId =
    chat.id;

  save();

  renderHistory();

  renderChat();

}


/* =========================================================
   HISTORY
========================================================= */

function renderHistory(){

  history.innerHTML = "";

  chats.forEach(chat => {

    const button =
      document.createElement("button");

    button.className =
      "historyItem" +
      (
        chat.id === activeChatId
          ? " active"
          : ""
      );

    button.textContent =
      chat.title;

    button.onclick = () => {

      activeChatId =
        chat.id;

      save();

      renderHistory();

      renderChat();

      sidebar.classList.remove("open");

      overlay.classList.remove("show");

    };

    history.appendChild(button);

  });

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(value){

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   TEXT / CODE RENDERER
========================================================= */

function renderText(text){

  const lines =
    String(text || "")
      .split("\n");

  let html = "";

  let insideCode = false;

  let language = "code";

  let codeLines = [];


  function closeCode(){

    const raw =
      codeLines.join("\n");

    const id =
      "code_" +
      Math.random()
        .toString(36)
        .slice(2);


    html += `

      <div class="codeCard">

        <div class="codeHead">

          <span class="codeLang">
            ${escapeHTML(language)}
          </span>

          <button
            class="copy"
            data-code="${id}">

            Copy

          </button>

        </div>


        <pre
          class="code"
          id="${id}">${escapeHTML(raw)}</pre>

      </div>

    `;


    codeLines = [];

  }


  for(const line of lines){

    if(
      line.trim()
        .startsWith("```")
    ){

      if(!insideCode){

        insideCode = true;

        language =
          line
            .trim()
            .slice(3)
            .trim() ||
          "code";

      }else{

        insideCode = false;

        closeCode();

      }

      continue;

    }


    if(insideCode){

      codeLines.push(line);

      continue;

    }


    if(!line.trim()){

      html +=
        "<div style='height:5px'></div>";

      continue;

    }


    let safe =
      escapeHTML(line);


    safe =
      safe.replace(
        /`([^`]+)`/g,
        '<code class="inline">$1</code>'
      );


    safe =
      safe.replace(
        /\*\*([^*]+)\*\*/g,
        "<strong>$1</strong>"
      );


    html +=
      `<div>${safe}</div>`;

  }


  if(insideCode){

    closeCode();

  }


  return html;

}

function renderChat(){

  chatTitle.textContent =
    chat.title;


  if(!chat.messages.length){

/* =========================================================
   ADD MESSAGE
========================================================= */

function addMessage(message,index){

  const row =
    document.createElement("div");

  row.className =
    "message " +
    message.role;


  const avatar =
    document.createElement("div");

  avatar.className =
    "avatar";

  avatar.textContent =
    message.role === "user"
      ? "YOU"
      : "A";


  const body =
    document.createElement("div");

  body.className =
    "body";


  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";

  bubble.innerHTML =
    renderText(
      message.content
    );


  body.appendChild(
    bubble
  );


  const actions =
    document.createElement("div");

  actions.className =
    "actions";


  const copy =
    document.createElement("button");

  copy.className =
    "action";

  copy.textContent =
    "⧉";

  copy.title =
    "Copy";


  copy.onclick = async () => {

    try{

      await navigator.clipboard
        .writeText(
          message.content
        );

    }catch{}

  };


  actions.appendChild(copy);


  if(
    message.role ===
    "assistant"
  ){

    const speakButton =
      document.createElement("button");

    speakButton.className =
      "action";

    speakButton.textContent =
      "🔊";

    speakButton.title =
      "Speak";


    speakButton.onclick =
      () =>
        speak(
          message.content
        );


    actions.appendChild(
      speakButton
    );

  }


  if(
    message.role === "user"
  ){

    const edit =
      document.createElement("button");

    edit.className =
      "action";

    edit.textContent =
      "✎";

    edit.title =
      "Edit";


    edit.onclick = () => {

      const chat =
        currentChat();

      input.value =
        message.content;

      chat.messages =
        chat.messages
          .slice(0,index);

      chat.updatedAt =
        Date.now();

      save();

      renderChat();

      input.focus();

      resizeInput();

    };


    actions.appendChild(
      edit
    );

  }


  body
    .querySelectorAll(".copy")
    .forEach(button => {

      button.onclick =
        async () => {

          const target =
            document.getElementById(
              button.dataset.code
            );

          if(!target)
            return;


          try{

            await navigator
              .clipboard
              .writeText(
                target.textContent
              );


            button.textContent =
              "Copied";


            setTimeout(
              () =>
                button.textContent =
                  "Copy",
              900
            );

          }catch{}

        };

    });


  body.appendChild(
    actions
  );


  row.appendChild(
    avatar
  );

  row.appendChild(
    body
  );


  messages.appendChild(
    row
  );

}


/* =========================================================
   SEND
========================================================= */

async function send(){

  const text =
    input.value.trim();


  if(!text)
    return;


  let chat =
    currentChat();


  if(!chat){

    createChat();

    chat =
      currentChat();

  }


  if(!chat)
    return;


  if(
    !chat.messages.length
  ){

    chat.title =
      text.length > 45
        ? text.slice(0,45) + "..."
        : text;

  }


  chat.messages.push({

    role:"user",

    content:text,

    timestamp:
      Date.now()

  });


  chat.updatedAt =
    Date.now();


  input.value = "";

  resizeInput();

  save();

  renderHistory();

  renderChat();


  const loading =
    document.createElement("div");

  loading.className =
    "message assistant";


  loading.innerHTML = `

    <div class="avatar">
      A
    </div>

    <div class="body">

      <div class="bubble">

        <span style="
          color:#48bfff;
          letter-spacing:5px;
        ">
          • • •
        </span>

      </div>

    </div>

  `;


  messages.appendChild(
    loading
  );

  scrollBottom();


  try{

    const previous =
      chat.messages
        .slice(-13,-1)
        .map(m => ({
          role:m.role,
          content:m.content
        }));


    const response =
      await fetch(
        API_URL,
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              message:text,

              history:previous

            })

        }
      );


    const data =
      await response
        .json()
        .catch(
          () => ({})
        );


    loading.remove();


    if(!response.ok){

      throw new Error(
        data.error ||
        "Backend connection failed"
      );

    }


    chat.messages.push({

      role:"assistant",

      content:
        data.reply ||
        "ARES returned no response.",

      timestamp:
        Date.now()

    });


    chat.updatedAt =
      Date.now();


    save();

    renderHistory();

    renderChat();


  }catch(error){

    loading.remove();


    chat.messages.push({

      role:"assistant",

      content:
        "⚠️ **ARES backend connection failed**\n\n" +
        error.message,

      timestamp:
        Date.now()

    });


    save();

    renderChat();

  }

}

/* =========================================================
   TEXT TO SPEECH
========================================================= */

let speechTimer = null;


function speak(text){

  if(
    !("speechSynthesis" in window)
  )
    return;


  speechSynthesis.cancel();

  clearInterval(
    speechTimer
  );


  const clean =
    String(text)
      .replace(
        /```[\s\S]*?```/g,
        " code "
      )
      .replace(
        /`([^`]+)`/g,
        "$1"
      )
      .replace(
        /[*_#]/g,
        ""
      )
      .replace(
        /\s+/g,
        " "
      )
      .trim();


  const utter =
    new SpeechSynthesisUtterance(
      clean
    );


  utter.rate =
    .98;

  utter.pitch =
    1;


  speech.classList.add(
    "show"
  );


  progress.style.width =
    "0%";


  const duration =
    Math.max(
      2500,
      clean.length * 40
    );


  const start =
    Date.now();


  speechTimer =
    setInterval(
      () => {

        const percent =
          Math.min(
            100,
            (
              (Date.now()-start) /
              duration
            ) * 100
          );


        progress.style.width =
          percent + "%";

      },
      100
    );


  utter.onend =
    () => {

      clearInterval(
        speechTimer
      );

      progress.style.width =
        "100%";

      setTimeout(
        () =>
          speech.classList.remove(
            "show"
          ),
        250
      );

    };


  utter.onerror =
    () => {

      clearInterval(
        speechTimer
      );

      speech.classList.remove(
        "show"
      );

    };


  speechSynthesis.speak(
    utter
  );

}


document.getElementById(
  "stopSpeech"
).onclick = () => {

  speechSynthesis.cancel();

  clearInterval(
    speechTimer
  );

  speech.classList.remove(
    "show"
  );

};


document.getElementById(
  "closeSpeech"
).onclick = () => {

  speech.classList.remove(
    "show"
  );

};


/* =========================================================
   VOICE INPUT
========================================================= */

const Recognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if(Recognition){

  const recognition =
    new Recognition();


  recognition.lang =
    "en-US";

  recognition.continuous =
    false;

  recognition.interimResults =
    true;


  let listening =
    false;


  recognition.onstart =
    () => {

      listening =
        true;

      micBtn.classList.add(
        "listening"
      );

    };


  recognition.onresult =
    event => {

      let result = "";


      for(
        let i =
          event.resultIndex;

        i <
          event.results.length;

        i++
      ){

        result +=
          event.results[i][0]
            .transcript;

      }


      input.value =
        result;

      resizeInput();

    };


  recognition.onend =
    () => {

      listening =
        false;

      micBtn.classList.remove(
        "listening"
      );

    };


  recognition.onerror =
    () => {

      listening =
        false;

      micBtn.classList.remove(
        "listening"
      );

    };


  micBtn.onclick =
    () => {

      if(listening){

        recognition.stop();

      }else{

        try{
          recognition.start();
        }catch{}

      }

    };

}

/* =========================================================
   DENSE BLUE DIGITAL RAIN
========================================================= */

const canvas =
  document.getElementById(
    "digitalRain"
  );

const ctx =
  canvas.getContext(
    "2d"
  );


let W=0;
let H=0;
let DPR=1;

let streams=[];


/*
  Reference-video style characters.
  Mostly digital-looking symbols,
  not bright green Matrix rain.
*/

const rainCharacters =
  "010101010101ABCDEFGHIJKLMNOPQRSTUVWXYZabcdef0123456789<>[]{}:/\\|+-_=.";


/* =========================================================
   RESIZE
========================================================= */

function resizeRain(){

  W =
    window.innerWidth;

  H =
    window.innerHeight;


  DPR =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );


  canvas.width =
    W * DPR;

  canvas.height =
    H * DPR;


  canvas.style.width =
    W + "px";

  canvas.style.height =
    H + "px";


  ctx.setTransform(
    DPR,
    0,
    0,
    DPR,
    0,
    0
  );


  /*
    Dense streams.
    More columns than previous version.
  */

  const fontSize =
    window.innerWidth < 800
      ? 10
      : 12;


  const columnGap =
    window.innerWidth < 800
      ? 9
      : 11;


  const count =
    Math.ceil(
      W / columnGap
    );


  streams = [];


  for(
    let i=0;
    i<count;
    i++
  ){

    /*
      Not every column starts together.
      This creates natural continuous rain.
    */

    const length =
      15 +
      Math.floor(
        Math.random()*35
      );


    const chars=[];


    for(
      let j=0;
      j<length;
      j++
    ){

      chars.push(
        rainCharacters[
          Math.floor(
            Math.random() *
            rainCharacters.length
          )
        ]
      );

    }


    streams.push({

      x:
        i * columnGap,

      y:
        Math.random() *
        -H,

      speed:
        1.1 +
        Math.random()*2.4,

      size:
        fontSize +
        Math.random()*2.5,

      length,

      chars,

      gap:
        .82 +
        Math.random()*.18,

      brightness:
        .55 +
        Math.random()*.35

    });

  }

}


/* =========================================================
   DRAW BLUE RAIN
========================================================= */

function drawRain(){

  /*
    Very light fade.
    This makes long continuous trails
    instead of blinking dots.
  */

  ctx.fillStyle =
    "rgba(1,3,7,.17)";

  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  ctx.textAlign =
    "center";

  ctx.textBaseline =
    "top";


  for(
    const stream
    of streams
  ){

    /*
      Draw from tail to head.
    */

    for(
      let i =
        stream.length - 1;

      i >= 0;

      i--
    ){

      const y =
        stream.y +
        i *
        stream.size *
        stream.gap;


      if(
        y < -25 ||
        y > H + 25
      )
        continue;


      /*
        Head = bright.
        Tail = darker.
      */

      const position =
        i / stream.length;


      let alpha =
        stream.brightness *
        (
          1 -
          position*.72
        );


      if(i===0){

        alpha =
          Math.min(
            1,
            stream.brightness + .28
          );

      }


      ctx.font =
        `${Math.round(stream.size)}px ` +
        `"JetBrains Mono",Consolas,monospace`;


      /*
        BLUE ONLY.
        No green.
        No glow explosion.
      */

      if(i===0){

        ctx.fillStyle =
          `rgba(
            105,
            202,
            255,
            ${alpha}
          )`;

      }else{

        ctx.fillStyle =
          `rgba(
            34,
            121,
            220,
            ${alpha}
          )`;

      }


      /*
        Fixed characters per stream
        instead of changing every frame.
      */

      ctx.fillText(
        stream.chars[i],
        stream.x,
        y
      );

    }


    stream.y +=
      stream.speed;


    /*
      Once the complete stream
      has passed below screen,
      restart it from above.
    */

    const totalHeight =
      stream.length *
      stream.size *
      stream.gap;


    if(
      stream.y >
      H + totalHeight
    ){

      stream.y =
        -(
          Math.random() *
          H *
          .65
        );


      stream.speed =
        1.1 +
        Math.random()*2.4;


      /*
        New digital sequence.
      */

      for(
        let j=0;
        j<stream.length;
        j++
      ){

        stream.chars[j] =
          rainCharacters[
            Math.floor(
              Math.random() *
              rainCharacters.length
            )
          ];

      }

    }

  }


  requestAnimationFrame(
    drawRain
  );

}


window.addEventListener(
  "resize",
  resizeRain
);


resizeRain();

drawRain();
