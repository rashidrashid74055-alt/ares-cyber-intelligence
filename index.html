<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ARES AI</title>

<style>
*{box-sizing:border-box}

:root{
  --red:#ff3347;
  --red2:#ff6170;
  --bg:#070305;
  --glass:rgba(18,7,10,.62);
  --border:rgba(255,70,85,.20);
  --text:#f5f5f7;
  --muted:#85858b;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,Arial,system-ui,sans-serif;
}

body{
  overflow:hidden;
}

/* ================= LIQUID BACKGROUND ================= */

body::before{
  content:"";
  position:fixed;
  inset:-25%;
  z-index:-3;
  background:
    radial-gradient(circle at 20% 20%,rgba(255,30,55,.20),transparent 23%),
    radial-gradient(circle at 80% 25%,rgba(180,10,35,.18),transparent 25%),
    radial-gradient(circle at 50% 80%,rgba(255,0,35,.13),transparent 28%),
    linear-gradient(rgba(255,45,65,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,45,65,.035) 1px,transparent 1px);
  background-size:auto,auto,auto,34px 34px,34px 34px;
  filter:blur(0);
  animation:liquidMove 18s ease-in-out infinite alternate;
}

body::after{
  content:"";
  position:fixed;
  inset:-30%;
  z-index:-2;
  pointer-events:none;
  background:
    radial-gradient(ellipse at 30% 35%,rgba(255,40,60,.12),transparent 28%),
    radial-gradient(ellipse at 70% 65%,rgba(255,0,40,.10),transparent 30%);
  filter:blur(45px);
  animation:liquidFloat 14s ease-in-out infinite alternate;
}

@keyframes liquidMove{
  0%{transform:translate3d(-2%,-1%,0) scale(1)}
  50%{transform:translate3d(2%,2%,0) scale(1.04)}
  100%{transform:translate3d(-1%,3%,0) scale(1.08)}
}

@keyframes liquidFloat{
  from{transform:translate(-4%,-2%) rotate(0deg)}
  to{transform:translate(5%,4%) rotate(7deg)}
}

/* ================= APP ================= */

.app{
  width:100%;
  height:100dvh;
  display:flex;
}

/* ================= SIDEBAR ================= */

.sidebar{
  width:250px;
  height:100%;
  flex-shrink:0;
  display:flex;
  flex-direction:column;
  background:rgba(8,4,6,.72);
  backdrop-filter:blur(28px) saturate(150%);
  -webkit-backdrop-filter:blur(28px) saturate(150%);
  border-right:1px solid var(--border);
  z-index:50;
}

.logo{
  height:60px;
  display:flex;
  align-items:center;
  padding:0 18px;
  border-bottom:1px solid rgba(255,50,60,.12);
  font-size:18px;
  font-weight:800;
  letter-spacing:.5px;
}

.logo span{
  color:var(--red);
  text-shadow:0 0 18px rgba(255,40,60,.75);
}

.logo-dot{
  width:7px;
  height:7px;
  margin-left:8px;
  border-radius:50%;
  background:#ff3045;
  box-shadow:0 0 13px #ff3045;
}

.newchat{
  margin:13px;
  padding:12px;
  border-radius:12px;
  border:1px solid rgba(255,65,80,.25);
  background:linear-gradient(
    135deg,
    rgba(255,35,55,.14),
    rgba(40,5,10,.45)
  );
  color:white;
  cursor:pointer;
  font-size:13px;
  transition:.2s;
}

.newchat:hover{
  transform:translateY(-1px);
  border-color:rgba(255,70,85,.5);
  background:rgba(110,15,28,.35);
}

.history-title{
  padding:5px 15px 9px;
  color:#666;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:1px;
}

.history{
  padding:0 8px;
  overflow-y:auto;
  flex:1;
}

.history-item{
  display:flex;
  align-items:center;
  gap:7px;
  padding:10px;
  margin-bottom:3px;
  color:#929298;
  border-radius:9px;
  cursor:pointer;
  font-size:12px;
  transition:.18s;
}

.history-item:hover,
.history-item.active{
  color:white;
  background:linear-gradient(
    90deg,
    rgba(255,40,55,.13),
    rgba(255,40,55,.04)
  );
}

.history-dot{
  width:5px;
  height:5px;
  min-width:5px;
  border-radius:50%;
  background:#703039;
}

.history-item.active .history-dot{
  background:var(--red);
  box-shadow:0 0 8px var(--red);
}

.sidebar-footer{
  padding:12px;
  border-top:1px solid rgba(255,50,60,.10);
  text-align:center;
  color:#505057;
  font-size:10px;
}

/* ================= MAIN ================= */

.main{
  min-width:0;
  flex:1;
  height:100%;
  display:flex;
  flex-direction:column;
}

.header{
  height:60px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 17px;
  background:rgba(8,4,6,.54);
  backdrop-filter:blur(24px);
  border-bottom:1px solid rgba(255,50,60,.13);
  z-index:20;
}

.header-left{
  display:flex;
  align-items:center;
  gap:10px;
}

.menu-btn{
  display:none;
  width:38px;
  height:38px;
  border:1px solid rgba(255,70,80,.18);
  border-radius:10px;
  background:rgba(255,30,45,.06);
  color:white;
  cursor:pointer;
  font-size:20px;
}

.header-title{
  font-weight:700;
  font-size:14px;
}

.header-status{
  display:flex;
  align-items:center;
  gap:6px;
  color:#ff5665;
  font-size:10px;
}

.status-dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#ff3045;
  box-shadow:0 0 10px #ff3045;
}

/* ================= MESSAGES ================= */

.messages{
  flex:1;
  overflow-y:auto;
  padding:30px 20px 165px;
  scroll-behavior:smooth;
}

.message{
  width:100%;
  display:flex;
  margin-bottom:30px;
}

.message-inner{
  width:100%;
  max-width:900px;
  display:flex;
  gap:11px;
}

.assistant{justify-content:flex-start}
.user{justify-content:flex-end}

.user .message-inner{
  flex-direction:row-reverse;
  max-width:820px;
}

.avatar{
  width:34px;
  height:34px;
  min-width:34px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:10px;
  font-size:11px;
  font-weight:800;
}

.assistant .avatar{
  color:#ff5362;
  background:linear-gradient(145deg,#481019,#15070a);
  border:1px solid rgba(255,55,70,.28);
  box-shadow:0 0 18px rgba(255,25,40,.08);
}

.user .avatar{
  color:#fff;
  background:#303036;
}

.content{
  min-width:0;
  max-width:780px;
  width:100%;
}

.name{
  margin-bottom:6px;
  color:#66666d;
  font-size:10px;
}

.text{
  font-size:14px;
  line-height:1.7;
  word-break:break-word;
}

.user .text{
  display:inline-block;
  width:auto;
  max-width:100%;
  padding:11px 14px;
  border-radius:14px;
  background:linear-gradient(
    135deg,
    rgba(105,18,30,.70),
    rgba(45,8,14,.65)
  );
  border:1px solid rgba(255,55,70,.17);
  backdrop-filter:blur(18px);
}

/* ================= MARKDOWN ================= */

.rich p{
  margin:0 0 13px;
}

.rich p:last-child{
  margin-bottom:0;
}

.rich strong{
  color:#fff;
  font-weight:700;
}

.inline-code{
  padding:2px 6px;
  border-radius:6px;
  background:rgba(255,40,55,.10);
  border:1px solid rgba(255,60,75,.13);
  color:#ff8791;
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-size:.92em;
}

.code-card{
  margin:14px 0;
  overflow:hidden;
  border-radius:14px;
  border:1px solid rgba(255,65,80,.22);
  background:
    linear-gradient(
      135deg,
      rgba(45,8,13,.75),
      rgba(13,5,8,.82)
    );
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.035),
    0 10px 35px rgba(0,0,0,.20);
  backdrop-filter:blur(22px);
}

.code-head{
  height:38px;
  padding:0 10px 0 13px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid rgba(255,60,70,.13);
  background:rgba(255,30,45,.045);
}

.code-lang{
  color:#8c8c93;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:1px;
}

.copy-code{
  border:1px solid rgba(255,65,80,.18);
  background:rgba(255,40,55,.07);
  color:#bdbdc3;
  padding:6px 9px;
  border-radius:7px;
  cursor:pointer;
  font-size:10px;
}

.copy-code:hover{
  color:#fff;
  border-color:rgba(255,70,85,.45);
}

.code-body{
  margin:0;
  padding:14px;
  overflow-x:auto;
  color:#eee;
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-size:12px;
  line-height:1.65;
  white-space:pre;
}

/* ================= ACTIONS ================= */

.actions{
  display:flex;
  gap:3px;
  margin-top:8px;
  align-items:center;
}

.action-btn{
  width:31px;
  height:29px;
  border:1px solid transparent;
  background:transparent;
  color:#666870;
  border-radius:8px;
  cursor:pointer;
  transition:.15s;
}

.action-btn:hover{
  color:#fff;
  border-color:rgba(255,60,75,.17);
  background:rgba(255,40,55,.07);
}

.edit-btn{
  color:#8c8c92;
}

/* ================= THINKING ================= */

.thinking{
  display:flex;
  align-items:center;
  gap:5px;
  height:30px;
}

.thinking span{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#ff4354;
  animation:think 1.1s infinite;
}

.thinking span:nth-child(2){animation-delay:.15s}
.thinking span:nth-child(3){animation-delay:.30s}

@keyframes think{
  0%,60%,100%{
    transform:translateY(0);
    opacity:.3
  }
  30%{
    transform:translateY(-5px);
    opacity:1
  }
}

/* ================= WELCOME ================= */

.welcome{
  max-width:800px;
  margin:7vh auto 45px;
  text-align:center;
}

.welcome-logo{
  width:64px;
  height:64px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:18px;
  color:#ff5362;
  font-weight:900;
  font-size:22px;
  background:
    linear-gradient(
      145deg,
      rgba(105,18,30,.85),
      rgba(20,5,8,.75)
    );
  border:1px solid rgba(255,60,75,.30);
  box-shadow:0 0 40px rgba(255,20,40,.15);
  backdrop-filter:blur(20px);
}

.welcome h1{
  margin:16px 0 7px;
  font-size:28px;
}

.welcome p{
  color:#77777e;
  font-size:13px;
  margin-bottom:25px;
}

.suggestions{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:9px;
}

.suggestion{
  padding:10px 13px;
  border-radius:10px;
  border:1px solid rgba(255,55,70,.17);
  background:rgba(30,7,11,.50);
  color:#a7a7ad;
  cursor:pointer;
  transition:.18s;
}

.suggestion:hover{
  color:#fff;
  transform:translateY(-1px);
  border-color:rgba(255,70,85,.40);
}

/* ================= INPUT ================= */

.bottom{
  position:fixed;
  left:250px;
  right:0;
  bottom:0;
  padding:10px 17px 15px;
  z-index:30;
  background:
    linear-gradient(
      transparent,
      rgba(7,3,5,.94) 30%,
      rgba(7,3,5,.98)
    );
}

.inputbox{
  max-width:900px;
  margin:auto;
  display:flex;
  align-items:flex-end;
  gap:5px;
  padding:6px;
  border-radius:16px;
  background:rgba(17,6,9,.72);
  border:1px solid rgba(255,60,75,.24);
  box-shadow:
    0 12px 45px rgba(0,0,0,.30),
    inset 0 1px 0 rgba(255,255,255,.025);
  backdrop-filter:blur(25px) saturate(150%);
}

textarea{
  flex:1;
  min-height:42px;
  max-height:150px;
  resize:none;
  padding:10px;
  outline:none;
  border:0;
  background:transparent;
  color:white;
  font:inherit;
  font-size:14px;
}

textarea::placeholder{color:#606066}

.mic,.send{
  width:41px;
  height:41px;
  flex-shrink:0;
  border-radius:10px;
  border:0;
  cursor:pointer;
}

.mic{
  background:rgba(255,40,55,.05);
  color:#aaa;
}

.mic:hover{
  color:#fff;
  background:rgba(255,40,55,.10);
}

.send{
  color:#fff;
  background:linear-gradient(145deg,#f13b4d,#bc1728);
  box-shadow:0 5px 18px rgba(255,30,50,.20);
}

.note{
  margin-top:5px;
  text-align:center;
  color:#49494f;
  font-size:9px;
}

/* ================= VOICE PANEL ================= */

.voice-panel{
  position:fixed;
  right:18px;
  bottom:92px;
  width:min(380px,calc(100vw - 28px));
  padding:14px;
  display:none;
  z-index:100;
  border:1px solid rgba(255,65,80,.25);
  border-radius:17px;
  background:rgba(13,5,8,.88);
  backdrop-filter:blur(30px) saturate(150%);
  box-shadow:0 20px 70px rgba(0,0,0,.50);
}

.voice-panel.show{
  display:block;
  animation:panelIn .18s ease;
}

@keyframes panelIn{
  from{opacity:0;transform:translateY(8px) scale(.98)}
  to{opacity:1;transform:none}
}

.voice-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.voice-title strong{
  font-size:13px;
}

.close-voice{
  border:0;
  background:transparent;
  color:#888;
  cursor:pointer;
  font-size:18px;
}

.voice-select{
  width:100%;
  padding:10px;
  border-radius:10px;
  background:#17080c;
  color:white;
  border:1px solid rgba(255,60,75,.20);
  outline:none;
}

.voice-controls{
  display:flex;
  gap:7px;
  margin-top:10px;
}

.voice-control{
  flex:1;
  border:1px solid rgba(255,60,75,.18);
  background:rgba(255,35,50,.06);
  color:#ccc;
  border-radius:9px;
  padding:9px;
  cursor:pointer;
}

.voice-control:hover{
  color:#fff;
  background:rgba(255,35,50,.11);
}

.voice-progress{
  width:100%;
  margin-top:12px;
  accent-color:#ff3d50;
}

/* ================= MOBILE ================= */

.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  z-index:40;
}

@media(max-width:700px){

  .sidebar{
    position:fixed;
    left:-270px;
    top:0;
    transition:.22s ease;
    width:250px;
    box-shadow:20px 0 60px rgba(0,0,0,.35);
  }

  .sidebar.open{
    left:0;
  }

  .overlay.show{
    display:block;
  }

  .menu-btn{
    display:block;
  }

  .bottom{
    left:0;
  }

  .messages{
    padding:22px 11px 160px;
  }

  .message-inner{
    max-width:100%;
  }

  .content{
    max-width:calc(100vw - 72px);
  }

  .welcome{
    margin-top:6vh;
  }

  .welcome h1{
    font-size:23px;
  }
}
</style>
</head>

<body>

<div class="app">

  <aside class="sidebar" id="sidebar">

    <div class="logo">
      <span>ARES</span>
      <div class="logo-dot"></div>
    </div>

    <button class="newchat" onclick="newChat()">
      ＋ New Chat
    </button>

    <div class="history-title">Recent Chats</div>

    <div class="history" id="history"></div>

    <div class="sidebar-footer">
      ARES AI • Secure Lab Assistant
    </div>

  </aside>

  <div class="overlay" id="overlay" onclick="closeSidebar()"></div>

  <main class="main">

    <header class="header">

      <div class="header-left">

        <button
          class="menu-btn"
          onclick="toggleSidebar()">
          ☰
        </button>

        <div class="header-title">
          ARES AI
        </div>

      </div>

      <div class="header-status">
        <span class="status-dot"></span>
        Online
      </div>

    </header>

    <div class="messages" id="messages"></div>

    <div class="bottom">

      <div class="inputbox">

        <textarea
          id="input"
          rows="1"
          placeholder="Message ARES..."></textarea>

        <button
          class="mic"
          id="micButton"
          title="Voice assistant"
          onclick="toggleVoicePanel()">
          🎙
        </button>

        <button
          class="send"
          id="sendButton"
          onclick="sendMessage()"
          title="Send">
          ➤
        </button>

      </div>

      <div class="note">
        ARES AI can make mistakes. Verify important information.
      </div>

    </div>

  </main>

</div>

<!-- ================= VOICE PANEL ================= -->

<div class="voice-panel" id="voicePanel">

  <div class="voice-title">

    <strong>ARES Voice Assistant</strong>

    <button
      class="close-voice"
      onclick="closeVoicePanel()">
      ×
    </button>

  </div>

  <select id="voiceSelect" class="voice-select">
    <option>Loading voices...</option>
  </select>

  <div class="voice-controls">

    <button
      class="voice-control"
      onclick="speakCurrent()">
      ▶ Play
    </button>

    <button
      class="voice-control"
      onclick="pauseSpeech()">
      ⏸ Pause
    </button>

    <button
      class="voice-control"
      onclick="resumeSpeech()">
      ▶ Resume
    </button>

    <button
      class="voice-control"
      onclick="stopSpeech()">
      ■ Stop
    </button>

  </div>

  <input
    id="speechProgress"
    class="voice-progress"
    type="range"
    min="0"
    max="0"
    value="0"
    step="1"
    onchange="seekSpeech(this.value)">

</div>

<script>

/* =========================================================
   ARES CONFIG
========================================================= */

const API_URL =
  "https://ares-cyber-intelligence.vercel.app/api/chat";


/* =========================================================
   ELEMENTS
========================================================= */

const input =
  document.getElementById("input");

const messages =
  document.getElementById("messages");

const historyEl =
  document.getElementById("history");

const sendButton =
  document.getElementById("sendButton");

const sidebar =
  document.getElementById("sidebar");

const overlay =
  document.getElementById("overlay");

const voicePanel =
  document.getElementById("voicePanel");

const voiceSelect =
  document.getElementById("voiceSelect");

const speechProgress =
  document.getElementById("speechProgress");


/* =========================================================
   CHAT STORAGE
========================================================= */

let chats =
  JSON.parse(
    localStorage.getItem("ares_chats_v2") || "[]"
  );

let currentChatId =
  localStorage.getItem("ares_current_chat") || null;


/* =========================================================
   CHAT HELPERS
========================================================= */

function saveChats(){

  localStorage.setItem(
    "ares_chats_v2",
    JSON.stringify(chats)
  );

  if(currentChatId){
    localStorage.setItem(
      "ares_current_chat",
      currentChatId
    );
  }
}


function getCurrentChat(){

  return chats.find(
    c => c.id === currentChatId
  );
}


function createChat(){

  const chat = {
    id:Date.now().toString(),
    title:"New Chat",
    messages:[],
    updatedAt:Date.now()
  };

  chats.push(chat);

  currentChatId =
    chat.id;

  saveChats();

  return chat;
}


function ensureChat(){

  let chat =
    getCurrentChat();

  if(!chat){
    chat = createChat();
  }

  return chat;
}


/* =========================================================
   SIDEBAR HISTORY
========================================================= */

function renderHistory(){

  historyEl.innerHTML = "";

  [...chats]
    .sort((a,b)=>b.updatedAt-a.updatedAt)
    .forEach(chat => {

      const item =
        document.createElement("div");

      item.className =
        "history-item" +
        (chat.id === currentChatId
          ? " active"
          : "");

      const dot =
        document.createElement("span");

      dot.className =
        "history-dot";

      const title =
        document.createElement("span");

      title.textContent =
        chat.title || "New Chat";

      item.appendChild(dot);
      item.appendChild(title);

      item.onclick =
        () => loadChat(chat.id);

      historyEl.appendChild(item);

    });
}


function loadChat(id){

  currentChatId = id;

  saveChats();

  renderHistory();

  renderCurrentChat();

  closeSidebar();

  input.focus();
}


/* =========================================================
   NEW CHAT
========================================================= */

function newChat(){

  stopSpeech();

  createChat();

  renderHistory();

  renderCurrentChat();

  input.value = "";

  input.focus();

  closeSidebar();
}


/* =========================================================
   RENDER CHAT
========================================================= */

function renderCurrentChat(){

  messages.innerHTML = "";

  const chat =
    getCurrentChat();

  if(!chat || !chat.messages.length){

    messages.appendChild(
      createWelcome()
    );

    return;
  }

  chat.messages.forEach(msg => {

    addMessageToUI(
      msg.role,
      msg.content,
      false,
      msg.id
    );

  });

  scrollBottom();
}


/* =========================================================
   WELCOME
========================================================= */

function createWelcome(){

  const div =
    document.createElement("div");

  div.className = "welcome";

  div.innerHTML = `
    <div class="welcome-logo">A</div>

    <h1>How can I help you?</h1>

    <p>

/* =========================================================
   SAFE MARKDOWN RENDERER
========================================================= */

function escapeHTML(text){

  return text
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");
}


function inlineMarkdown(text){

  let x =
    escapeHTML(text);

  x =
    x.replace(
      /`([^`]+)`/g,
      '<span class="inline-code">$1</span>'
    );

  x =
    x.replace(
      /\*\*(.*?)\*\*/g,
      "<strong>$1</strong>"
    );

  return x;
}


function renderRichText(text){

  const parts =
    text.split(/```/);

  let html = "";

  parts.forEach((part,index)=>{

    if(index % 2 === 1){

      let lines =
        part.split("\n");

      let language =
        "code";

      if(
        lines[0] &&
        /^[a-zA-Z0-9+#.-]+$/.test(lines[0].trim())
      ){

        language =
          lines.shift().trim();

      }

      const code =
        lines.join("\n");

      const id =
        "code_" +
        Date.now() +
        "_" +
        Math.random()
          .toString(36)
          .slice(2);

      html += `
        <div class="code-card">

          <div class="code-head">

            <span class="code-lang">
              ${escapeHTML(language)}
            </span>

            <button
              class="copy-code"
              data-code-id="${id}">
              ⧉ Copy
            </button>

          </div>

          <pre
            class="code-body"
            id="${id}">${escapeHTML(code)}</pre>

        </div>
      `;

    }else{

      const lines =
        part.split("\n");

      html += lines
        .map(line =>
          line.trim()
            ? `<p>${inlineMarkdown(line)}</p>`
            : ""
        )
        .join("");

    }

  });

  return html;
}


/* =========================================================
   MESSAGE UI
========================================================= */

function addMessageToUI(
  type,
  text,
  scroll=true,
  id=null
){

  const message =
    document.createElement("div");

  message.className =
    "message " + type;

  if(id){
    message.dataset.messageId = id;
  }

  const inner =
    document.createElement("div");

  inner.className =
    "message-inner";

  const avatar =
    document.createElement("div");

  avatar.className =
    "avatar";

  avatar.textContent =
    type === "assistant"
      ? "A"
      : "U";

  const content =
    document.createElement("div");

  content.className =
    "content";

  const name =
    document.createElement("div");

  name.className =
    "name";

  name.textContent =
    type === "assistant"
      ? "ARES"
      : "YOU";

  const textDiv =
    document.createElement("div");

  textDiv.className =
    "text rich";

  if(type === "assistant"){

    textDiv.innerHTML =
      renderRichText(text);

  }else{

    textDiv.textContent =
      text;

  }

  content.appendChild(name);
  content.appendChild(textDiv);

  content.appendChild(
    createActions(type,text,id)
  );

  inner.appendChild(avatar);
  inner.appendChild(content);

  message.appendChild(inner);

  messages.appendChild(message);

  /* Copy buttons inside code blocks */

  textDiv
    .querySelectorAll(".copy-code")
    .forEach(button => {

      button.onclick = async () => {

        const codeId =
          button.dataset.codeId;

        const code =
          document
            .getElementById(codeId)
            ?.textContent || "";

        try{

          await navigator.clipboard.writeText(code);

          button.textContent =
            "✓ Copied";

          setTimeout(()=>{
            button.textContent =
              "⧉ Copy";
          },1200);

        }catch(e){

          button.textContent =
            "Copy failed";

        }

      };

    });

  if(scroll){
    scrollBottom();
  }

  return message;
}


/* =========================================================
   ACTIONS
========================================================= */

function createActions(
  type,
  text,
  id
){

  const actions =
    document.createElement("div");

  actions.className =
    "actions";


  /* COPY WHOLE ANSWER */

  const copy =
    document.createElement("button");

  copy.className =
    "action-btn";

  copy.title =
    "Copy answer";

  copy.textContent =
    "⧉";

  copy.onclick =
    async () => {

      await navigator.clipboard.writeText(text);

      copy.textContent = "✓";

      setTimeout(()=>{
        copy.textContent="⧉";
      },1000);

    };


  /* SPEAK */

  const speak =
    document.createElement("button");

  speak.className =
    "action-btn";

  speak.title =
    "Read aloud";

  speak.textContent =
    "🔊";

  speak.onclick =
    () => {

      currentSpeechText =
        text;

      currentSpeechIndex = 0;

      openVoicePanel();

      speakCurrent();

    };


  actions.appendChild(copy);
  actions.appendChild(speak);


  /* EDIT USER MESSAGE */

  if(type === "user"){

    const edit =
      document.createElement("button");

    edit.className =
      "action-btn edit-btn";

    edit.title =
      "Edit and resend";

    edit.textContent =
      "✎";

    edit.onclick =
      () => editMessage(id);

    actions.appendChild(edit);


    /* DELETE USER MESSAGE */

    const del =
      document.createElement("button");

    del.className =
      "action-btn";

    del.title =
      "Delete message";

    del.textContent =
      "×";

    del.onclick =
      () => deleteMessage(id);

    actions.appendChild(del);

  }

  return actions;
}


/* =========================================================
   EDIT MESSAGE
========================================================= */

function editMessage(id){

  const chat =
    getCurrentChat();

  if(!chat) return;

  const index =
    chat.messages.findIndex(
      m => m.id === id
    );

  if(index === -1) return;

  const oldText =
    chat.messages[index].content;

  input.value =
    oldText;

  input.focus();

  /*
    Remove the selected message and everything
    after it. Sending again creates a fresh answer.
  */

  chat.messages =
    chat.messages.slice(0,index);

  chat.updatedAt =
    Date.now();

  saveChats();

  renderCurrentChat();

  input.selectionStart =
    input.value.length;

  input.selectionEnd =
    input.value.length;
}


/* =========================================================
   DELETE MESSAGE
========================================================= */

function deleteMessage(id){

  const chat =
    getCurrentChat();

  if(!chat) return;

  chat.messages =
    chat.messages.filter(
      m => m.id !== id
    );

  chat.updatedAt =
    Date.now();

  saveChats();

  renderCurrentChat();
}


/* =========================================================
   THINKING
========================================================= */

function addThinking(){

  const message =
    document.createElement("div");

  message.className =
    "message assistant";

  message.innerHTML = `
    <div class="message-inner">

      <div class="avatar">A</div>

      <div class="content">

        <div class="name">ARES</div>

        <div class="thinking">
          <span></span>
          <span></span>
          <span></span>
        </div>

      </div>

    </div>
  `;

  messages.appendChild(message);

  scrollBottom();

  return message;
}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage(){

  const question =
    input.value.trim();

  if(!question) return;

  const chat =
    ensureChat();


  /* USER MESSAGE */

  const userMessage = {
    id:Date.now().toString(),
    role:"user",
    content:question
  };

  chat.messages.push(
    userMessage
  );

  chat.updatedAt =
    Date.now();

  if(chat.title === "New Chat"){

    chat.title =
      question.length > 42
        ? question.slice(0,42) + "..."
        : question;

  }

  saveChats();

  renderHistory();

  addMessageToUI(
    "user",
    question,
    true,
    userMessage.id
  );

  input.value = "";

  input.style.height = "auto";

  sendButton.disabled = true;

  sendButton.style.opacity = ".5";

  const thinking =
    addThinking();


  try{

    /*
      Send recent conversation context.
      This makes ARES remember the current chat.
    */

    const conversation =
      chat.messages.slice(-24).map(
        m => ({
          role:m.role,
          content:m.content
        })
      );


    const response =
      await fetch(
        API_URL,
        {
          method:"POST",

          headers:{
            "Content-Type":"application/json"
          },

          body:JSON.stringify({
            message:question,
            messages:conversation
          })
        }
      );


    const raw =
      await response.text();

    let data = {};

    try{
      data =
        raw ? JSON.parse(raw) : {};
    }catch(e){}


    thinking.remove();


    if(!response.ok){

      addMessageToUI(
        "assistant",
        "ARES Error: " +
        (
          data?.error ||
          `Server error (${response.status})`
        )
      );

      return;
    }


    const reply =
      data?.reply;


    if(!reply){

      addMessageToUI(
        "assistant",
        "ARES Error: Backend returned an empty response."
      );

      return;
    }


    const assistantMessage = {
      id:Date.now().toString(),
      role:"assistant",
      content:reply
    };

    chat.messages.push(
      assistantMessage
    );

    chat.updatedAt =
      Date.now();

    saveChats();

    addMessageToUI(
      "assistant",
      reply,
      true,
      assistantMessage.id
    );

    renderHistory();


  }catch(error){

    thinking.remove();

    console.error(error);

    addMessageToUI(
      "assistant",
      "ARES Error: Could not connect to the backend."
    );

  }finally{

    sendButton.disabled = false;

    sendButton.style.opacity = "1";

    input.focus();

  }
}


/* =========================================================
   VOICE SYSTEM
========================================================= */

let voices = [];

let currentSpeechText = "";

let speechChunks = [];

let currentSpeechIndex = 0;


function loadVoices(){

  voices =
    window.speechSynthesis
      ? speechSynthesis.getVoices()
      : [];

  voiceSelect.innerHTML = "";

  if(!voices.length){

    voiceSelect.innerHTML =
      "<option>No browser voices available</option>";

    return;
  }

  voices.forEach((voice,index)=>{

    const option =
      document.createElement("option");

    option.value =
      index;

    option.textContent =
      voice.name +
      " • " +
      voice.lang;

    voiceSelect.appendChild(option);

  });

}


if("speechSynthesis" in window){

  loadVoices();

  speechSynthesis.onvoiceschanged =
    loadVoices;

}


/* =========================================================
   SPEECH CHUNKS
========================================================= */

function makeSpeechChunks(text){

  /*
    Browser TTS is more reliable when long answers
    are split into smaller chunks.
  */

  return text
    .replace(/\s+/g," ")
    .match(/[^.!?]+[.!?]+|[^.!?]+$/g)
    ?.map(x=>x.trim())
    .filter(Boolean)
    || [text];
}


function openVoicePanel(){

  voicePanel.classList.add("show");

  loadVoices();
}


function toggleVoicePanel(){

  voicePanel.classList.toggle("show");

  if(
    voicePanel.classList.contains("show")
  ){
    loadVoices();
  }

}


function closeVoicePanel(){

  stopSpeech();

  voicePanel.classList.remove("show");

}


function speakCurrent(){

  if(!("speechSynthesis" in window)){

    alert(
      "Speech synthesis is not supported by this browser."
    );

    return;
  }

  if(!currentSpeechText) return;

  speechSynthesis.cancel();

  speechChunks =
    makeSpeechChunks(
      currentSpeechText
    );

  if(currentSpeechIndex >= speechChunks.length){

    currentSpeechIndex = 0;

  }

  updateSpeechProgress();

  speakChunk(currentSpeechIndex);
}


function speakChunk(index){

  if(index < 0) index = 0;

  if(index >= speechChunks.length){

    speechProgress.value =
      speechChunks.length;

    return;
  }

  currentSpeechIndex =
    index;

  updateSpeechProgress();

  const utterance =
    new SpeechSynthesisUtterance(
      speechChunks[index]
    );


  const selectedIndex =
    Number(voiceSelect.value);

  if(
    voices[selectedIndex]
  ){
    utterance.voice =
      voices[selectedIndex];
  }

  utterance.rate = 0.96;
  utterance.pitch = 1.0;
  utterance.volume = 1.0;


  utterance.onend =
    () => {

      if(
        currentSpeechIndex <
        speechChunks.length - 1
      ){

        currentSpeechIndex++;

        speakChunk(
          currentSpeechIndex
        );

      }

    };


  speechSynthesis.speak(
    utterance
  );
}


function updateSpeechProgress(){

  speechProgress.max =
    Math.max(
      0,
      speechChunks.length - 1
    );

  speechProgress.value =
    currentSpeechIndex;
}


function seekSpeech(value){

  if(!speechChunks.length)
    return;

  speechSynthesis.cancel();

  currentSpeechIndex =
    Number(value);

  speakChunk(
    currentSpeechIndex
  );
}


function pauseSpeech(){

  if(
    "speechSynthesis" in window &&
    speechSynthesis.speaking
  ){

    speechSynthesis.pause();

  }

}


function resumeSpeech(){

  if(
    "speechSynthesis" in window &&
    speechSynthesis.paused
  ){

    speechSynthesis.resume();

  }

}


function stopSpeech(){

  if("speechSynthesis" in window){

    speechSynthesis.cancel();

  }

  currentSpeechText = "";

  speechChunks = [];

  currentSpeechIndex = 0;

  speechProgress.max = 0;
  speechProgress.value = 0;
}

   SIDEBAR MOBILE
========================================================= */

function toggleSidebar(){

  sidebar.classList.toggle("open");

  overlay.classList.toggle(
    "show"
  );

}


function closeSidebar(){

  sidebar.classList.remove("open");

  overlay.classList.remove(
    "show"
  );

}


/* =========================================================
   SCROLL
========================================================= */

function scrollBottom(){

  messages.scrollTop =
    messages.scrollHeight;
}


/* =========================================================
   ENTER SEND
========================================================= */

input.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =========================================================
   AUTO RESIZE
========================================================= */

input.addEventListener(
  "input",
  () => {

    input.style.height =
      "auto";

    input.style.height =
      Math.min(
        input.scrollHeight,
        150
      ) + "px";

  }
);


/* =========================================================
   INITIALIZE
========================================================= */

if(!chats.length){

  createChat();

}

if(
  !chats.some(
    c => c.id === currentChatId
  )
){

  currentChatId =
    chats[0].id;

}

saveChats();

renderHistory();

renderCurrentChat();

input.focus();

</script>
