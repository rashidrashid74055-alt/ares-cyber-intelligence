<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0d10">
<title>ARES AI</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#0b0d10;
  --panel:#111418;
  --panel2:#171a1f;
  --border:#292e35;
  --text:#f4f4f5;
  --muted:#969ba5;
  --accent:#19d3a2;
  --accent2:#0fa67f;
  --user:#19352f;
  --danger:#ef6b73;
}

body{
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--text);
  height:100vh;
  overflow:hidden;
}

/* APP */

.app{
  height:100vh;
  display:flex;
}

/* SIDEBAR */

.sidebar{
  width:270px;
  background:#0e1013;
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  transition:.25s;
  flex-shrink:0;
}

.brand{
  height:64px;
  display:flex;
  align-items:center;
  gap:11px;
  padding:0 18px;
  border-bottom:1px solid var(--border);
}

.logo{
  width:34px;
  height:34px;
  border:1px solid var(--accent);
  border-radius:10px;
  display:grid;
  place-items:center;
  color:var(--accent);
  font-weight:800;
}

.brand strong{
  font-size:15px;
  letter-spacing:1px;
}

.brand small{
  display:block;
  color:var(--muted);
  font-size:9px;
  letter-spacing:2px;
  margin-top:2px;
}

.new-chat{
  margin:14px;
  border:1px solid var(--border);
  background:#171a1f;
  color:var(--text);
  border-radius:10px;
  padding:11px 13px;
  cursor:pointer;
  text-align:left;
  font-size:14px;
}

.new-chat:hover{
  border-color:#3a414a;
  background:#1c2025;
}

.history-title{
  padding:8px 16px;
  color:#777d87;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:1px;
}

.history{
  flex:1;
  overflow:auto;
  padding:0 9px;
}

.chat-item{
  padding:11px 10px;
  border-radius:8px;
  color:#c7cbd1;
  font-size:13px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  cursor:pointer;
  margin-bottom:3px;
}

.chat-item:hover,
.chat-item.active{
  background:#181c21;
  color:#fff;
}

.sidebar-bottom{
  border-top:1px solid var(--border);
  padding:13px 15px;
  color:#777d87;
  font-size:11px;
}

/* MAIN */

.main{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  background:
    radial-gradient(circle at 50% 20%,rgba(25,211,162,.055),transparent 35%),
    var(--bg);
}

/* TOPBAR */

.topbar{
  height:64px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  flex-shrink:0;
}

.menu-btn{
  display:none;
  border:0;
  background:transparent;
  color:white;
  font-size:23px;
  cursor:pointer;
}

.model-name{
  font-size:14px;
  font-weight:600;
}

.status{
  font-size:11px;
  color:var(--accent);
  display:flex;
  align-items:center;
  gap:6px;
}

.dot{
  width:7px;
  height:7px;
  background:var(--accent);
  border-radius:50%;
  box-shadow:0 0 10px var(--accent);
}

/* CHAT */

.chat{
  flex:1;
  overflow-y:auto;
  scroll-behavior:smooth;
  padding:30px 20px 150px;
}

.chat-inner{
  max-width:820px;
  margin:auto;
}

/* WELCOME */

.welcome{
  min-height:60vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:20px;
}

.welcome-logo{
  width:64px;
  height:64px;
  border:1px solid var(--accent);
  border-radius:20px;
  display:grid;
  place-items:center;
  color:var(--accent);
  font-size:25px;
  font-weight:800;
  margin-bottom:20px;
  box-shadow:0 0 35px rgba(25,211,162,.08);
}

.welcome h1{
  font-size:32px;
  margin-bottom:10px;
}

.welcome p{
  color:var(--muted);
  max-width:560px;
  line-height:1.6;
}

.suggestions{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  width:100%;
  max-width:620px;
  margin-top:28px;
}

.suggestion{
  padding:14px;
  border:1px solid var(--border);
  background:#111418;
  border-radius:12px;
  color:#cfd2d7;
  cursor:pointer;
  text-align:left;
  font-size:13px;
}

.suggestion:hover{
  border-color:#3c444d;
}

/* MESSAGE */

.message{
  display:flex;
  gap:13px;
  margin-bottom:28px;
}

.avatar{
  width:31px;
  height:31px;
  border-radius:9px;
  display:grid;
  place-items:center;
  flex-shrink:0;
  font-size:11px;
  font-weight:800;
}

.user .avatar{
  background:#26312f;
  color:#c9fff1;
}

.assistant .avatar{
  background:#122a25;
  border:1px solid #1c705c;
  color:var(--accent);
}

.message-body{
  min-width:0;
  flex:1;
}

.message-name{
  font-size:12px;
  color:#9298a2;
  margin-bottom:7px;
}

.message-text{
  line-height:1.65;
  color:#e7e8ea;
  white-space:pre-wrap;
  word-break:break-word;
}

.user .message-text{
  background:var(--user);
  padding:11px 14px;
  border-radius:12px;
  display:inline-block;
}

/* CODE */

.code{
  background:#090b0e;
  border:1px solid #282e35;
  border-radius:10px;
  margin:12px 0;
  overflow:hidden;
}

.code-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:8px 11px;
  color:#858b95;
  font-size:10px;
  border-bottom:1px solid #282e35;
}

.code button{
  border:0;
  background:transparent;
  color:#aaa;
  cursor:pointer;
}

.code pre{
  padding:14px;
  overflow:auto;
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-size:12px;
  line-height:1.6;
  color:#d9f8ee;
}

/* ACTIONS */

.actions{
  display:flex;
  gap:5px;
  margin-top:9px;
}

.action{
  border:1px solid transparent;
  background:transparent;
  color:#737983;
  border-radius:7px;
  padding:6px 8px;
  cursor:pointer;
  font-size:13px;
}

.action:hover{
  background:#181c21;
  color:#e5e7eb;
}

.action.active{
  color:var(--accent);
}

/* COMPOSER */

.composer-wrap{
  position:fixed;
  bottom:0;
  left:270px;
  right:0;
  padding:18px 20px 22px;
  background:linear-gradient(transparent,var(--bg) 35%);
}

.composer{
  max-width:820px;
  margin:auto;
  border:1px solid #343a42;
  background:#111418;
  border-radius:15px;
  display:flex;
  align-items:flex-end;
  padding:8px;
  box-shadow:0 10px 35px rgba(0,0,0,.3);
}

textarea{
  flex:1;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  color:#fff;
  padding:10px 11px;
  min-height:44px;
  max-height:150px;
  font:inherit;
}

textarea::placeholder{
  color:#676d76;
}

.send,
.mic{
  width:40px;
  height:40px;
  border:0;
  border-radius:10px;
  cursor:pointer;
  display:grid;
  place-items:center;
  flex-shrink:0;
}

.mic{
  background:transparent;
  color:#8a9099;
  font-size:17px;
}

.mic:hover{
  background:#1a1e23;
  color:white;
}

.send{
  background:var(--accent);
  color:#07130f;
  font-weight:800;
}

.send:hover{
  background:#25e1af;
}

.send:disabled{
  opacity:.35;
  cursor:not-allowed;
}

.disclaimer{
  max-width:820px;
  margin:7px auto 0;
  text-align:center;
  font-size:10px;
  color:#656a73;
}

/* MOBILE */

@media(max-width:760px){

  .sidebar{
    position:fixed;
    z-index:20;
    top:0;
    bottom:0;
    left:-280px;
    box-shadow:15px 0 50px rgba(0,0,0,.5);
  }

  .sidebar.open{
    left:0;
  }

  .menu-btn{
    display:block;
  }

  .composer-wrap{
    left:0;
    padding:12px 10px 15px;
  }

  .chat{
    padding:22px 13px 135px;
  }

  .topbar{
    padding:0 13px;
  }

  .suggestions{
    grid-template-columns:1fr;
  }

  .welcome h1{
    font-size:27px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->

  <aside class="sidebar" id="sidebar">

    <div class="brand">
      <div class="logo">A</div>
      <div>
        <strong>ARES AI</strong>
        <small>CYBER INTELLIGENCE</small>
      </div>
    </div>

    <button class="new-chat" onclick="newChat()">
      ＋ New chat
    </button>

    <div class="history-title">Recent chats</div>

    <div class="history" id="history"></div>

    <div class="sidebar-bottom">
      ARES AI · Frontend mode
    </div>

  </aside>

  <!-- MAIN -->

  <main class="main">

    <header class="topbar">
      <button class="menu-btn" onclick="toggleSidebar()">☰</button>

      <div class="model-name">
        ARES AI
      </div>

      <div class="status">
        <span class="dot"></span>
        Online
      </div>
    </header>

    <section class="chat" id="chat">
      <div class="chat-inner" id="messages"></div>
    </section>

    <div class="composer-wrap">

      <form class="composer" id="form">

        <textarea
          id="input"
          rows="1"
          placeholder="Message ARES AI..."
          autocomplete="off"
        ></textarea>

        <button
          type="button"
          class="mic"
          id="mic"
          title="Voice input"
        >🎙</button>

        <button
          type="submit"
          class="send"
          id="send"

      </form>

</div>


<script>

/* =========================
   STATE
========================= */

const STORAGE_KEY = "ares_ai_chats_v3";

let chats = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");

let currentChatId = null;


/* =========================
   ELEMENTS
========================= */

const messages = document.getElementById("messages");
const history = document.getElementById("history");
const input = document.getElementById("input");
const form = document.getElementById("form");
const send = document.getElementById("send");
const sidebar = document.getElementById("sidebar");


/* =========================
   CHAT MANAGEMENT
========================= */

function saveChats(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(chats));
}


function createChat(){

  const chat = {
    id: Date.now().toString(),
    title: "New chat",
    messages: []
  };

  chats.unshift(chat);

  currentChatId = chat.id;

  saveChats();

  renderHistory();
  renderMessages();

}


function newChat(){

  createChat();

  input.focus();

  if(window.innerWidth <= 760){
    sidebar.classList.remove("open");
  }
}


function getCurrentChat(){

  return chats.find(c => c.id === currentChatId);

}


function ensureChat(){

  if(!currentChatId || !getCurrentChat()){
    createChat();
  }

}


function renderHistory(){

  history.innerHTML = "";

  chats.forEach(chat => {

    const item = document.createElement("div");

    item.className =
      "chat-item " +
      (chat.id === currentChatId ? "active" : "");

    item.textContent =
      chat.title || "New chat";

    item.onclick = () => {

      currentChatId = chat.id;

      renderHistory();
      renderMessages();

      if(window.innerWidth <= 760){
        sidebar.classList.remove("open");
      }

    };

    history.appendChild(item);

  });

}


/* =========================
   RENDER MESSAGES
========================= */

function renderMessages(){

  const chat = getCurrentChat();

  messages.innerHTML = "";

  if(!chat || chat.messages.length === 0){

    messages.innerHTML = `
      <div class="welcome">

        <div class="welcome-logo">A</div>

        <h1>How can I help?</h1>

        <p>
          Ask ARES AI about cybersecurity concepts,
          defensive analysis, Linux, networking,
          web security, code and security learning.
        </p>

        <div class="suggestions">

          <button class="suggestion"
            onclick="useSuggestion('Explain how DNS works')">
            Explain how DNS works
          </button>

          <button class="suggestion"
            onclick="useSuggestion('Give me a beginner Linux security checklist')">
            Linux security checklist
          </button>

          <button class="suggestion"
            onclick="useSuggestion('Explain this HTTP request')">
            Analyze HTTP request
          </button>

          <button class="suggestion"
            onclick="useSuggestion('Teach me network security step by step')">
            Learn network security
          </button>

        </div>

      </div>
    `;

    return;
  }


  chat.messages.forEach((msg,index) => {

    addMessageToDOM(
      msg.role,
      msg.text,
      index
    );

  });

  scrollBottom();

}


function addMessageToDOM(role,text,index){

  const wrapper = document.createElement("div");

  wrapper.className =
    "message " +
    (role === "user" ? "user" : "assistant");

  const avatar =
    role === "user" ? "U" : "A";

  wrapper.innerHTML = `

    <div class="avatar">${avatar}</div>

    <div class="message-body">

      <div class="message-name">
        ${role === "user" ? "You" : "ARES AI"}
      </div>

      <div class="message-text">
        ${formatText(text)}
      </div>

      ${
        role === "assistant"
        ?
        `
        <div class="actions">

          <button
            class="action"
            onclick="copyAnswer(${index})"
            title="Copy"
          >⧉</button>

          <button
            class="action"
            onclick="likeAnswer(this)"
            title="Like"
          >♡</button>

          <button
            class="action"
            onclick="dislikeAnswer(this)"
            title="Dislike"
          >♧</button>

          <button
            class="action"
            onclick="speakAnswer(${index})"
            title="Read aloud"
          >🔊</button>

          <button
            class="action"
            onclick="shareAnswer(${index})"
            title="Share"
          >↗</button>

        </div>
        `
        :
        ""
      }

    </div>
  `;

  messages.appendChild(wrapper);

}


/* =========================
   TEXT FORMATTER
========================= */

function escapeHTML(text){

  return text
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");

}


function formatText(text){

  const escaped = escapeHTML(text);

  const parts =
    escaped.split(/```([\s\S]*?)```/g);

  let output = "";

  parts.forEach((part,i)=>{

    if(i % 2 === 1){

      output += `
        <div class="code">

          <div class="code-head">
            <span>CODE</span>
            <button onclick="copyText(this.closest('.code').querySelector('pre').innerText)">
              Copy
            </button>
          </div>

          <pre>${part.trim()}</pre>

        </div>
      `;

    }else{

      output += part;

    }

  });

  return output;

}


/* =========================
   SEND MESSAGE
========================= */

form.addEventListener("submit", async(e)=>{

  e.preventDefault();

  const text = input.value.trim();

  if(!text) return;

  ensureChat();

  const chat = getCurrentChat();

  chat.messages.push({
    role:"user",
    text:text
  });

  if(chat.title === "New chat"){

    chat.title =
      text.substring(0,42) +
      (text.length > 42 ? "..." : "");

  }

  input.value = "";

  autoResize();

  saveChats();

  renderHistory();
  renderMessages();

  send.disabled = true;

  await fakeAIResponse(text);

  send.disabled = false;

});


/* =========================
   AI RESPONSE
========================= */

async function fakeAIResponse(question){

  await new Promise(resolve =>
    setTimeout(resolve,700)
  );

  const answer = generateResponse(question);

  const chat = getCurrentChat();

  chat.messages.push({
    role:"assistant",
    text:answer
  });

  saveChats();

  renderMessages();

}
