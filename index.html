<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#050607">
<title>ARES AI — Cyber Intelligence</title>

<style>
:root{
  --bg:#030506;
  --panel:rgba(10,13,16,.72);
  --panel2:rgba(16,20,23,.58);
  --border:rgba(255,255,255,.11);
  --text:#f4f7f8;
  --muted:#9ca7ad;
  --red:#ff304f;
  --red2:#ff5b68;
  --green:#39ff9a;
  --cyan:#49e6ff;
  --purple:#a77cff;
  --shadow:0 25px 80px rgba(0,0,0,.55);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  margin:0;
}

body{
  background:#020304;
  color:var(--text);
  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  overflow:hidden;
}

/* =========================================================
   LIQUID BACKGROUND
========================================================= */

.background{
  position:fixed;
  inset:0;
  overflow:hidden;
  z-index:0;
  background:
    radial-gradient(
      ellipse at 50% -15%,
      rgba(255,30,55,.38),
      transparent 42%
    ),
    radial-gradient(
      ellipse at 50% 50%,
      rgba(230,235,238,.11),
      transparent 48%
    ),
    radial-gradient(
      ellipse at 50% 115%,
      rgba(0,255,125,.24),
      transparent 45%
    ),
    #020304;
}

/* liquid red area */
.liquid-red{
  position:absolute;
  width:75vw;
  height:38vh;
  top:-20vh;
  left:12%;
  border-radius:50%;
  background:
    radial-gradient(
      ellipse,
      rgba(255,30,50,.30),
      rgba(255,30,50,.08) 42%,
      transparent 70%
    );
  filter:blur(18px);
  animation:redFloat 9s ease-in-out infinite alternate;
}

/* silver liquid area */
.liquid-silver{
  position:absolute;
  width:80vw;
  height:40vh;
  top:28%;
  left:10%;
  border-radius:50%;
  background:
    radial-gradient(
      ellipse,
      rgba(255,255,255,.10),
      rgba(180,190,195,.035) 45%,
      transparent 72%
    );
  filter:blur(28px);
  animation:silverFloat 12s ease-in-out infinite alternate;
}

/* green liquid */
.liquid-green{
  position:absolute;
  width:80vw;
  height:42vh;
  bottom:-25vh;
  left:10%;
  border-radius:50%;
  background:
    radial-gradient(
      ellipse,
      rgba(0,255,125,.24),
      rgba(0,255,125,.06) 45%,
      transparent 72%
    );
  filter:blur(25px);
  animation:greenFloat 11s ease-in-out infinite alternate;
}

@keyframes redFloat{
  from{transform:translate(-4%,0) scale(1)}
  to{transform:translate(5%,8%) scale(1.12)}
}

@keyframes silverFloat{
  from{transform:translate(0,-3%) scale(1)}
  to{transform:translate(4%,5%) scale(1.08)}
}

@keyframes greenFloat{
  from{transform:translate(3%,0) scale(1)}
  to{transform:translate(-4%,-7%) scale(1.12)}
}

/* =========================================================
   SMALL FLOATING GLASS BOXES
========================================================= */

.glass-field{
  position:absolute;
  inset:0;
  overflow:hidden;
  opacity:.72;
}

.glass-box{
  position:absolute;
  width:var(--w);
  height:var(--h);
  left:var(--x);
  top:var(--y);
  border:1px solid rgba(255,255,255,.08);
  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.055),
      rgba(255,255,255,.012)
    );
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  border-radius:8px;
  transform:rotate(var(--r));
  animation:
    boxFloat var(--speed) ease-in-out infinite alternate;
}

.glass-box::after{
  content:"";
  position:absolute;
  inset:4px;
  border:1px solid rgba(255,255,255,.025);
  border-radius:5px;
}

@keyframes boxFloat{
  from{
    transform:
      translate3d(0,0,0)
      rotate(var(--r));
    opacity:.25;
  }
  to{
    transform:
      translate3d(var(--dx),var(--dy),0)
      rotate(calc(var(--r) + 4deg));
    opacity:.65;
  }
}

/* =========================================================
   FALLING CODE
========================================================= */

#matrix{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  opacity:.17;
  pointer-events:none;
}

.background-vignette{
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      90deg,
      rgba(0,0,0,.58),
      transparent 20%,
      transparent 80%,
      rgba(0,0,0,.58)
    ),
    linear-gradient(
      180deg,
      rgba(0,0,0,.20),
      transparent 30%,
      rgba(0,0,0,.48)
    );
  pointer-events:none;
}

/* =========================================================
   APP
========================================================= */

.app{
  position:relative;
  z-index:5;
  display:flex;
  width:100%;
  height:100%;
}

/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{
  width:280px;
  height:100%;
  flex-shrink:0;
  background:rgba(5,7,9,.78);
  border-right:1px solid rgba(255,255,255,.09);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
  display:flex;
  flex-direction:column;
  padding:16px;
  position:relative;
  z-index:20;
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
  padding:8px 8px 18px;
}

.brand-logo{
  width:39px;
  height:39px;
  border-radius:12px;
  display:grid;
  place-items:center;
  color:white;
  font-weight:900;
  font-size:16px;
  letter-spacing:-1px;
  background:
    linear-gradient(
      145deg,
      rgba(255,40,65,.9),
      rgba(90,10,20,.8)
    );
  border:1px solid rgba(255,100,110,.35);
  box-shadow:
    inset 0 1px rgba(255,255,255,.18),
    0 8px 30px rgba(255,20,45,.16);
}

.brand-name{
  font-size:17px;
  font-weight:800;
  letter-spacing:.5px;
}

.brand-sub{
  font-size:10px;
  color:#7d878d;
  margin-top:2px;
  letter-spacing:1.2px;
  text-transform:uppercase;
}

.new-chat{
  width:100%;
  border:1px solid rgba(255,60,80,.25);
  background:
    linear-gradient(
      135deg,
      rgba(255,35,60,.17),
      rgba(255,255,255,.035)
    );
  color:white;
  border-radius:12px;
  padding:12px 13px;
  display:flex;
  align-items:center;
  gap:10px;
  cursor:pointer;
  font-weight:700;
  transition:.2s;
}

.new-chat:hover{
  border-color:rgba(255,60,80,.55);
  transform:translateY(-1px);
}

.history-title{
  color:#687278;
  font-size:10px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  margin:22px 7px 9px;
}

.history{
  overflow:auto;
  flex:1;
}

.history::-webkit-scrollbar,
.messages::-webkit-scrollbar{
  width:5px;
}

.history::-webkit-scrollbar-thumb,
.messages::-webkit-scrollbar-thumb{
  background:rgba(255,255,255,.12);
  border-radius:20px;
}

.history-item{
  width:100%;
  border:1px solid transparent;
  background:transparent;
  color:#bfc7cb;
  border-radius:10px;
  padding:10px;
  text-align:left;
  cursor:pointer;
  margin-bottom:4px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.history-item:hover{
  background:rgba(255,255,255,.045);
}

.history-item.active{
  background:
    linear-gradient(
      135deg,
      rgba(255,35,55,.13),
      rgba(255,255,255,.035)
    );
  border-color:rgba(255,70,90,.16);
  color:white;
}

.sidebar-footer{
  color:#5d666b;
  font-size:10px;
  padding:13px 5px 3px;
  line-height:1.5;
}

/* =========================================================
   MAIN
========================================================= */

.main{
  flex:1;
  min-width:0;
  height:100%;
  display:flex;
  flex-direction:column;
  position:relative;
}

.topbar{
  height:65px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  border-bottom:1px solid rgba(255,255,255,.07);
  background:rgba(3,5,7,.36);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
}

.top-left{
  display:flex;
  align-items:center;
  gap:11px;
}

.mobile-menu{
  display:none;
}

.chat-name{
  font-weight:750;
  font-size:14px;
}

.status{
  display:flex;
  align-items:center;
  gap:7px;
  color:#7e888e;
  font-size:10px;
  margin-top:3px;
}

.status-dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#39ff9a;
  box-shadow:0 0 9px rgba(57,255,154,.7);
}

/* =========================================================
   SPEECH BAR
========================================================= */

.speech-bar{
  position:absolute;
  top:75px;
  right:18px;
  z-index:15;
  width:min(370px,calc(100% - 36px));
  display:none;
  align-items:center;
  gap:9px;
  padding:9px 11px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.11);
  background:rgba(8,11,13,.84);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  box-shadow:var(--shadow);
}

.speech-bar.show{
  display:flex;
}

.speech-icon{
  width:31px;
  height:31px;
  border-radius:10px;
  display:grid;
  place-items:center;
  background:rgba(255,255,255,.07);
  color:#fff;
}

.speech-info{
  flex:1;
  min-width:0;
}

.speech-title{
  font-size:11px;
  font-weight:700;
}

.speech-track{
  height:3px;
  background:rgba(255,255,255,.08);
  border-radius:20px;
  overflow:hidden;
  margin-top:6px;
}

.speech-progress{
  width:0%;
  height:100%;
  background:linear-gradient(90deg,var(--red),var(--purple),var(--cyan));
  border-radius:20px;
}

.speech-btn{
  border:0;
  background:rgba(255,255,255,.06);
  color:white;
  width:29px;
  height:29px;
  border-radius:9px;
  cursor:pointer;
  display:grid;
  place-items:center;
}

.speech-btn:hover{
  background:rgba(255,255,255,.12);
}

/* =========================================================
   MESSAGES
========================================================= */

.messages{
  flex:1;
  overflow-y:auto;
  padding:30px max(20px,calc((100% - 940px)/2)) 160px;
  scroll-behavior:smooth;
}

.empty{
  min-height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:20px;
}

.ares-orb{
  width:76px;
  height:76px;
  border-radius:24px;
  display:grid;
  place-items:center;
  font-weight:950;
  font-size:25px;
  letter-spacing:-2px;
  color:white;
  background:
    linear-gradient(
      145deg,
      rgba(255,45,65,.85),
      rgba(20,25,28,.9)
    );
  border:1px solid rgba(255,100,110,.28);
  box-shadow:
    0 20px 65px rgba(255,25,45,.15),
    inset 0 1px rgba(255,255,255,.25);
  margin-bottom:20px;
}

.empty h1{
  margin:0;
  font-size:clamp(28px,5vw,48px);
  letter-spacing:-2px;
  line-height:1;
}

.empty p{
  max-width:570px;
  color:#919ca1;
  line-height:1.7;
  font-size:13px;
  margin:15px 0 0;
}

.message{
  display:flex;
  gap:11px;
  margin:0 auto 25px;
  width:100%;
  max-width:900px;
  animation:messageIn .22s ease-out;
}

@keyframes messageIn{
  from{
    opacity:0;
    transform:translateY(7px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.message.user{
  justify-content:flex-end;
}

.message.user .avatar{
  order:2;
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.12),
      rgba(255,255,255,.035)
    );
}

.avatar{
  width:34px;
  height:34px;
  flex:0 0 34px;
  border-radius:11px;
  display:grid;
  place-items:center;
  font-size:10px;
  font-weight:900;
  margin-top:2px;
  border:1px solid rgba(255,255,255,.10);
  background:
    linear-gradient(
      145deg,
      rgba(255,40,60,.26),
      rgba(255,255,255,.04)
    );
}

.message-body{
  max-width:min(760px,calc(100% - 48px));
}

.message.user .message-body{
  text-align:right;
}

.bubble{
  display:inline-block;
  text-align:left;
  padding:13px 15px;
  border-radius:17px;
  border:1px solid rgba(255,255,255,.08);
  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.075),
      rgba(255,255,255,.025)
    );
  box-shadow:
    0 12px 45px rgba(0,0,0,.20),
    inset 0 1px rgba(255,255,255,.05);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  line-height:1.65;
  font-size:14px;
  color:#edf2f3;
  overflow:hidden;
}

.message.user .bubble{
  background:
    linear-gradient(
      135deg,
      rgba(255,38,62,.18),
      rgba(255,255,255,.045)
    );
  border-color:rgba(255,70,90,.16);
}

/* =========================================================
   MARKDOWN / CODE
========================================================= */

.bubble p{
  margin:0 0 10px;
}

.bubble p:last-child{
  margin-bottom:0;
}

.bubble strong{
  color:#fff;
  font-weight:800;
}

.bubble code.inline-code{
  color:#8fffc0;
  background:rgba(0,255,130,.075);
  border:1px solid rgba(0,255,130,.12);
  padding:2px 6px;
  border-radius:6px;
  font-size:.9em;
}

.code-card{
  position:relative;
  margin:13px 0;
  overflow:hidden;
  border-radius:13px;
  border:1px solid rgba(255,255,255,.10);
  background:
    radial-gradient(
      circle at 100% 0%,
      rgba(95,80,255,.16),
      transparent 42%
    ),
    radial-gradient(
      circle at 0% 100%,
      rgba(0,255,150,.10),
      transparent 45%
    ),
    linear-gradient(
      135deg,
      rgba(20,25,30,.92),
      rgba(7,10,13,.94)
    );
  box-shadow:
    inset 0 1px rgba(255,255,255,.07),
    0 12px 35px rgba(0,0,0,.28);
}

.code-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:8px 10px;
  border-bottom:1px solid rgba(255,255,255,.07);
  background:rgba(255,255,255,.025);
}

.code-lang{
  color:#8d999f;
  font-size:9px;
  text-transform:uppercase;
  letter-spacing:1.3px;
  font-weight:800;
}

.copy-code{
  border:1px solid rgba(255,255,255,.10);
  background:rgba(255,255,255,.055);
  color:#dbe2e5;
  border-radius:7px;
  padding:5px 8px;
  font-size:9px;
  cursor:pointer;
}

.copy-code:hover{
  background:rgba(57,255,154,.10);
  color:#7dffba;
}

.code-content{
  padding:13px;
  overflow-x:auto;
  font-family:
    "JetBrains Mono",
    "SFMono-Regular",
    Consolas,
    monospace;
  font-size:12px;
  line-height:1.7;
  color:#d9e7e2;
  white-space:pre;
}

.code-content::-webkit-scrollbar{
  height:4px;
}

.code-content::-webkit-scrollbar-thumb{
  background:rgba(255,255,255,.13);
  border-radius:20px;
}

/* =========================================================
   ACTIONS
========================================================= */

.actions{
  display:flex;
  align-items:center;
  gap:5px;
  margin-top:7px;
  opacity:.65;
}

.message.user .actions{
  justify-content:flex-end;
}

.action{
  width:27px;
  height:27px;
  display:grid;
  place-items:center;
  border:1px solid transparent;
  background:transparent;
  color:#849096;
  border-radius:8px;
  cursor:pointer;
}

.action:hover{
  color:white;
  background:rgba(255,255,255,.06);
  border-color:rgba(255,255,255,.07);
}

.action svg{
  width:14px;
  height:14px;
}

/* =========================================================
   INPUT
========================================================= */

.composer-wrap{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:
    15px max(18px,calc((100% - 940px)/2))
    max(17px,env(safe-area-inset-bottom));
  background:
    linear-gradient(
      180deg,
      transparent,
      rgba(2,4,5,.88) 25%,
      rgba(2,4,5,.96)
    );
  pointer-events:none;
}

.composer{
  pointer-events:auto;
  display:flex;
  align-items:flex-end;
  gap:8px;
  padding:8px;
  border-radius:17px;
  border:1px solid rgba(255,255,255,.12);
  background:
    linear-gradient(
      135deg,
      rgba(17,21,24,.84),
      rgba(7,10,12,.80)
    );
  box-shadow:
    0 20px 70px rgba(0,0,0,.55),
    inset 0 1px rgba(255,255,255,.08);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
}

#input{
  flex:1;
  min-width:0;
  min-height:42px;
  max-height:160px;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  color:#f4f7f8;
  font:inherit;
  font-size:14px;
  line-height:1.5;
  padding:10px 8px;
}

#input::placeholder{
  color:#68747a;
}

.icon-btn{
  width:40px;
  height:40px;
  flex:0 0 40px;
  border:1px solid rgba(255,255,255,.08);
  border-radius:12px;
  background:rgba(255,255,255,.045);
  color:#adb7bb;
  cursor:pointer;
  display:grid;
  place-items:center;
  transition:.18s;
}

.icon-btn:hover{
  color:white;
  background:rgba(255,255,255,.09);
}

.icon-btn.listening{
  color:#ff6375;
  border-color:rgba(255,70,90,.35);
  background:rgba(255,35,60,.12);
}

.send-btn{
  background:
    linear-gradient(
      145deg,
      rgba(255,42,65,.9),
      rgba(165,15,35,.9)
    );
  color:white;
  border-color:rgba(255,100,110,.25);
  box-shadow:0 7px 25px rgba(255,25,45,.14);
}

.send-btn:hover{
  background:
    linear-gradient(
      145deg,
      rgba(255,60,80,1),
      rgba(190,15,40,1)
    );
  transform:translateY(-1px);
}

.input-hint{
  text-align:center;
  color:#505a5f;
  font-size:9px;
  margin-top:8px;
}

/* =========================================================
   MOBILE
========================================================= */

.sidebar-overlay{
  display:none;
}

@media(max-width:800px){

  .sidebar{
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    transform:translateX(-105%);
    transition:.25s ease;
    box-shadow:30px 0 80px rgba(0,0,0,.45);
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .sidebar-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    z-index:19;
    display:none;
  }

  .sidebar-overlay.show{
    display:block;
  }

  .mobile-menu{
    width:35px;
    height:35px;
    border:0;
    border-radius:10px;
    background:rgba(255,255,255,.055);
    color:white;
    display:grid;
    place-items:center;
    cursor:pointer;
  }

  .topbar{
    height:58px;
    padding:0 12px;
  }

  .messages{
    padding:
      22px 11px
      150px;
  }

  .message{
    gap:7px;
    margin-bottom:20px;
  }

  .avatar{
    width:30px;
    height:30px;
    flex-basis:30px;
    border-radius:9px;
  }

  .message-body{
    max-width:calc(100% - 38px);
  }

  .bubble{
    font-size:13px;
    padding:11px 12px;
    border-radius:15px;
  }

  .code-content{
    font-size:11px;
  }

  .composer-wrap{
    padding-left:10px;
    padding-right:10px;
  }

  .composer{
    border-radius:15px;
  }

  .empty h1{
    font-size:32px;
  }

  .empty p{
    font-size:12px;
  }

  .speech-bar{
    top:67px;
    right:10px;
    width:calc(100% - 20px);
  }
}

@media(prefers-reduced-motion:reduce){
  *,
  *::before,
  *::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    scroll-behavior:auto !important;
  }
}
</style>
</head>

<body>

<!-- =======================================================
     BACKGROUND
======================================================= -->

<div class="background">

  <div class="liquid-red"></div>
  <div class="liquid-silver"></div>
  <div class="liquid-green"></div>

/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   INLINE MARKDOWN
========================================================= */

function inlineMarkdown(text){

  let safe =
    escapeHTML(text);

  safe =
    safe.replace(
      /`([^`]+)`/g,
      '<code class="inline-code">$1</code>'
    );

  safe =
    safe.replace(
      /\*\*([^*]+)\*\*/g,
      "<strong>$1</strong>"
    );

  safe =
    safe.replace(
      /\*([^*]+)\*/g,
      "<em>$1</em>"
    );

  return safe;

}


/* =========================================================
   MARKDOWN + CODE RENDERER
========================================================= */

function renderMarkdown(text){

  const lines =
    String(text || "").split("\n");

  let html = "";

  let inCode = false;

  let codeLang = "code";

  let codeBuffer = [];

  function flushCode(){

    const rawCode =
      codeBuffer.join("\n");

    const escaped =
      escapeHTML(rawCode);

    const codeId =
      "code_" +
      Date.now() +
      "_" +
      Math.random()
        .toString(36)
        .slice(2);

    html += `

      <div class="code-card">

        <div class="code-head">

          <span class="code-lang">
            ${escapeHTML(codeLang || "code")}
          </span>

          <button
            class="copy-code"
            data-code-id="${codeId}">
            Copy
          </button>

        </div>

        <pre
          class="code-content"
          id="${codeId}">${escaped}</pre>

      </div>

    `;

    codeBuffer = [];

  }


  for(let line of lines){

    if(line.trim().startsWith("```")){

      if(!inCode){

        inCode = true;

        codeLang =
          line
            .trim()
            .replace(/^```/,"")
            .trim() ||
          "code";

      }else{

        inCode = false;

        flushCode();

      }

      continue;

    }

    if(inCode){

      codeBuffer.push(line);

      continue;

    }

    if(line.trim() === ""){

      html += "<div style='height:8px'></div>";

      continue;

    }

    if(/^[-*]\s+/.test(line)){

      html +=
        `<div>• ${inlineMarkdown(
          line.replace(/^[-*]\s+/,"")
        )}</div>`;

      continue;

    }

    if(/^\d+\.\s+/.test(line)){

      html +=
        `<div>${inlineMarkdown(line)}</div>`;

      continue;

    }

    html +=
      `<div>${inlineMarkdown(line)}</div>`;

  }

  if(inCode){

    flushCode();

  }

  return html;

}

/* =========================================================

========================================================= */

function renderChat(){

    return;

  chatName.textContent =

  }

/* =========================================================
   RENDER MESSAGE
========================================================= */

function renderMessage(message,index){

  const row =
    document.createElement("div");

  row.className =
    "message " +
    message.role;

  const avatar =
    document.createElement("div");

  avatar.className =
    "avatar";

  avatar.textContent =

  const body =

  body.className =
    "message-body";

  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";

  bubble.innerHTML =
    renderMarkdown(
      message.content
    );

  body.appendChild(bubble);


  const actions =
    document.createElement("div");

  actions.className =
    "actions";


  /* copy */

  const copy =
    createAction(
      icons.copy,
      "Copy"
    );

  copy.onclick =
    async () => {

      await navigator.clipboard
        ?.writeText(
          message.content
        );

      copy.title =
        "Copied";

      setTimeout(
        () => copy.title = "Copy",
        1200
      );

    };

  actions.appendChild(copy);


  /* speak */

  if(message.role === "assistant"){

    const speak =
      createAction(
        icons.speak,
        "Speak"
      );

    speak.onclick =
      () => speakText(
        message.content
      );

    actions.appendChild(speak);


    const like =

      );

      };

      );

        dislike.style.color =
          "#ff6475";

      };

    actions.appendChild(dislike);

  }else{

  }

          await navigator.clipboard
            ?.writeText(

            );

          button.textContent =
            "Copied";

/* =========================================================
   ACTION CREATOR
========================================================= */

function createAction(svg,title){

  const button =

  button.className =

  return button;

/* =========================================================
   EDIT MESSAGE
========================================================= */

function editMessage(index){

  const chat =
    getActiveChat();

  if(!chat) return;

  const msg =
    chat.messages[index];

  if(!msg || msg.role !== "user")
    return;

  input.value =
    msg.content;

  input.focus();

  chat.messages =
    chat.messages.slice(
      0,
      index
    );

  chat.updatedAt =
    Date.now();

  saveChats();

  renderChat();

  autoResize();

}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage(){

  const text =
    input.value.trim();

  if(!text) return;

  let chat =
    getActiveChat();

  if(!chat){

    createChat();

    chat =
      getActiveChat();

  }

  if(!chat) return;


  if(
    chat.messages.length === 0
  ){

    chat.title =
      text.length > 42
        ? text.slice(0,42) + "..."
        : text;

  }


  chat.messages.push({

    role:"user",

    content:text,

    timestamp:Date.now()

  });

  chat.updatedAt =
    Date.now();

  input.value = "";

  autoResize();

  saveChats();

  renderHistory();

  renderChat();


  /* loading */

  const loading =
    document.createElement("div");

  loading.className =
    "message assistant";

  loading.innerHTML = `

    <div class="avatar">A</div>

    <div class="message-body">

      <div class="bubble">

        <span style="
          color:#8a969b;
          display:inline-flex;
          gap:4px;
        ">
          <span>●</span>
          <span style="opacity:.65">●</span>
          <span style="opacity:.35">●</span>
        </span>

      </div>

    </div>

  `;

  messagesEl.appendChild(
    loading
  );

  scrollBottom();


  try{

    const history =
      chat.messages
        .slice(-12)
        .map(m => ({
          role:m.role,
          content:m.content
        }));


    const response =
      await fetch(
        API_URL,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            message:text,

            history:
              history.slice(
                0,
                -1
              )

          })

        }
      );


    const data =
      await response.json()
        .catch(
          () => ({})
        );


    loading.remove();


    if(!response.ok){

      throw new Error(
        data.error ||
        `Server error ${response.status}`
      );

    }


    const reply =
      data.reply ||
      "ARES returned an empty response.";


    chat.messages.push({

      role:"assistant",

      content:reply,

      timestamp:Date.now()

    });


    chat.updatedAt =
      Date.now();

    saveChats();

    renderHistory();

    renderChat();

  }catch(error){

    loading.remove();

    chat.messages.push({

      role:"assistant",

      content:
        "⚠️ **Connection error**\n\n" +
        error.message +
        "\n\nCheck your Vercel backend and LiteRouter API configuration.",

      timestamp:Date.now()

    });

    chat.updatedAt =
      Date.now();

    saveChats();

    renderChat();

  }

}

  input.style.height =

  input.style.height =
    Math.min(
      input.scrollHeight,
      160
    ) + "px";

}

input.addEventListener(
  "input",
  autoResize
);

input.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);

========================================================= */

let voices = [];

function loadVoices(){

  voices =
    window.speechSynthesis
      ? window.speechSynthesis
          .getVoices()
      : [];

}

if("speechSynthesis" in window){

  loadVoices();

  speechSynthesis.onvoiceschanged =
    loadVoices;

}


function cleanSpeechText(text){

  return String(text)

    .replace(/```[\s\S]*?```/g," code block ")

    .replace(/`([^`]+)`/g,"$1")

    .replace(/\*\*/g,"")

    .replace(/[*_#]/g,"")

    .replace(/\n+/g," ")

    .trim();

}


function speakText(text){

  if(!("speechSynthesis" in window)){

    alert(
      "Speech synthesis is not supported by this browser."
    );

    return;

  }


  speechSynthesis.cancel();

  clearInterval(
    speechTimer
  );


  const clean =
    cleanSpeechText(text);

  if(!clean) return;


  const utterance =
    new SpeechSynthesisUtterance(
      clean
    );


  loadVoices();


  /* Prefer a good English voice */

  const preferred =
    voices.find(
      v =>
        /en/i.test(v.lang) &&
        /google|microsoft|natural|premium/i
          .test(v.name)
    ) ||
    voices.find(
      v => /en/i.test(v.lang)
    );


  if(preferred){

    utterance.voice =
      preferred;

  }


  utterance.rate =
    .98;

  utterance.pitch =
    1;


  speechBar.classList.add(
    "show"
  );

  speechTitle.textContent =
    "ARES is speaking";

  speechProgress.style.width =
    "0%";


  const duration =
    Math.max(
      3000,
      clean.length * 42
    );

  const started =
    Date.now();


  speechTimer =
    setInterval(
      () => {

        const progress =
          Math.min(
            100,
            ((Date.now() - started) /
              duration) *
              100
          );

        speechProgress.style.width =
          progress + "%";

      },
      100
    );


  utterance.onend =
    () => {

      clearInterval(
        speechTimer
      );

      speechProgress.style.width =
        "100%";

      setTimeout(
        () => {

          speechBar.classList.remove(
            "show"
          );

          speechProgress.style.width =
            "0%";

        },
        450
      );

    };


  utterance.onerror =
    () => {

      clearInterval(
        speechTimer
      );

      speechBar.classList.remove(
        "show"
      );

    };


  speechSynthesis.speak(
    utterance
  );

}


/* =========================================================
   SPEECH CONTROLS
========================================================= */

stopSpeechBtn.onclick =

    if("speechSynthesis" in window){

      speechSynthesis.cancel();

    }

    clearInterval(

    );

    speechBar.classList.remove(

    );

  };

    );

/* =========================================================
   VOICE INPUT
========================================================= */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if(SpeechRecognition){

  recognition =
    new SpeechRecognition();

  recognition.lang =
    "en-US";

  recognition.continuous =
    false;

  recognition.interimResults =
    true;


  recognition.onstart =
    () => {

      isListening = true;

      micBtn.classList.add(
        "listening"
      );

    };


  recognition.onresult =
    event => {

      let result = "";

      for(
        let i = event.resultIndex;
        i < event.results.length;
        i++
      ){

        result +=
          event.results[i][0].transcript;

      }

      input.value =
        result;

      autoResize();

    };


  recognition.onend =
    () => {

      isListening = false;

      micBtn.classList.remove(
        "listening"
      );

    };


  recognition.onerror =
    () => {

      isListening = false;

      micBtn.classList.remove(
        "listening"
      );

    };


  micBtn.onclick =
    () => {

      if(isListening){

        recognition.stop();

      }else{

        try{

          recognition.start();

        }catch{}

      }

    };

}else{

  micBtn.onclick =
    () => {

      alert(
        "Voice input is not supported by this browser."
      );

    };

}


/* =========================================================
   MATRIX / FALLING GREEN CODE
========================================================= */

const canvas =
  document.getElementById("matrix");

const ctx =
  canvas.getContext("2d");

let matrixWidth =
  0;

let matrixHeight =
  0;

let matrixColumns =
  0;

let drops = [];

const chars =
  "01ABCDEFGHIJKLMNOPQRSTUVWXYZ<>/{}[]$#@:+-_=|";

function resizeMatrix(){

  const dpr =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );

  matrixWidth =
    window.innerWidth;

  matrixHeight =
    window.innerHeight;

  canvas.width =
    matrixWidth * dpr;

  canvas.height =
    matrixHeight * dpr;

  canvas.style.width =
    matrixWidth + "px";

  canvas.style.height =
    matrixHeight + "px";

  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );

  matrixColumns =
    Math.floor(
      matrixWidth / 22
    );

  drops =
    Array.from(
      {
        length:matrixColumns
      },
      () =>
        Math.random() *
        -80
    );

}

function drawMatrix(){

  ctx.clearRect(
    0,
    0,
    matrixWidth,
    matrixHeight
  );

  ctx.font =
    "11px monospace";

  for(
    let i=0;
    i<drops.length;
    i++
  ){

    const char =
      chars[
        Math.floor(
          Math.random() *
          chars.length
        )
      ];

    const x =
      i * 22;

    const y =
      drops[i] * 17;


    ctx.fillStyle =
      Math.random() > .92
        ? "rgba(100,255,175,.55)"
        : "rgba(40,255,140,.28)";

    ctx.fillText(
      char,
      x,
      y
    );


    if(
      y > matrixHeight &&
      Math.random() > .975
    ){

      drops[i] =
        Math.random() * -30;

    }


    drops[i] +=
      .35 +
      Math.random() * .45;

  }

  requestAnimationFrame(
    drawMatrix
  );

}

resizeMatrix();

window.addEventListener(
  "resize",
  resizeMatrix
);

drawMatrix();

    activeChatId =

renderChat();

</script>
